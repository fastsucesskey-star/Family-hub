    updMaid(maid.id,{paidLeaveOverrides:{...(maid.paidLeaveOverrides||{}),[month]:!cur}});
    showToast(!cur?"✅ Leave cut removed!":"Leave cut restored");
  };

  const totalAdvGiven=(maid.advances||[]).reduce((s,a)=>s+parseFloat(a.amount||0),0);
  const totalAdvDeducted=(maid.salaryHistory||[]).reduce((s,h)=>s+parseFloat(h.advance||0),0);
  const advPending=Math.max(0,totalAdvGiven-totalAdvDeducted);

  const allMonths=[...new Set([
    ...(maid.salaryHistory||[]).map(s=>s.month),
    ...(maid.advances||[]).map(a=>a.month),
    ...(maid.leaves||[]).map(l=>l.month),
    ...[...Array(6)].map((_,i)=>{const d=new Date();d.setMonth(d.getMonth()-i);return d.toISOString().slice(0,7);}),
    thisMonth
  ])].sort().reverse();

  const markAttMonth=(ds,cycle)=>{
    const m=maid;
    const ex=(m.attendance||{})[ds]||{};
    updMaid(maid.id,{attendance:{...(m.attendance||{}),[ds]:{...ex,status:cycle}}});
  };

  return (
    <div style={S.page}>
      <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:10}}>
        <button onClick={onBack} style={{background:"#f0f0f0",border:"none",borderRadius:7,padding:"5px 10px",cursor:"pointer",fontSize:12,fontFamily:"Poppins,sans-serif"}}>← Back</button>
        <button onClick={onEdit} style={{background:"#f0f0f0",border:"none",borderRadius:7,padding:"5px 10px",cursor:"pointer",fontSize:12,fontFamily:"Poppins,sans-serif"}}>✏️ Edit</button>
        <button onClick={onDelete} style={S.del}>🗑️</button>
      </div>
      <h2 style={{...S.title,marginTop:0}}>{mt.label} {maid.name}</h2>
      <div style={{fontSize:12,color:"#666",marginTop:-10,marginBottom:10}}>{maid.workDays} • ₹{maid.salary}/month{maid.phone?` • 📞 ${maid.phone}`:""}{maid.joiningDate?` • Joined: ${maid.joiningDate}`:""}</div>

      {/* This month quick stats */}
      <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:8}}>
        {[{l:"Present",v:st.present,c:"#1a6b3c"},{l:"Absent",v:st.absent,c:"#c0392b"},{l:"Half",v:st.half,c:"#c8962a"},
          ...(mt.trackHours?[{l:"Hrs",v:st.totalHours.toFixed(1),c:"#5b8dd9"}]:[]),
          ...(mt.trackMeals?[{l:"Meals",v:st.totalMeals,c:"#9c6dd8"}]:[]),
          {l:"Free Lvs",v:totalFreeLeaves,c:"#5cba8a"},
          {l:"Net Pay",v:"₹"+sal.net,c:"#1a6b3c"}
        ].map(x=>(
          <div key={x.l} style={{...S.card,textAlign:"center",padding:"5px 8px",flex:1,minWidth:50,borderTop:`2px solid ${x.c}`}}>
            <div style={{fontSize:12,fontWeight:800,color:x.c}}>{x.v}</div>
            <div style={{fontSize:9,color:"#aaa"}}>{x.l}</div>
          </div>
        ))}
      </div>

      {advPending>0&&<div style={{...S.card,marginBottom:8,background:"#fff8e1",borderLeft:"4px solid #c8962a"}}>
        <div style={{fontSize:12,color:"#c8962a",fontWeight:700}}>⚠️ Advance Pending: ₹{advPending} • Given: ₹{totalAdvGiven} • Deducted: ₹{totalAdvDeducted}</div>
      </div>}

      <div style={{display:"flex",gap:4,marginBottom:12,overflowX:"auto"}}>
        {[{id:"attendance",l:"📅 Att."},{id:"leaves",l:"🏖️ Leave"},{id:"advance",l:"💰 Adv."},{id:"salary",l:"💵 Salary"},{id:"monthwise",l:"📊 Month"},{id:"history",l:"📈 Rate"}].map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{...S.tab,flexShrink:0,padding:"5px 8px",fontSize:11,...(tab===t.id?S.tabA:{})}}>{t.l}</button>
        ))}
      </div>

      {/* ATTENDANCE TAB — with month selector */}
      {tab==="attendance"&&(
        <div>
          {/* Month selector */}
          <div style={{...S.card,marginBottom:8,display:"flex",gap:8,alignItems:"center"}}>
            <label style={{fontSize:12,fontWeight:700,color:"#1a6b3c",flexShrink:0}}>📅 Month:</label>
            <input type="month" style={{...S.sel,flex:1}} value={attMonth} onChange={e=>setAttMonth(e.target.value)}
              min={maid.joiningDate?maid.joiningDate.slice(0,7):undefined}
              max={thisMonth}
            />
            {attMonth!==thisMonth&&<span style={{...S.badge,background:"#e3f2fd",color:"#5b8dd9",fontSize:10}}>Past Month</span>}
          </div>

          {/* Leave balance for this month */}
          <div style={{...S.card,marginBottom:8,background:"#f0faf4",borderLeft:"4px solid #5cba8a"}}>
            <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
              <div><span style={{fontSize:11,color:"#888"}}>Free leaves this month: </span><b style={{color:"#5cba8a"}}>{getFreeLeaves(attMonth)}</b></div>
              <div><span style={{fontSize:11,color:"#888"}}>Carry forward: </span><b style={{color:"#5b8dd9"}}>{getLeaveBalance(attMonth)}</b></div>
              <div><span style={{fontSize:11,color:"#888"}}>Total free: </span><b style={{color:"#1a6b3c"}}>{getFreeLeaves(attMonth)+getLeaveBalance(attMonth)}</b></div>
              <div><span style={{fontSize:11,color:"#888"}}>Used: </span><b style={{color:"#c0392b"}}>{getMonthStats(attMonth).absent}</b></div>
            </div>
          </div>

          {/* Calendar */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:8}}>
            {["Su","Mo","Tu","We","Th","Fr","Sa"].map(d=><div key={d} style={{textAlign:"center",fontSize:10,fontWeight:700,color:"#888",padding:"2px 0"}}>{d}</div>)}
            {Array.from({length:fd},(_,i)=><div key={"e"+i}/>)}
            {Array.from({length:dim},(_,i)=>{
              const ds=`${attYr}-${String(attMo).padStart(2,"0")}-${String(i+1).padStart(2,"0")}`;
              const a=(maid.attendance||{})[ds]||{}; const s=a.status;
              const isSun=new Date(attYr,attMo-1,i+1).getDay()===0;
              const hasSunday=(maid.workDays||"Mon-Sun").toLowerCase().includes("sun");
              const isSunOff=isSun&&!hasSunday;
              const isT=ds===today; const isFut=ds>today;
              const bg=s==="present"?"#1a6b3c":s==="absent"?"#c0392b":s==="half"?"#c8962a":isSunOff?"#f0f0f0":"#fafafa";
              const cycle=s==="present"?"absent":s==="absent"?"half":s==="half"?"":"present";
              return <div key={ds} onClick={()=>!isFut&&!isSunOff&&markAttMonth(ds,cycle)}
                style={{background:bg,color:s?"#fff":isSunOff?"#aaa":"#2d2d2d",borderRadius:5,padding:"3px 1px",textAlign:"center",fontSize:10,fontWeight:700,cursor:isFut||isSunOff?"default":"pointer",border:isT?"2px solid #c8962a":"2px solid transparent",minHeight:24,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
                {i+1}
                {mt.trackHours&&s==="present"&&a.hours&&<div style={{fontSize:7}}>{a.hours}h</div>}
                {mt.trackMeals&&s==="present"&&a.meals&&<div style={{fontSize:7}}>{a.meals}m</div>}
              </div>;
            })}
          </div>

          {/* Today detail (only for current month) */}
          {attMonth===thisMonth&&(maid.attendance||{})[today]?.status==="present"&&(mt.trackHours||mt.trackMeals)&&(
            <div style={{...S.card,marginTop:6}}>
              <div style={{fontWeight:700,marginBottom:6,fontSize:12,color:"#1a6b3c"}}>Today's Details</div>
              <div style={{display:"flex",gap:10}}>
                {mt.trackHours&&<div style={{display:"flex",alignItems:"center",gap:5}}><span style={{fontSize:12}}>⏰ Hours:</span><input type="number" step="0.5" style={{...S.input,width:65}} placeholder="0" value={(maid.attendance||{})[today]?.hours||""} onChange={e=>markAtt(maid.id,today,"hours",e.target.value)}/></div>}
                {mt.trackMeals&&<div style={{display:"flex",alignItems:"center",gap:5}}><span style={{fontSize:12}}>🍽️ Meals:</span><input type="number" style={{...S.input,width:60}} placeholder="0" value={(maid.attendance||{})[today]?.meals||""} onChange={e=>markAtt(maid.id,today,"meals",e.target.value)}/></div>}
              </div>
            </div>
          )}
          <div style={{fontSize:10,color:"#aaa",marginTop:5}}>Tap: Present → Absent → Half → Clear</div>
        </div>
      )}

      {/* LEAVES TAB */}
      {tab==="leaves"&&(
        <div>
          <div style={{...S.card,marginBottom:8,border:"1.5px solid #c5e0cc"}}>
            <div style={{fontWeight:700,marginBottom:7,color:"#1a6b3c",fontSize:13}}>Record Leave</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              <div style={{flex:1}}><label style={{fontSize:10,color:"#888"}}>From</label><input type="date" style={{...S.sel,width:"100%",marginTop:2,boxSizing:"border-box"}} value={lf.from} onChange={e=>setLf({...lf,from:e.target.value})}/></div>
              <div style={{flex:1}}><label style={{fontSize:10,color:"#888"}}>To</label><input type="date" style={{...S.sel,width:"100%",marginTop:2,boxSizing:"border-box"}} value={lf.to} onChange={e=>setLf({...lf,to:e.target.value})}/></div>
              <select style={S.sel} value={lf.type} onChange={e=>setLf({...lf,type:e.target.value})}><option>Casual</option><option>Sick</option><option>Personal</option><option>Unpaid</option></select>
              <input style={{...S.input,flex:2}} placeholder="Reason..." value={lf.reason} onChange={e=>setLf({...lf,reason:e.target.value})}/>
              <button style={S.btn} onClick={addLeave}>Add</button>
            </div>
          </div>
          {[...(maid.leaves||[])].reverse().map(l=>(
            <div key={l.id} style={{...S.card,marginBottom:5,borderLeft:"4px solid #5b8dd9"}}>
              <div style={{fontWeight:700,fontSize:13}}>{l.from}{l.to&&l.to!==l.from?` → ${l.to}`:""}</div>
              <div style={{fontSize:12,color:"#666"}}>{l.type}{l.reason?` • ${l.reason}`:""} • {l.month}</div>
            </div>
          ))}
          {!(maid.leaves||[]).length&&<p style={{color:"#aaa",fontSize:13,textAlign:"center",padding:14}}>No leaves.</p>}
        </div>
      )}

      {/* ADVANCE TAB */}
      {tab==="advance"&&(
        <div>
          <div style={{...S.card,marginBottom:8,border:"1.5px solid #c5e0cc"}}>
            <div style={{fontWeight:700,marginBottom:7,color:"#9c6dd8",fontSize:13}}>Give Advance</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              <input type="number" style={{...S.input,flex:1}} placeholder="₹" value={af.amount} onChange={e=>setAf({...af,amount:e.target.value})}/>
              <input type="date" style={S.sel} value={af.date} onChange={e=>setAf({...af,date:e.target.value})}/>
              <input style={{...S.input,flex:2}} placeholder="Reason..." value={af.reason} onChange={e=>setAf({...af,reason:e.target.value})}/>
              <button style={S.btn} onClick={addAdv}>Add</button>
            </div>
          </div>
          <div style={{display:"flex",gap:8,marginBottom:12}}>
            {[{l:"Total Given",v:totalAdvGiven,c:"#9c6dd8"},{l:"Deducted",v:totalAdvDeducted,c:"#5b8dd9"},{l:"Pending",v:advPending,c:advPending>0?"#c0392b":"#1a6b3c"}].map(x=>(
              <div key={x.l} style={{...S.card,flex:1,textAlign:"center",borderTop:`3px solid ${x.c}`}}>
                <div style={{fontSize:16,fontWeight:800,color:x.c}}>₹{x.v.toLocaleString()}</div>
                <div style={{fontSize:10,color:"#888"}}>{x.l}</div>
              </div>
            ))}
          </div>
          {[...(maid.advances||[])].reverse().map(a=>(
            <div key={a.id} style={{...S.card,marginBottom:4,borderLeft:"4px solid #9c6dd8"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div><div style={{fontWeight:700,color:"#9c6dd8",fontSize:14}}>₹{a.amount}</div>
                <div style={{fontSize:12,color:"#666"}}>{a.date}{a.reason?` • ${a.reason}`:""} • {a.month}</div></div>
                <span style={{...S.badge,background:"#fde8e8",color:"#c0392b",fontSize:10}}>Advance</span>
              </div>
            </div>
          ))}
          {!(maid.advances||[]).length&&<p style={{color:"#aaa",fontSize:13,textAlign:"center",padding:14}}>No advances given.</p>}
        </div>
      )}

      {/* SALARY TAB */}
      {tab==="salary"&&(
        <div>
          <div style={{...S.card,marginBottom:10,display:"flex",gap:8,alignItems:"center"}}>
            <label style={{fontSize:13,fontWeight:700,color:"#1a6b3c",flexShrink:0}}>📅 Month:</label>
            <input type="month" style={{...S.sel,flex:1}} value={selMonth} onChange={e=>setSelMonth(e.target.value)}/>
            {paid?<span style={{...S.badge,background:"#e8f5e9",color:"#1a6b3c"}}>✅ Paid</span>:<span style={{...S.badge,background:"#fde8e8",color:"#c0392b"}}>⬜ Unpaid</span>}
          </div>

          {/* Leave override toggle */}
          <div style={{...S.card,marginBottom:8,background:selSal.paidAbsents?"#e8f5e9":"#fff8e1",border:`1.5px solid ${selSal.paidAbsents?"#1a6b3c":"#c8962a"}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontWeight:700,fontSize:13}}>🏖️ Leave Policy</div>
                <div style={{fontSize:12,color:"#666"}}>
                  Free leaves: <b>{selSal.freeLvs}</b> (2 standard + <b>{prevBalance}</b> carry forward)
                  {selSal.cutAbsents>0&&!selSal.paidAbsents&&<span style={{color:"#c0392b"}}> • Cut: {selSal.cutAbsents} day(s)</span>}
                  {selSal.paidAbsents&&<span style={{color:"#1a6b3c"}}> • No cut applied</span>}
                </div>
              </div>
              {selSal.absent>0&&<button onClick={()=>toggleLeaveOverride(selMonth)} style={{...S.btn,fontSize:11,padding:"5px 10px",background:selSal.paidAbsents?"#c0392b":"#1a6b3c",flexShrink:0}}>
                {selSal.paidAbsents?"Restore Cut":"Don't Cut"}
              </button>}
            </div>
          </div>

          <div style={{...S.card,marginBottom:10,border:`2px solid ${paid?"#1a6b3c":"#c8962a"}`}}>
            <div style={{fontWeight:700,marginBottom:7,color:paid?"#1a6b3c":"#c8962a"}}>{selMonth} — Salary Calculation</div>
            {[{l:"Base Salary",v:"₹"+maid.salary},{l:"Days Present",v:selSt.present},{l:"Half Days",v:selSt.half},
              ...(mt.trackHours?[{l:"Total Hours",v:selSt.totalHours.toFixed(1)}]:[]),
              ...(mt.trackMeals?[{l:"Total Meals",v:selSt.totalMeals}]:[]),
              {l:"Total Absent",v:selSt.absent},
              {l:"Free Leaves",v:selSal.freeLvs},
              {l:"Cut Days",v:selSal.paidAbsents?0:selSal.cutAbsents,bold:selSal.cutAbsents>0,c:"#c0392b"},
              {l:"Gross Earned",v:"₹"+selSal.earned},
              {l:"Advance Deduction",v:"-₹"+selSal.advance},
              {l:"Net Payable",v:"₹"+selSal.net,bold:true,c:"#1a6b3c"}
            ].map(r=>(
              <div key={r.l} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #f0f0f0"}}>
                <span style={{fontSize:12,color:"#666"}}>{r.l}</span>
                <span style={{fontSize:13,fontWeight:r.bold?800:600,color:r.c||"#2d2d2d"}}>{r.v}</span>
              </div>
            ))}
            {!paid?(
              <div style={{marginTop:10,display:"flex",flexDirection:"column",gap:7}}>
                <div>
                  <label style={{fontSize:11,color:"#888",fontWeight:600}}>Payment Mode</label>
                  <div style={{display:"flex",gap:5,marginTop:4,flexWrap:"wrap"}}>
                    {["GPay","PhonePe","Paytm","Cash","NEFT"].map(m=><button key={m} onClick={()=>setPayMode(m)} style={{fontSize:11,padding:"3px 9px",borderRadius:20,border:"1.5px solid",cursor:"pointer",fontFamily:"Poppins,sans-serif",fontWeight:600,background:payMode===m?"#1a6b3c":"#fff",borderColor:"#1a6b3c",color:payMode===m?"#fff":"#1a6b3c"}}>{m}</button>)}
                  </div>
                </div>
                <div><label style={{fontSize:11,color:"#888",fontWeight:600}}>Payment Date</label>
                <input type="date" style={{...S.sel,width:"100%",marginTop:3,boxSizing:"border-box"}} value={payDate} onChange={e=>setPayDate(e.target.value)}/></div>
                {payMode!=="Cash"&&<div><label style={{fontSize:11,color:"#888",fontWeight:600}}>Transaction ID</label>
                <input style={{...S.input,marginTop:3}} placeholder="GPay/UPI ref..." value={txnId} onChange={e=>setTxnId(e.target.value)}/></div>}
                <input style={S.input} placeholder="Note (optional)..." value={salNote} onChange={e=>setSalNote(e.target.value)}/>
                <button style={{...S.btn,width:"100%",background:"linear-gradient(90deg,#1a6b3c,#217a46)"}} onClick={()=>markPaid(fund,setFund)}>
                  ✅ Mark Salary Paid — ₹{selSal.net}
                </button>
              </div>
            ):(
              <div style={{background:"#e8f5e9",borderRadius:8,padding:"10px 12px",marginTop:10}}>
                <div style={{fontWeight:700,color:"#1a6b3c",fontSize:14}}>✅ Salary Paid!</div>
                <div style={{fontSize:13,color:"#555",marginTop:4}}>📅 {paid.paidOn}</div>
                <div style={{fontSize:13,color:"#555"}}>{paid.payMode==="Cash"?"💵":"📱"} {paid.payMode}{paid.txnId?` • 🔑 ${paid.txnId}`:""}</div>
                {paid.note&&<div style={{fontSize:12,color:"#888",marginTop:2}}>📝 {paid.note}</div>}
                <div style={{marginTop:6,display:"flex",gap:10}}>
                  <div><span style={{fontSize:11,color:"#888"}}>Gross: </span><b>₹{paid.gross}</b></div>
                  <div><span style={{fontSize:11,color:"#888"}}>Adv: </span><b>₹{paid.advance}</b></div>
                  <div><span style={{fontSize:11,color:"#888"}}>Net: </span><b style={{color:"#1a6b3c"}}>₹{paid.net}</b></div>
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      {/* MONTH-WISE TAB */}
      {tab==="monthwise"&&(
        <div>
          <div style={{fontWeight:700,fontSize:13,color:"#1a6b3c",marginBottom:10}}>📊 Month-wise Summary</div>
          {allMonths.map(month=>{
            const mSal=getMonthSal(month);
            const mSt=getMonthStats(month);
            const mPaid=(maid.salaryHistory||[]).find(s=>s.month===month);
            const mAdv=(maid.advances||[]).filter(a=>a.month===month).reduce((s,a)=>s+parseFloat(a.amount||0),0);
            const mLeaves=(maid.leaves||[]).filter(l=>l.month===month).length;
            const isCurr=month===thisMonth;
            const prevBal=getLeaveBalance(month);
            const freeLvs=getFreeLeaves(month)+prevBal;
            return (
              <div key={month} style={{...S.card,marginBottom:8,borderLeft:`4px solid ${mPaid?"#1a6b3c":isCurr?"#c8962a":"#e0e0e0"}`}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
                  <div style={{fontWeight:700,fontSize:14,color:isCurr?"#c8962a":"#2d2d2d"}}>{month}{isCurr?" (Current)":""}</div>
                  <span style={{...S.badge,background:mPaid?"#e8f5e9":"#fde8e8",color:mPaid?"#1a6b3c":"#c0392b"}}>{mPaid?"✅ Paid":"⬜ Unpaid"}</span>
                </div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:6}}>
                  {[{l:"P",v:mSt.present,c:"#1a6b3c"},{l:"A",v:mSt.absent,c:"#c0392b"},{l:"H",v:mSt.half,c:"#c8962a"},{l:"Free",v:freeLvs,c:"#5cba8a"},{l:"Cut",v:mSal.paidAbsents?0:mSal.cutAbsents,c:"#c0392b"}].map(x=>(
                    <div key={x.l} style={{background:"#f8f8f8",borderRadius:6,padding:"3px 8px",textAlign:"center"}}>
                      <div style={{fontSize:12,fontWeight:800,color:x.c}}>{x.v}</div>
                      <div style={{fontSize:9,color:"#aaa"}}>{x.l}</div>
                    </div>
                  ))}
                </div>
                <div style={{fontSize:12,color:"#555",borderTop:"1px solid #f5f5f5",paddingTop:5}}>
                  Gross: <b>₹{mSal.earned}</b>
                  {mAdv>0&&<span style={{marginLeft:10,color:"#9c6dd8"}}>Adv: <b>₹{mAdv}</b></span>}
                  <span style={{marginLeft:10,color:"#1a6b3c"}}>Net: <b>₹{mSal.net}</b></span>
                  {mLeaves>0&&<span style={{marginLeft:10,color:"#5b8dd9"}}>Leaves: <b>{mLeaves}</b></span>}
                  {mSal.paidAbsents&&<span style={{marginLeft:10,color:"#1a6b3c",fontSize:11}}>✅ No cut</span>}
                </div>
                {mPaid&&<div style={{fontSize:11,color:"#1a6b3c",marginTop:4}}>
                  📅 {mPaid.paidOn} • {mPaid.payMode==="Cash"?"💵":"📱"}{mPaid.payMode}{mPaid.txnId?` • 🔑${mPaid.txnId}`:""}
                </div>}
                <button onClick={()=>{setSelMonth(month);setTab("salary");}} style={{background:"#f0faf4",border:"1px solid #a5d6b5",borderRadius:7,padding:"3px 10px",cursor:"pointer",fontSize:11,fontFamily:"Poppins,sans-serif",color:"#1a6b3c",marginTop:6}}>
                  {mPaid?"View →":"Pay Salary →"}
                </button>
              </div>
            );
          })}
        </div>
      )}

      {/* RATE HISTORY TAB */}
      {tab==="history"&&(
        <div>
          <div style={{...S.card,marginBottom:10,background:"#fff8e1",border:"1.5px solid #c8962a"}}>
            <div style={{fontWeight:700,color:"#c8962a",fontSize:13}}>📈 Current Rate</div>
            <div style={{fontSize:20,fontWeight:800,color:"#1a6b3c"}}>₹{maid.salary}/month</div>
            <div style={{fontSize:12,color:"#666"}}>{mt.label} • {maid.workDays}</div>
          </div>
          {[...(maid.rateHistory||[])].reverse().map((r,i)=>(
            <div key={r.id} style={{...S.card,marginBottom:7,borderLeft:`4px solid ${i===0?"#c8962a":"#e0e0e0"}`}}>
              <div style={{fontWeight:700,color:i===0?"#c8962a":"#2d2d2d",fontSize:13}}>{r.reason||"Updated"}{i===0?" (Latest)":""}</div>
              <div style={{fontSize:12,color:"#666"}}>📅 {r.date}</div>
              {r.oldSalary&&r.newSalary&&r.oldSalary!==r.newSalary&&<div style={{fontSize:13,marginTop:3}}>💰 <span style={{textDecoration:"line-through",color:"#c0392b"}}>₹{r.oldSalary}</span> → <b style={{color:"#1a6b3c"}}>₹{r.newSalary}</b></div>}
              {!r.oldSalary&&<div style={{fontSize:13,color:"#1a6b3c",marginTop:3}}>🎉 Starting: ₹{r.newSalary}</div>}
            </div>
          ))}
          {!(maid.rateHistory||[]).length&&<p style={{color:"#aaa",fontSize:13,textAlign:"center",padding:14}}>No rate changes.</p>}
        </div>
      )}
    </div>
  );
}

function HomeServices({gas,setGas,showToast}) {
  const [tab,setTab]=useState("gas");
  return (
    <div style={S.page}>
      <h2 style={S.title}>🔧 Home Services</h2>
      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {[{id:"gas",l:"🔥 Gas Cylinder"},{id:"cleaning",l:"🧹 Deep Cleaning"}].map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{...S.tab,flex:1,...(tab===t.id?S.tabA:{})}}>{t.l}</button>
        ))}
      </div>
      {tab==="gas"&&<GasSection gas={gas} setGas={setGas} showToast={showToast}/>}
      {tab==="cleaning"&&<CleaningSection gas={gas} setGas={setGas} showToast={showToast}/>}
    </div>
  );
}

function GasSection({gas,setGas,showToast}) {
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState({bookingDate:"",receivedDate:"",installmentDate:"",changedDate:"",amount:"",company:"HP",notes:""});
  const today=new Date().toISOString().slice(0,10);
  const curr=gas?.currentCylinder;
  const daysSince=curr?.changedDate?Math.floor((new Date()-new Date(curr.changedDate))/(1000*60*60*24)):null;
  const daysLeft=daysSince!==null?Math.max(0,45-daysSince):null;
  const addRec=()=>{
    if(!form.bookingDate){showToast("Booking date required!");return;}
    const r={id:Date.now(),...form,addedAt:today};
    setGas({...gas,records:[...(gas?.records||[]),r],currentCylinder:r});
    setForm({bookingDate:"",receivedDate:"",installmentDate:"",changedDate:"",amount:"",company:"HP",notes:""});
    setShowForm(false); showToast("Gas record saved! 🔥");
  };
  const updCurr=(field,value)=>{
    if(!curr)return;
    const upd={...curr,[field]:value};
    setGas({...gas,currentCylinder:upd,records:(gas?.records||[]).map(r=>r.id===curr.id?upd:r)});
  };
  return (
    <div>
      {curr&&(
        <div style={{...S.card,marginBottom:10,background:daysLeft!==null&&daysLeft<7?"linear-gradient(135deg,#c0392b,#962d22)":"linear-gradient(135deg,#e07b54,#c4573b)",color:"#fff",borderRadius:14}}>
          <div style={{fontSize:12,opacity:0.8}}>🔥 Current — {curr.company}</div>
          {daysLeft!==null&&<div style={{fontSize:26,fontWeight:800}}>{daysLeft} days left{daysLeft<7?" ⚠️":""}</div>}
          <div style={{display:"flex",gap:14,flexWrap:"wrap",marginTop:7}}>
            {curr.bookingDate&&<div><div style={{fontSize:9,opacity:0.7}}>📋 Booked</div><div style={{fontWeight:700,fontSize:12}}>{curr.bookingDate}</div></div>}
            {curr.receivedDate&&<div><div style={{fontSize:9,opacity:0.7}}>📦 Received</div><div style={{fontWeight:700,fontSize:12}}>{curr.receivedDate}</div></div>}
            {curr.changedDate&&<div><div style={{fontSize:9,opacity:0.7}}>🔄 Changed</div><div style={{fontWeight:700,fontSize:12}}>{curr.changedDate}</div></div>}
            {curr.amount&&<div><div style={{fontSize:9,opacity:0.7}}>💰 Paid</div><div style={{fontWeight:700,fontSize:12}}>₹{curr.amount}</div></div>}
          </div>
          {daysLeft!==null&&daysLeft<7&&<div style={{background:"#fff3",borderRadius:7,padding:"4px 10px",marginTop:7,fontSize:11,fontWeight:700}}>⚠️ Book next cylinder soon!</div>}
        </div>
      )}
      {curr&&!showForm&&(
        <div style={{...S.card,marginBottom:8,border:"1.5px solid #e07b54"}}>
          <div style={{fontWeight:700,marginBottom:7,color:"#e07b54",fontSize:13}}>📝 Update Current</div>
          {[{l:"📦 Received",f:"receivedDate",t:"date"},{l:"💳 Installment",f:"installmentDate",t:"date"},{l:"🔄 Changed",f:"changedDate",t:"date"},{l:"💰 Amount ₹",f:"amount",t:"number"}].map(x=>(
            <div key={x.f} style={{display:"flex",alignItems:"center",gap:8,marginBottom:5}}>
              <label style={{fontSize:11,color:"#888",width:110,flexShrink:0}}>{x.l}</label>
              <input type={x.t} style={{...S.sel,flex:1}} value={curr[x.f]||""} onChange={e=>updCurr(x.f,e.target.value)}/>
            </div>
          ))}
        </div>
      )}
      <button style={{...S.btn,width:"100%",marginBottom:8}} onClick={()=>setShowForm(!showForm)}>{showForm?"Cancel":"🔥 + Book New Cylinder"}</button>
      {showForm&&(
        <div style={{...S.card,marginBottom:8,border:"2px solid #e07b54"}}>
          <div style={{fontWeight:700,marginBottom:8,color:"#e07b54"}}>New Booking</div>
          <select style={{...S.sel,width:"100%",marginBottom:7}} value={form.company} onChange={e=>setForm({...form,company:e.target.value})}><option>HP</option><option>Bharat Gas</option><option>Indane</option></select>
          {[{l:"📋 Booking Date *",f:"bookingDate",t:"date"},{l:"📦 Received",f:"receivedDate",t:"date"},{l:"💳 Installment",f:"installmentDate",t:"date"},{l:"🔄 Changed",f:"changedDate",t:"date"},{l:"💰 Amount ₹",f:"amount",t:"number"}].map(x=>(
            <div key={x.f} style={{marginBottom:7}}><label style={{fontSize:12,color:"#888"}}>{x.l}</label><input type={x.t} style={{...S.sel,width:"100%",marginTop:3,boxSizing:"border-box"}} value={form[x.f]} onChange={e=>setForm({...form,[x.f]:e.target.value})}/></div>
          ))}
          <input style={S.input} placeholder="Notes..." value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})}/>
          <button style={{...S.btn,width:"100%",marginTop:8}} onClick={addRec}>Save Record</button>
        </div>
      )}
      {(gas?.records||[]).length>0&&<>
        <div style={{fontWeight:700,fontSize:11,color:"#888",marginBottom:6}}>HISTORY</div>
        {[...(gas?.records||[])].reverse().map((r,i)=>(
          <div key={r.id} style={{...S.card,marginBottom:5,borderLeft:`4px solid ${i===0?"#e07b54":"#e0e0e0"}`,opacity:i===0?1:0.7}}>
            <div style={{fontWeight:700,fontSize:13}}>🔥 {r.company}{i===0?" (Current)":""}</div>
            <div style={{fontSize:12,color:"#666"}}>{r.bookingDate&&"📋 "+r.bookingDate}{r.receivedDate&&" • 📦 "+r.receivedDate}{r.changedDate&&" • 🔄 "+r.changedDate}</div>
            {r.amount&&<div style={{fontSize:12,color:"#1a6b3c",fontWeight:700}}>₹{r.amount}</div>}
          </div>
        ))}
      </>}
    </div>
  );
}

function CleaningSection({gas,setGas,showToast}) {
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState({date:"",type:"Full House",provider:"",amount:"",duration:"",areas:"",notes:"",nextDate:""});
  const TYPES=["Full House","Kitchen Deep Clean","Bathroom","Sofa/Upholstery","Carpet/Mattress","AC Service","Pest Control","Water Tank","Other"];
  const add=()=>{if(!form.date){showToast("Date required!");return;}setGas({...gas,cleaning:[...(gas?.cleaning||[]),{id:Date.now(),...form}]});setForm({date:"",type:"Full House",provider:"",amount:"",duration:"",areas:"",notes:"",nextDate:""});setShowForm(false);showToast("Saved! 🧹");};
  const del=id=>setGas({...gas,cleaning:(gas?.cleaning||[]).filter(c=>c.id!==id)});
  const recs=[...(gas?.cleaning||[])].reverse();
  const upcoming=(gas?.cleaning||[]).filter(c=>c.nextDate&&c.nextDate>=new Date().toISOString().slice(0,10));
  return (
    <div>
      {upcoming.length>0&&<div style={{...S.card,marginBottom:8,background:"#e8f5e9",border:"1.5px solid #1a6b3c"}}>
        <div style={{fontWeight:700,color:"#1a6b3c",marginBottom:3,fontSize:13}}>🔔 Upcoming</div>
        {upcoming.map(c=><div key={c.id} style={{fontSize:13,color:"#555"}}>🧹 {c.type} on {c.nextDate}</div>)}
      </div>}
      <button style={{...S.btn,width:"100%",marginBottom:8}} onClick={()=>setShowForm(!showForm)}>{showForm?"Cancel":"🧹 + Add Cleaning Service"}</button>
      {showForm&&(
        <div style={{...S.card,marginBottom:8,border:"2px solid #1a6b3c"}}>
          <div style={{fontWeight:700,marginBottom:8,color:"#1a6b3c"}}>New Cleaning</div>
          <select style={{...S.sel,width:"100%",marginBottom:7}} value={form.type} onChange={e=>setForm({...form,type:e.target.value})}>{TYPES.map(t=><option key={t}>{t}</option>)}</select>
          <div style={{display:"flex",gap:7}}>
            <div style={{flex:1}}><label style={{fontSize:11,color:"#888"}}>Date *</label><input type="date" style={{...S.sel,width:"100%",marginTop:3,boxSizing:"border-box"}} value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></div>
            <div style={{flex:1}}><label style={{fontSize:11,color:"#888"}}>Amount ₹</label><input type="number" style={{...S.input,marginTop:3}} placeholder="₹" value={form.amount} onChange={e=>setForm({...form,amount:e.target.value})}/></div>
          </div>
          <div style={{marginTop:7,display:"flex",flexDirection:"column",gap:7}}>
            <input style={S.input} placeholder="Provider/Company..." value={form.provider} onChange={e=>setForm({...form,provider:e.target.value})}/>
            <input style={S.input} placeholder="Duration (e.g. 3 hours)" value={form.duration} onChange={e=>setForm({...form,duration:e.target.value})}/>
            <input style={S.input} placeholder="Areas covered..." value={form.areas} onChange={e=>setForm({...form,areas:e.target.value})}/>
            <div><label style={{fontSize:11,color:"#888"}}>Next Cleaning Date</label><input type="date" style={{...S.sel,width:"100%",marginTop:3,boxSizing:"border-box"}} value={form.nextDate} onChange={e=>setForm({...form,nextDate:e.target.value})}/></div>
            <input style={S.input} placeholder="Notes..." value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})}/>
          </div>
          <button style={{...S.btn,width:"100%",marginTop:8}} onClick={add}>Save</button>
        </div>
      )}
      {recs.length===0&&!showForm&&<p style={{color:"#aaa",fontSize:13,textAlign:"center",padding:18}}>No cleaning records yet.</p>}
      {recs.map(r=>(
        <div key={r.id} style={{...S.card,marginBottom:7,borderLeft:"4px solid #1a6b3c"}}>
          <div style={{display:"flex",justifyContent:"space-between"}}>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:13}}>🧹 {r.type}</div>
              <div style={{fontSize:12,color:"#666"}}>📅{r.date}{r.provider?" • "+r.provider:""}{r.amount?" • ₹"+r.amount:""}</div>
              {r.duration&&<div style={{fontSize:11,color:"#555"}}>⏱️ {r.duration}</div>}
              {r.areas&&<div style={{fontSize:11,color:"#555"}}>📍 {r.areas}</div>}
              {r.nextDate&&<div style={{fontSize:12,color:"#c8962a",fontWeight:600}}>🔔 Next: {r.nextDate}</div>}
            </div>
            <button onClick={()=>del(r.id)} style={S.del}>✕</button>
          </div>
        </div>
      ))}
    </div>
  );
}
    function renderApp() {
      ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(FamilyHub));
    }
    if(window._fbReady){renderApp();}
    else{window.addEventListener("firebase-ready",renderApp);}
  </script>
</body>
</html>
