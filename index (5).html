<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Family Hub 🏠</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    const app = initializeApp({
      apiKey:"AIzaSyB92410ygcK7qTs69MDIcoweMJe0mNBjls",
      authDomain:"family-hub-minal.firebaseapp.com",
      projectId:"family-hub-minal",
      storageBucket:"family-hub-minal.firebasestorage.app",
      messagingSenderId:"558247968463",
      appId:"1:558247968463:web:20ed3b6ae1375abee441ba"
    });
    const db = getFirestore(app);
    window.storage = {
      get: async (key) => {
        try { const s=await getDoc(doc(db,"familyhub",key)); return s.exists()?{key,value:s.data().value}:null; } catch(e){console.error("Firebase get error",e); return null; }
      },
      set: async (key,value) => {
        try { await setDoc(doc(db,"familyhub",key),{value,updatedAt:new Date().toISOString()}); return {key,value}; } catch(e){console.error("Firebase set error",e); return null; }
      },
    };
    window._fbReady=true;
    window.dispatchEvent(new Event("firebase-ready"));
  </script>
</head>
<body style="margin:0;padding:0;">
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;

const PINS = { Minal:"1111", Piyush:"2222", Sahil:"3333" };
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MAID_TYPES = [
  {val:"babysitter",label:"👶 Baby Sitting",trackHours:true,trackMeals:false},
  {val:"cook",label:"🍳 Cook",trackHours:false,trackMeals:true},
  {val:"cleaner",label:"🧹 Cleaning",trackHours:false,trackMeals:false},
  {val:"other",label:"🏠 Other",trackHours:false,trackMeals:false},
];
const ALL_MODULES = [
  {id:"dashboard",label:"Dashboard",icon:"🏠"},
  {id:"planner",label:"Home Planner",icon:"📋"},
  {id:"menu",label:"Menu",icon:"🍽️"},
  {id:"tasks",label:"Tasks",icon:"✅"},
  {id:"grocery",label:"Grocery",icon:"🛒"},
  {id:"budget",label:"Budget",icon:"💰"},
  {id:"schedule",label:"Schedule",icon:"📅"},
  {id:"documents",label:"Documents",icon:"🪪"},
  {id:"maids",label:"Maids",icon:"🧽"},
  {id:"services",label:"Home Services",icon:"🔧"},
];

const load = async (key) => {
  try { 
    if(!window.storage) return null;
    const r = await window.storage.get(key); 
    return r?JSON.parse(r.value):null; 
  } catch(e) { console.error("Load error",key,e); return null; }
};
const save = async (key,val) => {
  try { 
    if(!window.storage) return;
    await window.storage.set(key,JSON.stringify(val)); 
  } catch(e) { console.error("Save error",key,e); }
};

const S={
  page:{maxWidth:700,margin:"0 auto",padding:"18px 14px 40px"},
  title:{fontWeight:800,fontSize:20,color:"#1a6b3c",margin:"0 0 14px"},
  card:{background:"#fff",borderRadius:12,padding:"13px 15px",boxShadow:"0 2px 10px #1a6b3c0d",marginBottom:4,border:"1px solid #e8f3ec"},
  input:{width:"100%",border:"1.5px solid #c5e0cc",borderRadius:8,padding:"8px 12px",fontFamily:"Poppins,sans-serif",fontSize:13,outline:"none",boxSizing:"border-box",background:"#fafdfa"},
  sel:{border:"1.5px solid #c5e0cc",borderRadius:8,padding:"7px 10px",fontFamily:"Poppins,sans-serif",fontSize:13,background:"#fafdfa",outline:"none"},
  btn:{background:"linear-gradient(90deg,#1a6b3c,#217a46)",color:"#fff",border:"none",borderRadius:8,padding:"8px 16px",fontWeight:700,cursor:"pointer",fontFamily:"Poppins,sans-serif",fontSize:13},
  del:{background:"#fde8e8",border:"none",borderRadius:8,width:28,height:28,cursor:"pointer",color:"#c0392b",fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0},
  badge:{fontSize:11,padding:"2px 8px",borderRadius:20,fontWeight:600},
  tab:{background:"#f0faf4",border:"1.5px solid #c5e0cc",borderRadius:20,padding:"6px 14px",cursor:"pointer",fontFamily:"Poppins,sans-serif",fontSize:12,color:"#1a6b3c"},
  tabA:{background:"#1a6b3c",color:"#fff",fontWeight:700,border:"1.5px solid #1a6b3c"},
};

function Toast({msg,onClose}) {
  useEffect(()=>{const t=setTimeout(onClose,3000);return()=>clearTimeout(t);},[]);
  return <div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:"#2d2d2d",color:"#fff",padding:"10px 22px",borderRadius:24,fontSize:14,zIndex:9999,boxShadow:"0 4px 20px #0003"}}>{msg}</div>;
}

function LoginScreen({onLogin}) {
  const [user,setUser]=useState(null);
  const [pin,setPin]=useState("");
  const [err,setErr]=useState("");
  const hp=(d)=>{
    if(d==="⌫"){setPin(p=>p.slice(0,-1));return;}
    const np=pin+d;setPin(np);
    if(np.length===4){
      if(PINS[user]===np){onLogin(user);}
      else{setErr("Wrong PIN");setTimeout(()=>{setPin("");setErr("");},800);}
    }
  };
  if(!user) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#e8f5e9,#fff8e1)",fontFamily:"Poppins,sans-serif"}}>
      <div style={{background:"#fff",borderRadius:24,padding:"40px 32px",boxShadow:"0 8px 40px #1a6b3c30",textAlign:"center",minWidth:300}}>
        <div style={{fontSize:52,marginBottom:8}}>🏠</div>
        <h1 style={{margin:"0 0 4px",fontWeight:800,fontSize:26,color:"#1a6b3c"}}>Family Hub</h1>
        <p style={{color:"#888",fontSize:13,margin:"0 0 28px"}}>Minal, Piyush & Sahil</p>
        <div style={{display:"flex",gap:12}}>
          {["Minal","Piyush","Sahil"].map(u=>(
            <button key={u} onClick={()=>setUser(u)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",background:"#f1f9f4",border:"2px solid #a5d6b5",borderRadius:14,padding:"14px 8px",cursor:"pointer",fontFamily:"Poppins,sans-serif",gap:4}}>
              <span style={{fontSize:32}}>{u==="Minal"?"👩":u==="Piyush"?"👨":"👦"}</span>
              <span style={{fontWeight:700,fontSize:13}}>{u}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#e8f5e9,#fff8e1)",fontFamily:"Poppins,sans-serif"}}>
      <div style={{background:"#fff",borderRadius:24,padding:"40px 32px",boxShadow:"0 8px 40px #1a6b3c30",textAlign:"center",minWidth:280}}>
        <div style={{fontSize:44,marginBottom:8}}>{user==="Minal"?"👩":user==="Piyush"?"👨":"👦"}</div>
        <h2 style={{margin:"0 0 4px",fontWeight:800,color:"#1a6b3c"}}>Hi {user}!</h2>
        <p style={{color:"#888",fontSize:13,margin:"0 0 20px"}}>Enter your PIN</p>
        <div style={{display:"flex",gap:10,marginBottom:16,justifyContent:"center"}}>
          {[0,1,2,3].map(i=><div key={i} style={{width:16,height:16,borderRadius:"50%",background:pin.length>i?"#c8962a":"#e8e8e8"}}/>)}
        </div>
        {err&&<p style={{color:"#c0392b",fontSize:13,marginBottom:8}}>{err}</p>}
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,width:200,margin:"0 auto"}}>
          {["1","2","3","4","5","6","7","8","9","","0","⌫"].map((d,i)=>(
            <button key={i} onClick={()=>d&&hp(d)} style={{visibility:d?"visible":"hidden",border:"none",borderRadius:10,height:48,fontSize:18,fontWeight:700,cursor:"pointer",background:d==="⌫"?"#fde8e8":"#f4f4f4",color:d==="⌫"?"#c0392b":"#2d2d2d",fontFamily:"Poppins,sans-serif"}}>{d}</button>
          ))}
        </div>
        <button onClick={()=>{setUser(null);setPin("");}} style={{background:"none",border:"none",color:"#888",cursor:"pointer",marginTop:16,fontSize:13,fontFamily:"Poppins,sans-serif"}}>← Back</button>
      </div>
    </div>
  );
}
function FamilyHub() {
  const [user,setUser]=useState(null);
  const [mod,setMod]=useState("dashboard");
  const [toast,setToast]=useState(null);
  const showToast=(m)=>setToast(m);
  const [tasks,setTasks]=useState([]);
  const [grocery,setGrocery]=useState([]);
  const [budget,setBudget]=useState([]);
  const [schedule,setSchedule]=useState([]);
  const [menus,setMenus]=useState([]);
  const [planner,setPlanner]=useState({weekly:{},monthly:{},quarterly:{}});
  const [documents,setDocuments]=useState([]);
  const [maids,setMaids]=useState([]);
  const [fund,setFund]=useState({minal:0,piyush:0,contributions:[],expenses:[]});
  const [gas,setGas]=useState({records:[],currentCylinder:null,cleaning:[]});
  const [loaded,setLoaded]=useState(false);
  const [fbReady,setFbReady]=useState(!!window._fbReady);

  // Wait for Firebase to be ready
  useEffect(()=>{
    if(window._fbReady){setFbReady(true);return;}
    const handler=()=>setFbReady(true);
    window.addEventListener("firebase-ready",handler);
    return()=>window.removeEventListener("firebase-ready",handler);
  },[]);

  useEffect(()=>{
    if(!fbReady) return;
    (async()=>{
      const map=[
        ["tasks",setTasks,[]],["grocery",setGrocery,[]],["budget",setBudget,[]],
        ["schedule",setSchedule,[]],["menus",setMenus,[]],
        ["planner",setPlanner,{weekly:{},monthly:{},quarterly:{}}],
        ["documents",setDocuments,[]],["maids",setMaids,[]],
        ["fund",setFund,{minal:0,piyush:0,contributions:[],expenses:[]}],
        ["gas",setGas,{records:[],currentCylinder:null,cleaning:[]}],
      ];
      for(const [key,setter,def] of map){
        try{
          const d=await load("fh_"+key);
          setter(d??def);
        }catch(e){console.log("Load error",key,e);}
      }
      setLoaded(true);
    })();
  },[fbReady]);

  const persist=(key,val)=>save("fh_"+key,val);
  if(!user) return <LoginScreen onLogin={u=>{setUser(u);setMod("dashboard");}}/>;
  if(!fbReady) return <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",fontFamily:"Poppins,sans-serif",gap:12}}><div style={{fontSize:32}}>🏠</div><div style={{fontSize:16,color:"#1a6b3c",fontWeight:700}}>Connecting...</div></div>;
  if(!loaded) return <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",fontFamily:"Poppins,sans-serif",gap:12}}><div style={{fontSize:32}}>🏠</div><div style={{fontSize:16,color:"#1a6b3c",fontWeight:700}}>Loading data...</div><div style={{fontSize:12,color:"#aaa"}}>Please wait</div></div>;

  const P={
    tasks,setTasks:v=>{setTasks(v);persist("tasks",v);},
    grocery,setGrocery:v=>{setGrocery(v);persist("grocery",v);},
    budget,setBudget:v=>{setBudget(v);persist("budget",v);},
    schedule,setSchedule:v=>{setSchedule(v);persist("schedule",v);},
    menus,setMenus:v=>{setMenus(v);persist("menus",v);},
    planner,setPlanner:v=>{setPlanner(v);persist("planner",v);},
    documents,setDocuments:v=>{setDocuments(v);persist("documents",v);},
    maids,setMaids:v=>{setMaids(v);persist("maids",v);},
    fund,setFund:v=>{setFund(v);persist("fund",v);},
    gas,setGas:v=>{setGas(v);persist("gas",v);},
    user,showToast,setMod
  };

  return (
    <div style={{display:"flex",flexDirection:"column",minHeight:"100vh",fontFamily:"Poppins,sans-serif",background:"#f3f8f5"}}>
      <div style={{background:"linear-gradient(90deg,#1a6b3c,#145530)",display:"flex",alignItems:"center",gap:8,padding:"0 10px",height:52,flexShrink:0,position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 12px #1a6b3c40"}}>
        <span style={{fontSize:18,flexShrink:0}}>🏠</span>
        <nav style={{flex:1,display:"flex",gap:1,overflowX:"auto",scrollbarWidth:"none"}}>
          {ALL_MODULES.map(m=>(
            <button key={m.id} onClick={()=>setMod(m.id)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:1,padding:"4px 6px",borderRadius:7,border:"none",background:mod===m.id?"#c8962a":"transparent",color:mod===m.id?"#fff":"#c8f0d8",cursor:"pointer",fontFamily:"Poppins,sans-serif",flexShrink:0}}>
              <span style={{fontSize:14}}>{m.icon}</span>
              <span style={{fontSize:8,fontWeight:mod===m.id?700:400}}>{m.label}</span>
            </button>
          ))}
        </nav>
        <div style={{fontSize:10,color:"#d4f5c0",flexShrink:0}}>{user==="Minal"?"👩":user==="Piyush"?"👨":"👦"}</div>
        <button onClick={()=>setUser(null)} style={{background:"#ffffff22",border:"none",borderRadius:6,padding:"3px 7px",color:"#fff",cursor:"pointer",fontSize:10,fontFamily:"Poppins,sans-serif",flexShrink:0}}>Exit</button>
      </div>
      <div style={{flex:1,overflowY:"auto"}}>
        {mod==="dashboard" && <Dashboard {...P} fund={P.fund}/>}
        {mod==="planner"   && <HomePlanner {...P}/>}
        {mod==="menu"      && <MenuModule {...P}/>}
        {mod==="tasks"     && <Tasks {...P}/>}
        {mod==="grocery"   && <Grocery {...P}/>}
        {mod==="budget"    && <Budget {...P}/>}
        {mod==="schedule"  && <Schedule {...P}/>}
        {mod==="documents" && <Documents {...P}/>}
        {mod==="maids"     && <MaidMgmt {...P} fund={P.fund} setFund={P.setFund}/>}
        {mod==="services"  && <HomeServices {...P}/>}
      </div>
      {toast&&<Toast msg={toast} onClose={()=>setToast(null)}/>}
    </div>
  );
}

function Dashboard({user,tasks,schedule,menus,fund,setMod}) {
  const today=new Date().toISOString().slice(0,10);
  const thisMonth=new Date().toISOString().slice(0,7);
  const pending=tasks.filter(t=>!t.done).length;
  const todayEvents=schedule.filter(s=>s.date===today).length;
  const todayMenu=menus.find(m=>m.date===today);
  const pendingApproval=user!=="Minal"?menus.filter(m=>m.status==="pending").length:0;
  const hBal=(fund?.minal||0)+(fund?.piyush||0);
  const sahilFund=fund?.sahilFund||0;
  const sahilHouseThisMonth=(fund?.sahilHouseExpenses||[]).filter(e=>e.month===thisMonth).reduce((s,e)=>s+(e.amount||0),0);
  const sahilPersonalThisMonth=(fund?.sahilPersonalExpenses||[]).filter(e=>e.month===thisMonth).reduce((s,e)=>s+(e.amount||0),0);
  const piyushGaveThisMonth=(fund?.sahilFundHistory||[]).filter(e=>e.month===thisMonth).reduce((s,e)=>s+(e.amount||0),0);
  return (
    <div style={S.page}>
      <h2 style={S.title}>Welcome {user==="Minal"?"👩":user==="Piyush"?"👨":"👦"} {user}!</h2>
      <p style={{color:"#888",marginTop:-10,marginBottom:16,fontSize:13}}>{new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"})}</p>
      {/* Fund balance alert */}
      {hBal<500&&<div style={{...S.card,background:"#fde8e8",border:"1.5px solid #c0392b",marginBottom:10}}>
        <div style={{fontWeight:700,color:"#c0392b"}}>⚠️ Household Fund Low! ₹{hBal.toLocaleString()} remaining</div>
      </div>}

      {/* Sahil summary — visible to all */}
      <div style={{...S.card,marginBottom:10,borderLeft:"4px solid #5cba8a",cursor:"pointer"}} onClick={()=>setMod("budget")}>
        <div style={{fontWeight:700,marginBottom:6,color:"#5cba8a"}}>👦 Sahil — This Month</div>
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          <div style={{fontSize:12}}><span style={{color:"#888"}}>👨 Given: </span><b style={{color:"#5b8dd9"}}>₹{piyushGaveThisMonth.toLocaleString()}</b></div>
          <div style={{fontSize:12}}><span style={{color:"#888"}}>🏠 Ghar: </span><b style={{color:"#c0392b"}}>₹{sahilHouseThisMonth.toLocaleString()}</b></div>
          {user==="Sahil"&&<div style={{fontSize:12}}><span style={{color:"#888"}}>👦 Personal: </span><b style={{color:"#5cba8a"}}>₹{sahilPersonalThisMonth.toLocaleString()}</b></div>}
          <div style={{fontSize:12}}><span style={{color:"#888"}}>Balance: </span><b style={{color:"#1a6b3c"}}>₹{sahilFund.toLocaleString()}</b></div>
        </div>
      </div>

      {pendingApproval>0&&<div style={{...S.card,background:"#e8f5e9",border:"1.5px solid #1a6b3c",marginBottom:10,cursor:"pointer"}} onClick={()=>setMod("menu")}>
        <div style={{fontWeight:700,color:"#1a6b3c"}}>🍽️ {pendingApproval} menu(s) waiting your approval!</div>
      </div>}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
        {[{l:"Pending Tasks",v:pending,c:"#c8962a",icon:"✅",m:"tasks"},{l:"Today Events",v:todayEvents,c:"#5b8dd9",icon:"📅",m:"schedule"}].map(x=>(
          <div key={x.m} style={{...S.card,borderTop:`3px solid ${x.c}`,cursor:"pointer",textAlign:"center"}} onClick={()=>setMod(x.m)}>
            <div style={{fontSize:22}}>{x.icon}</div>
            <div style={{fontSize:22,fontWeight:800,color:x.c}}>{x.v}</div>
            <div style={{fontSize:11,color:"#888"}}>{x.l}</div>
          </div>
        ))}
      </div>
      {todayMenu&&<div style={{...S.card,borderLeft:"4px solid #1a6b3c",marginBottom:10}}>
        <div style={{fontWeight:700,marginBottom:6}}>🍽️ Today's Menu</div>
        {todayMenu.breakfast&&<div style={{fontSize:13}}>🌅 <b>Breakfast:</b> {todayMenu.breakfast}</div>}
        {todayMenu.lunch&&<div style={{fontSize:13}}>☀️ <b>Lunch:</b> {todayMenu.lunch}</div>}
        {todayMenu.dinner&&<div style={{fontSize:13}}>🌙 <b>Dinner:</b> {todayMenu.dinner}</div>}
        <div style={{marginTop:6}}>
          {todayMenu.status==="approved"&&<span style={{...S.badge,background:"#e8f5e9",color:"#1a6b3c"}}>✅ Approved</span>}
          {todayMenu.status==="rejected"&&<span style={{...S.badge,background:"#fde8e8",color:"#c0392b"}}>❌ Rejected</span>}
          {todayMenu.status==="pending"&&<span style={{...S.badge,background:"#fff8e1",color:"#c8962a"}}>⏳ Pending</span>}
        </div>
      </div>}
      <div style={S.card}>
        <div style={{fontWeight:700,marginBottom:8}}>⚡ Quick Actions</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {[{l:"+ Task",m:"tasks"},{l:"+ Grocery",m:"grocery"},{l:"+ Expense",m:"budget"},{l:"📅 Schedule",m:"schedule"},{l:"🍽️ Menu",m:"menu"}].map(a=>(
            <button key={a.m} onClick={()=>setMod(a.m)} style={{background:"#f0faf4",color:"#1a6b3c",border:"1.5px solid #a5d6b5",borderRadius:20,padding:"5px 12px",cursor:"pointer",fontFamily:"Poppins,sans-serif",fontSize:12,fontWeight:600}}>{a.l}</button>
          ))}
        </div>
      </div>
    </div>
  );
}
const STATUS_OPTS=[{val:"",l:"—",bg:"#f0f0f0",c:"#aaa"},{val:"pending",l:"⏳",bg:"#fff8e1",c:"#c8962a"},{val:"done",l:"✅",bg:"#e8f5e9",c:"#1a6b3c"},{val:"postponed",l:"📅",bg:"#e3f2fd",c:"#5b8dd9"},{val:"cancelled",l:"❌",bg:"#fde8e8",c:"#c0392b"}];
function StatusPick({value,onChange}) {
  return <div style={{display:"flex",gap:3}}>{STATUS_OPTS.map(s=><button key={s.val} onClick={()=>onChange(s.val===value?"":s.val)} style={{background:value===s.val?s.bg:"#f8f8f8",border:`1.5px solid ${value===s.val?s.c:"#e0e0e0"}`,borderRadius:6,padding:"2px 5px",cursor:"pointer",fontSize:12,fontWeight:value===s.val?700:400}}>{s.l}</button>)}</div>;
}
const TH={padding:"7px 6px",textAlign:"left",fontWeight:700,fontSize:11,border:"1px solid #e0e0e0",background:"#1a6b3c",color:"#fff"};
const TD={padding:"3px 4px",border:"1px solid #e8e8e8",verticalAlign:"middle"};
const CI={width:"100%",border:"none",background:"transparent",fontFamily:"Poppins,sans-serif",fontSize:12,outline:"none",padding:"3px 2px"};

function HomePlanner({planner,setPlanner}) {
  const [tab,setTab]=useState("weekly");
  const todayDay=DAYS[new Date().getDay()];
  const thisMonth=MONTHS[new Date().getMonth()];
  const upd=(sec,key,val)=>setPlanner({...planner,[sec]:{...(planner?.[sec]||{}),[key]:val}});
  return (
    <div style={S.page}>
      <h2 style={S.title}>📋 Home Planner</h2>
      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {[{id:"weekly",l:"📅 Weekly"},{id:"monthly",l:"🗓️ Monthly (1st)"},{id:"quarterly",l:"📆 Quarterly (15th)"}].map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{...S.tab,flex:1,fontSize:11,...(tab===t.id?S.tabA:{})}}>{t.l}</button>
        ))}
      </div>
      {tab==="weekly"&&(
        <div>
          <div style={{...S.card,marginBottom:10,background:"#fff8e1",border:"1.5px solid #c8962a"}}>

function MenuModule({user,menus,setMenus,showToast}) {

  const [selDate,setSelDate]=useState(today);

  const [ln,setLn]=useState(""); const [lIngr,setLIngr]=useState(""); const [lLoad,setLLoad]=useState(false);
  const [dn,setDn]=useState(""); const [dIngr,setDIngr]=useState(""); const [dLoad,setDLoad]=useState(false);
  const [comment,setComment]=useState("");
  const ex=menus.find(m=>m.date===selDate);

  useEffect(()=>{
    if(ex){setBf(ex.breakfast||"");setBIngr((ex.bIngr||[]).join(", "));setLn(ex.lunch||"");setLIngr((ex.lIngr||[]).join(", "));setDn(ex.dinner||"");setDIngr((ex.dIngr||[]).join(", "));}
    else{setBf("");setBIngr("");setLn("");setLIngr("");setDn("");setDIngr("");}
  },[selDate]);

  const fetchIngr=async(dish,setIngr,setLoad)=>{
    if(!dish.trim()){showToast("Enter dish name first!");return;}
    setLoad(true);
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:200,messages:[{role:"user",content:`List ingredients for "${dish}" Indian style. Return ONLY comma-separated names. Max 10.`}]})});
      const data=await res.json();
      setIngr(data.content?.[0]?.text?.trim()||"");
      showToast("✅ Ingredients fetched!");
    }catch{showToast("Could not fetch.");}
    setLoad(false);
  };

  const pi=s=>s.split(",").map(x=>x.trim()).filter(Boolean);

  const saveMenu=()=>{
    if(!bf&&!ln&&!dn){showToast("Fill at least one meal!");return;}

    setMenus(ex?menus.map(m=>m.id===ex.id?entry:m):[...menus,entry]);

  const respond=(id,status,cmt)=>{
    setMenus(menus.map(m=>m.id===id?{...m,status,comment:cmt}:m));

    {label:"☀️ Lunch",meal:ln,setMeal:setLn,ingr:lIngr,setIngr:setLIngr,load:lLoad,setLoad:setLLoad,ph:"e.g. Dal Chawal..."},
    {label:"🌙 Dinner",meal:dn,setMeal:setDn,ingr:dIngr,setIngr:setDIngr,load:dLoad,setLoad:setDLoad,ph:"e.g. Khichdi..."},
  ];

  return (
    <div style={S.page}>
      <h2 style={S.title}>🍽️ Menu Planner</h2>
      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {[{id:"plan",l:"📝 Plan"},{id:"week",l:"📅 Week View"}].map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{...S.tab,...(tab===t.id?S.tabA:{})}}>{t.l}</button>)}
      </div>

      {tab==="plan"&&(
        <div>
          <div style={{...S.card,marginBottom:12}}>
            <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:12,flexWrap:"wrap"}}>
              <label style={{fontWeight:700,fontSize:13}}>📅 Date:</label>
              <input type="date" style={S.sel} value={selDate} onChange={e=>setSelDate(e.target.value)}/>
              {ex&&<span style={{...S.badge,background:ex.status==="approved"?"#e8f5e9":ex.status==="rejected"?"#fde8e8":"#fff8e1",color:ex.status==="approved"?"#1a6b3c":ex.status==="rejected"?"#c0392b":"#c8962a"}}>{ex.status==="approved"?"✅ Approved":ex.status==="rejected"?"❌ Rejected":"⏳ Pending"}</span>}
            </div>

              <div key={row.label} style={{borderBottom:"1px solid #f0f0f0",paddingBottom:10,marginBottom:10}}>
                <div style={{fontWeight:700,fontSize:12,color:"#1a6b3c",marginBottom:5}}>{row.label}</div>
                <div style={{display:"flex",gap:6,marginBottom:5}}>
                  <input style={{...S.input,flex:1}} placeholder={row.ph} value={row.meal} onChange={e=>row.setMeal(e.target.value)}/>
                  <button style={{...S.btn,background:row.load?"#aaa":"linear-gradient(90deg,#c8962a,#b07d20)",fontSize:11,padding:"6px 9px",flexShrink:0}} onClick={()=>fetchIngr(row.meal,row.setIngr,row.setLoad)} disabled={row.load}>{row.load?"⏳":"✨ AI"}</button>
                </div>
                {row.ingr?(

                        </span>

            {ex?.status==="rejected"&&ex.comment&&<div style={{background:"#fde8e8",borderRadius:8,padding:"8px 12px",marginTop:8,fontSize:13}}>💬 {ex.comment}</div>}
          </div>
          {user!=="Minal"&&ex&&ex.status==="pending"&&(
            <div style={{...S.card,border:"2px solid #1a6b3c"}}>
              <div style={{fontWeight:700,marginBottom:8}}>Approve or Reject?</div>
              <textarea style={{...S.input,height:50,resize:"none",marginBottom:8}} placeholder="Comment (required for rejection)..." value={comment} onChange={e=>setComment(e.target.value)}/>
              <div style={{display:"flex",gap:8}}>
                <button style={{...S.btn,flex:1}} onClick={()=>respond(ex.id,"approved",comment)}>✅ Approve</button>
                <button style={{...S.btn,flex:1,background:"#c0392b"}} onClick={()=>{if(!comment){showToast("Comment required!");return;}respond(ex.id,"rejected",comment);}}>❌ Reject</button>
              </div>
            </div>
          )}
        </div>
      )}
      {tab==="week"&&(
        <div>
          {days7.map(d=>{
            const m=menus.find(x=>x.date===d);const isT=d===today;
            return (
              <div key={d} style={{...S.card,marginBottom:8,borderLeft:`4px solid ${isT?"#c8962a":"#e0e0e0"}`,cursor:"pointer"}} onClick={()=>{setSelDate(d);setTab("plan");}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{fontWeight:700,fontSize:13,color:isT?"#c8962a":"#2d2d2d"}}>{isT?"📍 ":""}{new Date(d).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}</div>
                  {m&&<span style={{...S.badge,background:m.status==="approved"?"#e8f5e9":m.status==="rejected"?"#fde8e8":"#fff8e1",color:m.status==="approved"?"#1a6b3c":m.status==="rejected"?"#c0392b":"#c8962a"}}>{m.status==="approved"?"✅":m.status==="rejected"?"❌":"⏳"}</span>}
                </div>
                {m?<div style={{fontSize:12,color:"#666",marginTop:2}}>{[m.breakfast&&"🌅 "+m.breakfast,m.lunch&&"☀️ "+m.lunch,m.dinner&&"🌙 "+m.dinner].filter(Boolean).join(" • ")}</div>
                :<div style={{fontSize:12,color:"#bbb",marginTop:2}}>No menu — tap to plan</div>}

      )}
    </div>
  );

function Tasks({user,tasks,setTasks,showToast}) {
  const [text,setText]=useState(""); const [assignTo,setAssignTo]=useState("Both"); const [priority,setPriority]=useState("Normal"); const [due,setDue]=useState("");
  const [editId,setEditId]=useState(null);
  const add=()=>{
    if(!text.trim())return;
    if(editId){
      setTasks(tasks.map(t=>t.id===editId?{...t,text:text.trim(),assignTo,priority,dueDate:due}:t));
      setEditId(null);showToast("Task updated! ✅");
    } else {
      setTasks([...tasks,{id:Date.now(),text:text.trim(),assignTo,priority,dueDate:due,done:false,doneBy:"",by:user,createdAt:new Date().toISOString().slice(0,10)}]);
      showToast("Task added! ✅");
    }
    setText("");setDue("");
  };
  const startEdit=(t)=>{setText(t.text);setAssignTo(t.assignTo);setPriority(t.priority);setDue(t.dueDate||"");setEditId(t.id);};
  const toggle=id=>setTasks(tasks.map(t=>t.id===id?{...t,done:!t.done,doneBy:!t.done?user:""}:t));
  const del=id=>setTasks(tasks.filter(t=>t.id!==id));
  const canEdit=(t)=>user==="Minal";
  const PC={Urgent:"#c0392b",Normal:"#5b8dd9",Low:"#aaa"};
  const mine=tasks.filter(t=>t.assignTo===user||t.assignTo==="Both"||user==="Minal");
  return (
    <div style={S.page}>
      <h2 style={S.title}>✅ Tasks</h2>
      <div style={{...S.card,marginBottom:12}}>
        <input style={{...S.input,marginBottom:8}} placeholder="Enter task..." value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()}/>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          <select style={S.sel} value={assignTo} onChange={e=>setAssignTo(e.target.value)}><option>Both</option><option>Minal</option><option>Piyush</option><option>Sahil</option></select>
          <select style={S.sel} value={priority} onChange={e=>setPriority(e.target.value)}><option>Normal</option><option>Urgent</option><option>Low</option></select>
          <input type="date" style={S.sel} value={due} onChange={e=>setDue(e.target.value)}/>
          <button style={S.btn} onClick={add}>{editId?"Update":"Add"}</button>
          {editId&&<button onClick={()=>{setEditId(null);setText("");setDue("");}} style={{background:"#f0f0f0",border:"none",borderRadius:8,padding:"7px 12px",cursor:"pointer",fontFamily:"Poppins,sans-serif",fontSize:13}}>Cancel</button>}
        </div>
      </div>
      {mine.filter(t=>!t.done).map(t=>(
        <div key={t.id} style={{...S.card,marginBottom:7,display:"flex",gap:10,alignItems:"flex-start",border:editId===t.id?"1.5px solid #c8962a":"1px solid #e8f3ec"}}>
          <input type="checkbox" checked={false} onChange={()=>toggle(t.id)} style={{accentColor:"#1a6b3c",width:17,height:17,marginTop:2,flexShrink:0}}/>
          <div style={{flex:1}}>
            <div style={{fontWeight:600,fontSize:14}}>{t.text}</div>
            <div style={{display:"flex",gap:5,marginTop:3,flexWrap:"wrap"}}>
              <span style={{...S.badge,background:PC[t.priority]+"22",color:PC[t.priority]}}>{t.priority}</span>
              <span style={{...S.badge,background:"#f0f0f0",color:"#666"}}>👤 {t.assignTo}</span>
              {t.dueDate&&<span style={{...S.badge,background:"#fff3e0",color:"#c8962a"}}>📅 {t.dueDate}</span>}
              <span style={{...S.badge,background:"#f0f0f0",color:"#aaa"}}>by {t.by}</span>
            </div>
          </div>
          {canEdit(t)&&<button onClick={()=>startEdit(t)} style={{background:"#f0f0f0",border:"none",borderRadius:7,width:28,height:28,cursor:"pointer",fontSize:13,display:"flex",alignItems:"center",justifyContent:"center"}}>✏️</button>}
          {canEdit(t)&&<button onClick={()=>del(t.id)} style={S.del}>✕</button>}
        </div>
      ))}
      {mine.filter(t=>t.done).length>0&&<>
        <div style={{fontWeight:700,color:"#1a6b3c",margin:"12px 0 6px",fontSize:13}}>✅ Done ({mine.filter(t=>t.done).length})</div>
        {mine.filter(t=>t.done).map(t=>(
          <div key={t.id} style={{...S.card,marginBottom:5,opacity:0.55,display:"flex",gap:10,alignItems:"center"}}>
            <input type="checkbox" checked onChange={()=>toggle(t.id)} style={{accentColor:"#1a6b3c",width:15,height:15}}/>
            <span style={{flex:1,textDecoration:"line-through",fontSize:13,color:"#aaa"}}>{t.text}</span>
            {canEdit(t)&&<button onClick={()=>del(t.id)} style={S.del}>✕</button>}
          </div>
        ))}
      </>}
      {mine.length===0&&<p style={{color:"#aaa",fontSize:14,textAlign:"center",padding:20}}>No tasks yet!</p>}
    </div>
  );
}

function Grocery({user,grocery,setGrocery,showToast}) {

      <div style={{display:"flex",justifyContent:"space-between",margin:"8px 0",alignItems:"center"}}>

        {done.length>0&&<button onClick={clearDone} style={{background:"none",border:"1px solid #ddd",borderRadius:8,padding:"3px 10px",cursor:"pointer",fontSize:12,fontFamily:"Poppins,sans-serif"}}>Clear Done</button>}
      </div>
      {Object.entries(grouped).map(([c,items])=>(
        <div key={c} style={{marginBottom:10}}>
          <div style={{fontWeight:700,fontSize:10,color:"#1a6b3c",marginBottom:4,textTransform:"uppercase",letterSpacing:1}}>{c}</div>
          {items.map(g=>(
            <div key={g.id} style={{...S.card,marginBottom:4,padding:"6px 10px",display:"flex",alignItems:"center",gap:7,borderLeft:`3px solid ${AC[g.assignTo||"Anyone"]}`,border:editId===g.id?"1.5px solid #c8962a":undefined}}>

              <select value={g.assignTo||"Anyone"} onChange={e=>changeAssign(g.id,e.target.value)} style={{...S.sel,padding:"2px 4px",fontSize:11,width:"auto",flexShrink:0,border:`1.5px solid ${AC[g.assignTo||"Anyone"]}`,color:AC[g.assignTo||"Anyone"],fontWeight:700}}>
                {ASSIGN.map(a=><option key={a} value={a}>{AI[a]} {a}</option>)}
              </select>
              {canEdit(g)&&<button onClick={()=>startEdit(g)} style={{background:"#f0f0f0",border:"none",borderRadius:7,width:26,height:26,cursor:"pointer",fontSize:11,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>✏️</button>}
              {canEdit(g)&&<button onClick={()=>del(g.id)} style={{...S.del,width:26,height:26,flexShrink:0}}>✕</button>}
            </div>
          ))}
        </div>
      ))}
      {done.length>0&&<div>
        <div style={{fontWeight:700,fontSize:10,color:"#1a6b3c",marginBottom:4}}>✅ BOUGHT</div>
        {done.map(g=>(
          <div key={g.id} style={{...S.card,marginBottom:3,padding:"5px 12px",display:"flex",alignItems:"center",gap:8,opacity:0.5}}>
            <input type="checkbox" checked onChange={()=>toggle(g.id)} style={{accentColor:"#1a6b3c",width:13,height:13}}/>
            <span style={{flex:1,fontSize:12,textDecoration:"line-through"}}>{g.item}</span>
            <span style={{fontSize:11,color:AC[g.assignTo||"Anyone"]}}>{AI[g.assignTo||"Anyone"]}</span>
            {canEdit(g)&&<button onClick={()=>del(g.id)} style={{...S.del,width:24,height:24}}>✕</button>}
          </div>
        ))}
      </div>}
    </div>
  );
}
function Budget({user,budget,setBudget,fund,setFund,showToast}) {
  const [tab,setTab]=useState("wallets");
  const [desc,setDesc]=useState(""); const [amt,setAmt]=useState(""); const [cat,setCat]=useState("Groceries");
  const [wallet,setWallet]=useState("household");
  const [expType,setExpType]=useState("household"); // for sahil: household or personal
  const [selMonth,setSelMonth]=useState(new Date().toISOString().slice(0,7));
  const [scanning,setScanning]=useState(false); const [scanned,setScanned]=useState([]);
  const [scanWallet,setScanWallet]=useState("household"); // household or personal
  const [cAmt,setCAmt]=useState("");
  const [pAmt,setPAmt]=useState("");
  const [sahilGiveAmt,setSahilGiveAmt]=useState(""); // Piyush giving to Sahil
  const thisMonth=new Date().toISOString().slice(0,7);
  const today=new Date().toISOString().slice(0,10);
  const CATS=["Groceries","Vegetables","Dairy","Baby","Household","Medical","School","Utility","Travel","Entertainment","Personal","Other"];

  // Balances
  const hBal=(fund?.minal||0)+(fund?.piyush||0);
  const mPersonal=fund?.minalPersonal||0;
  const pPersonal=fund?.piyushPersonal||0;
  const sahilFund=fund?.sahilFund||0; // given by Piyush to Sahil
  const sahilPersonal=fund?.sahilPersonal||0; // Sahil's own personal

  const userPersonal=user==="Minal"?mPersonal:user==="Piyush"?pPersonal:sahilPersonal;
  const userPersonalKey=user==="Minal"?"minalPersonal":user==="Piyush"?"piyushPersonal":"sahilPersonal";

  // Deduct helpers
  const deductHousehold=(a,desc2,cat2,src)=>{
    if(a>hBal){showToast("⚠️ Household Fund low!");return false;}
    const mShare=hBal>0?(fund?.minal||0)/hBal:0.5;
    const mDed=Math.min(fund?.minal||0,a*mShare); const pDed=a-mDed;
    const exp={id:Date.now(),desc:desc2,amount:a,cat:cat2,source:src,date:today,month:thisMonth,by:user};
    setFund(f=>({...f,minal:Math.max(0,(f?.minal||0)-mDed),piyush:Math.max(0,(f?.piyush||0)-pDed),hExpenses:[...(f?.hExpenses||[]),exp]}));
    return true;
  };

  const deductPersonal=(a,desc2,cat2,src)=>{
    if(a>userPersonal){showToast(`⚠️ ${user} Personal low!`);return false;}
    const exp={id:Date.now(),desc:desc2,amount:a,cat:cat2,source:src,date:today,month:thisMonth,by:user};
    const expKey=user==="Minal"?"minalExpenses":user==="Piyush"?"piyushExpenses":"sahilPersonalExpenses";
    setFund(f=>({...f,[userPersonalKey]:Math.max(0,(f?.[userPersonalKey]||0)-a),[expKey]:[...(f?.[expKey]||[]),exp]}));
    return true;
  };

  const deductSahilFund=(a,desc2,cat2,src)=>{
    if(a>sahilFund){showToast("⚠️ Sahil Fund low!");return false;}
    const exp={id:Date.now(),desc:desc2,amount:a,cat:cat2,source:src,date:today,month:thisMonth,by:user};
    setFund(f=>({...f,sahilFund:Math.max(0,(f?.sahilFund||0)-a),sahilHouseExpenses:[...(f?.sahilHouseExpenses||[]),exp]}));
    return true;
  };

  const addEntry=()=>{
    if(!desc.trim()||!amt)return;
    const a=parseFloat(amt);
    let ok=true;
    let src="";
    if(user==="Sahil"){
      if(expType==="household"){ok=deductSahilFund(a,desc,cat,"Sahil Fund");src="Sahil Fund";}
      else{ok=deductPersonal(a,desc,cat,"Sahil Personal");src="Sahil Personal";}
    } else {
      if(wallet==="household"){ok=deductHousehold(a,desc,cat,"Manual");src="Household Fund";}
      else{ok=deductPersonal(a,desc,cat,"Manual");src=user+" Personal";}
    }
    if(!ok)return;
    setBudget([...budget,{id:Date.now(),desc:desc.trim(),amt:a,type:"Expense",cat,source:src,by:user,date:today,wallet:user==="Sahil"?expType:wallet}]);
    setDesc("");setAmt("");showToast("Added & deducted! 💰");
  };

  const contribute=(type2,amount,person)=>{
    if(!amount)return; const a=parseFloat(amount);
    if(type2==="household"){
      const entry={id:Date.now(),person,amount:a,date:today,month:thisMonth};
      setFund(f=>({...f,[person]:(f?.[person]||0)+a,contributions:[...(f?.contributions||[]),entry]}));
      showToast(`₹${a} added to Household! 💰`);
    } else if(type2==="minalPersonal"){
      setFund(f=>({...f,minalPersonal:(f?.minalPersonal||0)+a,minalContribs:[...(f?.minalContribs||[]),{id:Date.now(),amount:a,date:today,month:thisMonth}]}));
      showToast("Added to Minal Personal! 💜");
    } else if(type2==="piyushPersonal"){
      setFund(f=>({...f,piyushPersonal:(f?.piyushPersonal||0)+a,piyushContribs:[...(f?.piyushContribs||[]),{id:Date.now(),amount:a,date:today,month:thisMonth}]}));
      showToast("Added to Piyush Personal! 💙");
    } else if(type2==="sahilFund"){
      // Piyush gives Sahil fund
      const entry={id:Date.now(),amount:a,date:today,month:thisMonth,givenBy:user};
      setFund(f=>({...f,sahilFund:(f?.sahilFund||0)+a,sahilFundHistory:[...(f?.sahilFundHistory||[]),entry]}));
      showToast(`₹${a} given to Sahil! 👦`);
    } else if(type2==="sahilPersonal"){
      setFund(f=>({...f,sahilPersonal:(f?.sahilPersonal||0)+a}));
      showToast("Added to Sahil Personal! 💚");
    }
    setCAmt(""); setPAmt(""); setSahilGiveAmt("");
  };

  const scanReceipt=async(file)=>{
    setScanning(true); setScanned([]);
    try{
      const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});
      const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1500,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:file.type||"image/jpeg",data:b64}},{type:"text",text:`Extract items with prices from this receipt. Return ONLY JSON array: [{"name":"item","amount":"price","category":"Groceries"}]. Categories: Groceries,Vegetables,Dairy,Baby,Household,Medical,Snacks,Personal,Other`}]}]})});
      const data=await resp.json();
      const items=JSON.parse((data.content?.[0]?.text||"[]").replace(/```json|```/g,"").trim());
      const defaultWallet=user==="Sahil"?"sahilFund":"household";      setScanned(items.map((it,i)=>({...it,id:i,selected:true,wallet:defaultWallet})));
      showToast(`Found ${items.length} items!`);
    }catch{showToast("Could not read receipt.");}
    setScanning(false);
  };

  const addScanned=()=>{
    const entries=scanned.filter(i=>i.selected&&i.name&&i.amount);
    const total=entries.reduce((s,i)=>s+parseFloat(i.amount||0),0);
    if(user==="Sahil"){
      if(total>sahilFund){showToast("⚠️ Sahil Fund insufficient!");return;}
      const exps=entries.map(i=>({id:Date.now()+Math.random(),desc:i.name,amount:parseFloat(i.amount),cat:i.category||"Other",source:"Receipt Scan",date:today,month:thisMonth,by:user}));
      setFund(f=>({...f,sahilFund:Math.max(0,(f?.sahilFund||0)-total),sahilHouseExpenses:[...(f?.sahilHouseExpenses||[]),...exps]}));
    } else if(scanWallet==="personal"){
      if(total>userPersonal){showToast(`⚠️ ${user} Personal insufficient!`);return;}
      const exps=entries.map(i=>({id:Date.now()+Math.random(),desc:i.name,amount:parseFloat(i.amount),cat:i.category||"Other",source:"Receipt Scan",date:today,month:thisMonth,by:user}));
      const expKey=user==="Minal"?"minalExpenses":"piyushExpenses";
      setFund(f=>({...f,[userPersonalKey]:Math.max(0,(f?.[userPersonalKey]||0)-total),[expKey]:[...(f?.[expKey]||[]),...exps]}));
    } else {
      if(total>hBal){showToast("⚠️ Household Fund insufficient!");return;}
      const mShare=hBal>0?(fund?.minal||0)/hBal:0.5;
      const mDed=Math.min(fund?.minal||0,total*mShare); const pDed=total-mDed;
      const exps=entries.map(i=>({id:Date.now()+Math.random(),desc:i.name,amount:parseFloat(i.amount),cat:i.category||"Other",source:"Receipt Scan",date:today,month:thisMonth,by:user}));
      setFund(f=>({...f,minal:Math.max(0,(f?.minal||0)-mDed),piyush:Math.max(0,(f?.piyush||0)-pDed),hExpenses:[...(f?.hExpenses||[]),...exps]}));
    }
    const src=user==="Sahil"?"Sahil Fund":scanWallet==="personal"?user+" Personal":"Household Fund";
    const budgetEntries=entries.map(i=>({id:Date.now()+Math.random(),desc:i.name,amt:parseFloat(i.amount),type:"Expense",cat:i.category||"Other",source:src,by:user,date:today,wallet:scanWallet}));
    setBudget([...budget,...budgetEntries]);
    setScanned([]); showToast(`${entries.length} items added & ₹${total.toLocaleString()} deducted! ✅`);
  };

  const walletOpts=user==="Sahil"?[
    {val:"sahilFund",l:"🏠 Ghar ka kharcha",bal:sahilFund,c:"#1a6b3c"},
    {val:"sahilPersonal",l:"👦 Personal",bal:sahilPersonal,c:"#5cba8a"},
  ]:[
    {val:"household",l:"🏦 Household",bal:hBal,c:"#1a6b3c"},
    {val:"personal",l:`${user==="Minal"?"👩":"👨"} Personal`,bal:userPersonal,c:user==="Minal"?"#9c6dd8":"#5b8dd9"},
  ];

  const mthExp=budget.filter(b=>b.date?.startsWith(selMonth));
  const catBreak=CATS.reduce((a,c)=>{const v=mthExp.filter(b=>b.cat===c).reduce((s,b)=>s+b.amt,0);if(v>0)a[c]=v;return a;},{});
  const maxCat=Math.max(...Object.values(catBreak),1);

  // Sahil total this month
  const sahilHouseThisMonth=(fund?.sahilHouseExpenses||[]).filter(e=>e.month===thisMonth).reduce((s,e)=>s+(e.amount||0),0);
  const sahilPersonalThisMonth=(fund?.sahilPersonalExpenses||[]).filter(e=>e.month===thisMonth).reduce((s,e)=>s+(e.amount||0),0);
  const piyushGaveThisMonth=(fund?.sahilFundHistory||[]).filter(e=>e.month===thisMonth&&e.givenBy==="Piyush").reduce((s,e)=>s+(e.amount||0),0);
  const minalGaveThisMonth=(fund?.sahilFundHistory||[]).filter(e=>e.month===thisMonth&&e.givenBy==="Minal").reduce((s,e)=>s+(e.amount||0),0);

  return (
    <div style={S.page}>
      <h2 style={S.title}>💰 Budget & Expenses</h2>

      {/* Balance cards */}
      <div style={{display:"flex",gap:5,marginBottom:12,flexWrap:"wrap"}}>
        {user!=="Sahil"&&<div style={{...S.card,flex:1,minWidth:80,textAlign:"center",borderTop:"3px solid #1a6b3c"}}>
          <div style={{fontSize:8,color:"#888"}}>🏦 Household</div>
          <div style={{fontSize:14,fontWeight:800,color:"#1a6b3c"}}>₹{hBal.toLocaleString()}</div>
          {hBal<500&&<div style={{fontSize:9,color:"#c0392b"}}>⚠️ Low</div>}
        </div>}
        {user==="Minal"&&<div style={{...S.card,flex:1,minWidth:70,textAlign:"center",borderTop:"3px solid #9c6dd8"}}>
          <div style={{fontSize:8,color:"#888"}}>👩 Minal</div>
          <div style={{fontSize:14,fontWeight:800,color:"#9c6dd8"}}>₹{mPersonal.toLocaleString()}</div>
        </div>}
        {user==="Piyush"&&<div style={{...S.card,flex:1,minWidth:70,textAlign:"center",borderTop:"3px solid #5b8dd9"}}>
          <div style={{fontSize:8,color:"#888"}}>👨 Piyush</div>
          <div style={{fontSize:14,fontWeight:800,color:"#5b8dd9"}}>₹{pPersonal.toLocaleString()}</div>
        </div>}
        <div style={{...S.card,flex:1,minWidth:70,textAlign:"center",borderTop:"3px solid #5cba8a"}}>
          <div style={{fontSize:8,color:"#888"}}>👦 Sahil</div>
          <div style={{fontSize:14,fontWeight:800,color:"#5cba8a"}}>₹{sahilFund.toLocaleString()}</div>
          <div style={{fontSize:8,color:"#aaa"}}>+₹{sahilPersonal.toLocaleString()} personal</div>
        </div>
      </div>

      {/* Tabs */}
      <div style={{display:"flex",gap:4,marginBottom:12,overflowX:"auto"}}>
        {[
          ...(user!=="Sahil"?[{id:"wallets",l:"🏦 Wallets"}]:[]),
          {id:"add",l:"✍️ Add"},
          {id:"scan",l:"📸 Scan"},
          {id:"sahil",l:"👦 Sahil"},
          ...(user!=="Sahil"?[{id:"report",l:"📊 Report"},{id:"history",l:"📋 History"}]:[{id:"report",l:"📊 My Report"},{id:"history",l:"📋 My History"}]),
        ].map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{...S.tab,flexShrink:0,fontSize:11,...(tab===t.id?S.tabA:{})}}>{t.l}</button>
        ))}
      </div>

      {/* WALLETS — sirf Minal/Piyush */}
      {tab==="wallets"&&user!=="Sahil"&&(
        <div>
          {user!=="Sahil"&&<div style={{...S.card,marginBottom:10,border:"2px solid #1a6b3c"}}>
            <div style={{fontWeight:700,color:"#1a6b3c",marginBottom:8}}>🏦 Household Fund</div>
            <div style={{background:"linear-gradient(135deg,#1a6b3c,#145530)",borderRadius:10,padding:"12px 14px",color:"#fff",marginBottom:8}}>
              <div style={{fontSize:10,opacity:0.8}}>Total Balance</div>
              <div style={{fontSize:26,fontWeight:800}}>₹{hBal.toLocaleString()}</div>
              <div style={{display:"flex",gap:20,marginTop:6}}>
                <div><div style={{fontSize:9,opacity:0.7}}>👩 Minal</div><div style={{fontWeight:700}}>₹{(fund?.minal||0).toLocaleString()}</div></div>
                <div><div style={{fontSize:9,opacity:0.7}}>👨 Piyush</div><div style={{fontWeight:700}}>₹{(fund?.piyush||0).toLocaleString()}</div></div>
              </div>
            </div>
            <input type="number" style={{...S.input,marginBottom:7}} placeholder="Amount to add (₹)" value={cAmt} onChange={e=>setCAmt(e.target.value)}/>
            <div style={{display:"flex",gap:7}}>
              <button style={{...S.btn,flex:1}} onClick={()=>contribute("household",cAmt,"minal")}>👩 Minal Adds</button>
              <button style={{...S.btn,flex:1,background:"#5b8dd9"}} onClick={()=>contribute("household",cAmt,"piyush")}>👨 Piyush Adds</button>
            </div>
          </div>}

          {/* Minal Personal — sirf Minal dekhe */}
          {user==="Minal"&&<div style={{...S.card,marginBottom:10,border:"2px solid #9c6dd8"}}>
            <div style={{fontWeight:700,color:"#9c6dd8",marginBottom:6}}>👩 Minal Personal Fund — ₹{mPersonal.toLocaleString()}</div>
            <div style={{display:"flex",gap:7}}>
              <input type="number" style={{...S.input,flex:1}} placeholder="Add amount (₹)" value={pAmt} onChange={e=>setPAmt(e.target.value)}/>
              <button style={{...S.btn,background:"#9c6dd8"}} onClick={()=>{contribute("minalPersonal",pAmt);setPAmt("");}}>Add</button>
            </div>
            {(fund?.minalExpenses||[]).filter(e=>e.month===thisMonth).length>0&&<div style={{marginTop:8}}>
              <div style={{fontSize:11,color:"#888",marginBottom:4}}>This month:</div>
              {[...(fund?.minalExpenses||[])].filter(e=>e.month===thisMonth).reverse().slice(0,3).map(e=>(
                <div key={e.id} style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"2px 0",borderBottom:"1px solid #f5f5f5"}}>
                  <span style={{color:"#555"}}>{e.desc}</span><span style={{color:"#c0392b"}}>-₹{e.amount}</span>
                </div>
              ))}
            </div>}
          </div>}

          {/* Piyush Personal — sirf Piyush dekhe */}
          {user==="Piyush"&&<div style={{...S.card,marginBottom:10,border:"2px solid #5b8dd9"}}>
            <div style={{fontWeight:700,color:"#5b8dd9",marginBottom:6}}>👨 Piyush Personal Fund — ₹{pPersonal.toLocaleString()}</div>
            <div style={{display:"flex",gap:7}}>
              <input type="number" style={{...S.input,flex:1}} placeholder="Add amount (₹)" value={pAmt} onChange={e=>setPAmt(e.target.value)}/>
              <button style={{...S.btn,background:"#5b8dd9"}} onClick={()=>{contribute("piyushPersonal",pAmt);setPAmt("");}}>Add</button>
            </div>
            {(fund?.piyushExpenses||[]).filter(e=>e.month===thisMonth).length>0&&<div style={{marginTop:8}}>
              <div style={{fontSize:11,color:"#888",marginBottom:4}}>This month:</div>
              {[...(fund?.piyushExpenses||[])].filter(e=>e.month===thisMonth).reverse().slice(0,3).map(e=>(
                <div key={e.id} style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"2px 0",borderBottom:"1px solid #f5f5f5"}}>
                  <span style={{color:"#555"}}>{e.desc}</span><span style={{color:"#c0392b"}}>-₹{e.amount}</span>
                </div>
              ))}
            </div>}
          </div>}
        </div>
      )}

      {/* ADD */}
      {tab==="add"&&(
        <div style={S.card}>
          <div style={{fontWeight:700,marginBottom:10,color:"#1a6b3c"}}>Add Expense</div>

          <div style={{display:"flex",gap:7,marginBottom:8}}>

              {walletOpts.map(w=>(

          </div>}

      {tab==="scan"&&(
        <div>
          <div style={{...S.card,textAlign:"center",padding:20,border:"2px dashed #c8962a",marginBottom:10}}>

function Schedule({user,schedule,setSchedule,showToast}) {
  const [title,setTitle]=useState(""); const [date,setDate]=useState(""); const [time,setTime]=useState(""); const [type,setType]=useState("General"); const [assignTo,setAssignTo]=useState("Both");
  const [editId,setEditId]=useState(null);
  const today=new Date().toISOString().slice(0,10);
  const TC={General:"#5b8dd9",Baby:"#c8962a",Medical:"#1a6b3c",School:"#9c6dd8",Reminder:"#c0392b"};
  const add=()=>{
    if(!title.trim()||!date)return;
    if(editId){
      setSchedule(schedule.map(s=>s.id===editId?{...s,title:title.trim(),date,time,type,assignTo}:s));
      setEditId(null);showToast("Updated! 📅");
    } else {
      setSchedule([...schedule,{id:Date.now(),title:title.trim(),date,time,type,assignTo,by:user}]);
      showToast("Added! 📅");
    }
    setTitle("");setDate("");setTime("");
  };
  const startEdit=(s)=>{setTitle(s.title);setDate(s.date);setTime(s.time||"");setType(s.type);setAssignTo(s.assignTo);setEditId(s.id);};
  const del=id=>setSchedule(schedule.filter(s=>s.id!==id));
  const canEdit=(s)=>user==="Minal";
  const upcoming=[...schedule].filter(s=>s.date>=today).sort((a,b)=>a.date>b.date?1:-1);
  return (
    <div style={S.page}>
      <h2 style={S.title}>📅 Schedule & Reminders</h2>
      <div style={{...S.card,marginBottom:12}}>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          <input style={{...S.input,flex:2}} placeholder="Event/Reminder..." value={title} onChange={e=>setTitle(e.target.value)}/>
          <input type="date" style={S.sel} value={date} onChange={e=>setDate(e.target.value)}/>
          <input type="time" style={S.sel} value={time} onChange={e=>setTime(e.target.value)}/>
          <select style={S.sel} value={type} onChange={e=>setType(e.target.value)}>{Object.keys(TC).map(t=><option key={t}>{t}</option>)}</select>
          <select style={S.sel} value={assignTo} onChange={e=>setAssignTo(e.target.value)}><option>Both</option><option>Minal</option><option>Piyush</option><option>Sahil</option></select>
          <button style={S.btn} onClick={add}>{editId?"Update":"Add"}</button>
          {editId&&<button onClick={()=>{setEditId(null);setTitle("");setDate("");setTime("");}} style={{background:"#f0f0f0",border:"none",borderRadius:8,padding:"7px 10px",cursor:"pointer",fontFamily:"Poppins,sans-serif",fontSize:12}}>✕</button>}
        </div>
      </div>
      {upcoming.length===0&&<p style={{color:"#aaa",fontSize:14,textAlign:"center",padding:20}}>No upcoming events.</p>}
      {upcoming.map(s=>(
        <div key={s.id} style={{...S.card,marginBottom:7,borderLeft:`4px solid ${TC[s.type]||"#ccc"}`,border:editId===s.id?"1.5px solid #c8962a":undefined}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:14}}>{s.title}</div>
              <div style={{fontSize:12,color:"#888",marginTop:2}}>📅 {s.date}{s.time?` ⏰ ${s.time}`:""} • 👤 {s.assignTo}</div>
              <span style={{...S.badge,background:TC[s.type]+"22",color:TC[s.type],marginTop:3,display:"inline-block"}}>{s.type}</span>
            </div>
            <div style={{display:"flex",gap:5}}>
              {canEdit(s)&&<button onClick={()=>startEdit(s)} style={{background:"#f0f0f0",border:"none",borderRadius:7,width:28,height:28,cursor:"pointer",fontSize:13,display:"flex",alignItems:"center",justifyContent:"center"}}>✏️</button>}
              {canEdit(s)&&<button onClick={()=>del(s.id)} style={S.del}>✕</button>}
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

  const paid=(maid.salaryHistory||[]).find(s=>s.month===selMonth);

  // ─── Leave balance system ───
  // Pro-rata free leaves for joining month
  const getFreeLeaves=(month)=>{
    if(!maid.joiningDate) return 2;
    const [jy,jm,jd]=maid.joiningDate.split("-").map(Number);
    const [my,mm]=month.split("-").map(Number);
    if(jy===my&&jm===mm){
      const daysInMonth=new Date(jy,jm,0).getDate();
