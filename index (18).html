<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Family Hub 🏠</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    const app = initializeApp({
      apiKey:"AIzaSyB92410ygcK7qTs69MDIcoweMJe0mNBjls",
      authDomain:"family-hub-minal.firebaseapp.com",
      projectId:"family-hub-minal",
      storageBucket:"family-hub-minal.firebasestorage.app",
      messagingSenderId:"558247968463",
      appId:"1:558247968463:web:20ed3b6ae1375abee441ba"
    });
    const db = getFirestore(app);
    window.storage = {
      get: async (key) => {
        try { const s=await getDoc(doc(db,"familyhub",key)); return s.exists()?{key,value:s.data().value}:null; } catch { return null; }
      },
      set: async (key,value) => {
        try { await setDoc(doc(db,"familyhub",key),{value,updatedAt:new Date().toISOString()}); return {key,value}; } catch { return null; }
      },
    };
    window._fbReady=true;
    window.dispatchEvent(new Event("firebase-ready"));
  </script>
</head>
<body style="margin:0;padding:0;">
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;

const PINS = { Minal:"1111", Piyush:"2222", Sahil:"3333" };
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MAID_TYPES = [
  {val:"babysitter",label:"👶 Baby Sitting",trackHours:true,trackMeals:false},
  {val:"cook",label:"🍳 Cook",trackHours:false,trackMeals:true},
  {val:"cleaner",label:"🧹 Cleaning",trackHours:false,trackMeals:false},
  {val:"other",label:"🏠 Other",trackHours:false,trackMeals:false},
];
const ALL_MODULES = [
  {id:"dashboard",label:"Dashboard",icon:"🏠"},
  {id:"planner",label:"Home Planner",icon:"📋"},
  {id:"menu",label:"Menu",icon:"🍽️"},
  {id:"tasks",label:"Tasks",icon:"✅"},
  {id:"grocery",label:"Grocery",icon:"🛒"},
  {id:"budget",label:"Budget",icon:"💰"},
  {id:"schedule",label:"Schedule",icon:"📅"},
  {id:"documents",label:"Documents",icon:"🪪"},
  {id:"maids",label:"Maids",icon:"🧽"},
  {id:"services",label:"Home Services",icon:"🔧"},
];

const load = async (key) => {
  try { const r = await window.storage.get(key,true); return r?JSON.parse(r.value):null; } catch { return null; }
};
const save = async (key,val) => {
  try { await window.storage.set(key,JSON.stringify(val),true); } catch {}
};

const S={
  page:{maxWidth:700,margin:"0 auto",padding:"18px 14px 40px"},
  title:{fontWeight:800,fontSize:20,color:"#1a6b3c",margin:"0 0 14px"},
  card:{background:"#fff",borderRadius:12,padding:"13px 15px",boxShadow:"0 2px 10px #1a6b3c0d",marginBottom:4,border:"1px solid #e8f3ec"},
  input:{width:"100%",border:"1.5px solid #c5e0cc",borderRadius:8,padding:"8px 12px",fontFamily:"Poppins,sans-serif",fontSize:13,outline:"none",boxSizing:"border-box",background:"#fafdfa"},
  sel:{border:"1.5px solid #c5e0cc",borderRadius:8,padding:"7px 10px",fontFamily:"Poppins,sans-serif",fontSize:13,background:"#fafdfa",outline:"none"},
  btn:{background:"linear-gradient(90deg,#1a6b3c,#217a46)",color:"#fff",border:"none",borderRadius:8,padding:"8px 16px",fontWeight:700,cursor:"pointer",fontFamily:"Poppins,sans-serif",fontSize:13},
  del:{background:"#fde8e8",border:"none",borderRadius:8,width:28,height:28,cursor:"pointer",color:"#c0392b",fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0},
  badge:{fontSize:11,padding:"2px 8px",borderRadius:20,fontWeight:600},
  tab:{background:"#f0faf4",border:"1.5px solid #c5e0cc",borderRadius:20,padding:"6px 14px",cursor:"pointer",fontFamily:"Poppins,sans-serif",fontSize:12,color:"#1a6b3c"},
  tabA:{background:"#1a6b3c",color:"#fff",fontWeight:700,border:"1.5px solid #1a6b3c"},
};

function Toast({msg,onClose}) {
  useEffect(()=>{const t=setTimeout(onClose,3000);return()=>clearTimeout(t);},[]);
  return <div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:"#2d2d2d",color:"#fff",padding:"10px 22px",borderRadius:24,fontSize:14,zIndex:9999,boxShadow:"0 4px 20px #0003"}}>{msg}</div>;
}

function LoginScreen({onLogin}) {
  const [user,setUser]=useState(null);
  const [pin,setPin]=useState("");
  const [err,setErr]=useState("");
  const hp=(d)=>{
    if(d==="⌫"){setPin(p=>p.slice(0,-1));return;}
    const np=pin+d;setPin(np);
    if(np.length===4){
      if(PINS[user]===np){onLogin(user);}
      else{setErr("Wrong PIN");setTimeout(()=>{setPin("");setErr("");},800);}
    }
  };
  if(!user) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#e8f5e9,#fff8e1)",fontFamily:"Poppins,sans-serif"}}>
      <div style={{background:"#fff",borderRadius:24,padding:"40px 32px",boxShadow:"0 8px 40px #1a6b3c30",textAlign:"center",minWidth:300}}>
        <div style={{fontSize:52,marginBottom:8}}>🏠</div>
        <h1 style={{margin:"0 0 4px",fontWeight:800,fontSize:26,color:"#1a6b3c"}}>Family Hub</h1>
        <p style={{color:"#888",fontSize:13,margin:"0 0 28px"}}>Minal, Piyush & Sahil</p>
        <div style={{display:"flex",gap:12}}>
          {["Minal","Piyush","Sahil"].map(u=>(
            <button key={u} onClick={()=>setUser(u)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",background:"#f1f9f4",border:"2px solid #a5d6b5",borderRadius:14,padding:"14px 8px",cursor:"pointer",fontFamily:"Poppins,sans-serif",gap:4}}>
              <span style={{fontSize:32}}>{u==="Minal"?"👩":u==="Piyush"?"👨":"👦"}</span>
              <span style={{fontWeight:700,fontSize:13}}>{u}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#e8f5e9,#fff8e1)",fontFamily:"Poppins,sans-serif"}}>
      <div style={{background:"#fff",borderRadius:24,padding:"40px 32px",boxShadow:"0 8px 40px #1a6b3c30",textAlign:"center",minWidth:280}}>
        <div style={{fontSize:44,marginBottom:8}}>{user==="Minal"?"👩":user==="Piyush"?"👨":"👦"}</div>
        <h2 style={{margin:"0 0 4px",fontWeight:800,color:"#1a6b3c"}}>Hi {user}!</h2>
        <p style={{color:"#888",fontSize:13,margin:"0 0 20px"}}>Enter your PIN</p>
        <div style={{display:"flex",gap:10,marginBottom:16,justifyContent:"center"}}>
          {[0,1,2,3].map(i=><div key={i} style={{width:16,height:16,borderRadius:"50%",background:pin.length>i?"#c8962a":"#e8e8e8"}}/>)}
        </div>
        {err&&<p style={{color:"#c0392b",fontSize:13,marginBottom:8}}>{err}</p>}
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,width:200,margin:"0 auto"}}>
          {["1","2","3","4","5","6","7","8","9","","0","⌫"].map((d,i)=>(
            <button key={i} onClick={()=>d&&hp(d)} style={{visibility:d?"visible":"hidden",border:"none",borderRadius:10,height:48,fontSize:18,fontWeight:700,cursor:"pointer",background:d==="⌫"?"#fde8e8":"#f4f4f4",color:d==="⌫"?"#c0392b":"#2d2d2d",fontFamily:"Poppins,sans-serif"}}>{d}</button>
          ))}
        </div>
        <button onClick={()=>{setUser(null);setPin("");}} style={{background:"none",border:"none",color:"#888",cursor:"pointer",marginTop:16,fontSize:13,fontFamily:"Poppins,sans-serif"}}>← Back</button>
      </div>
    </div>
  );
}
function FamilyHub() {
  const [user,setUser]=useState(null);
  const [mod,setMod]=useState("dashboard");
  const [toast,setToast]=useState(null);
  const showToast=(m)=>setToast(m);
  const [tasks,setTasks]=useState([]);
  const [grocery,setGrocery]=useState([]);
  const [budget,setBudget]=useState([]);
  const [schedule,setSchedule]=useState([]);
  const [menus,setMenus]=useState([]);
  const [planner,setPlanner]=useState({weekly:{},monthly:{},quarterly:{}});
  const [documents,setDocuments]=useState([]);
  const [maids,setMaids]=useState([]);
  const [fund,setFund]=useState({minal:0,piyush:0,contributions:[],expenses:[]});
  const [gas,setGas]=useState({records:[],currentCylinder:null,cleaning:[]});
  const [loaded,setLoaded]=useState(false);

  useEffect(()=>{
    (async()=>{
      const map=[
        ["tasks",setTasks,[]],["grocery",setGrocery,[]],["budget",setBudget,[]],
        ["schedule",setSchedule,[]],["menus",setMenus,[]],
        ["planner",setPlanner,{weekly:{},monthly:{},quarterly:{}}],
        ["documents",setDocuments,[]],["maids",setMaids,[]],
        ["fund",setFund,{minal:0,piyush:0,contributions:[],expenses:[]}],
        ["gas",setGas,{records:[],currentCylinder:null,cleaning:[]}],
      ];
      for(const [key,setter,def] of map){
        const d=await load("fh_"+key);
        setter(d??def);
      }
      setLoaded(true);
    })();
  },[]);

  const persist=(key,val)=>save("fh_"+key,val);
  if(!user) return <LoginScreen onLogin={u=>{setUser(u);setMod("dashboard");}}/>;
  if(!loaded) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",fontFamily:"Poppins,sans-serif",fontSize:16}}>Loading... 🏠</div>;

  const P={
    tasks,setTasks:v=>{setTasks(v);persist("tasks",v);},
    grocery,setGrocery:v=>{setGrocery(v);persist("grocery",v);},
    budget,setBudget:v=>{setBudget(v);persist("budget",v);},
    schedule,setSchedule:v=>{setSchedule(v);persist("schedule",v);},
    menus,setMenus:v=>{setMenus(v);persist("menus",v);},
    planner,setPlanner:v=>{setPlanner(v);persist("planner",v);},
    documents,setDocuments:v=>{setDocuments(v);persist("documents",v);},
    maids,setMaids:v=>{setMaids(v);persist("maids",v);},
    fund,setFund:v=>{setFund(v);persist("fund",v);},
    gas,setGas:v=>{setGas(v);persist("gas",v);},
    user,showToast,setMod
  };

  return (
    <div style={{display:"flex",flexDirection:"column",minHeight:"100vh",fontFamily:"Poppins,sans-serif",background:"#f3f8f5"}}>
      <div style={{background:"linear-gradient(90deg,#1a6b3c,#145530)",display:"flex",alignItems:"center",gap:8,padding:"0 10px",height:52,flexShrink:0,position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 12px #1a6b3c40"}}>
        <span style={{fontSize:18,flexShrink:0}}>🏠</span>
        <nav style={{flex:1,display:"flex",gap:1,overflowX:"auto",scrollbarWidth:"none"}}>
          {ALL_MODULES.map(m=>(
            <button key={m.id} onClick={()=>setMod(m.id)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:1,padding:"4px 6px",borderRadius:7,border:"none",background:mod===m.id?"#c8962a":"transparent",color:mod===m.id?"#fff":"#c8f0d8",cursor:"pointer",fontFamily:"Poppins,sans-serif",flexShrink:0}}>
              <span style={{fontSize:14}}>{m.icon}</span>
              <span style={{fontSize:8,fontWeight:mod===m.id?700:400}}>{m.label}</span>
            </button>
          ))}
        </nav>
        <div style={{fontSize:10,color:"#d4f5c0",flexShrink:0}}>{user==="Minal"?"👩":user==="Piyush"?"👨":"👦"}</div>
        <button onClick={()=>setUser(null)} style={{background:"#ffffff22",border:"none",borderRadius:6,padding:"3px 7px",color:"#fff",cursor:"pointer",fontSize:10,fontFamily:"Poppins,sans-serif",flexShrink:0}}>Exit</button>
      </div>
      <div style={{flex:1,overflowY:"auto"}}>
        {mod==="dashboard" && <Dashboard {...P}/>}
        {mod==="planner"   && <HomePlanner {...P}/>}
        {mod==="menu"      && <MenuModule {...P}/>}
        {mod==="tasks"     && <Tasks {...P}/>}
        {mod==="grocery"   && <Grocery {...P}/>}
        {mod==="budget"    && <Budget {...P}/>}
        {mod==="schedule"  && <Schedule {...P}/>}
        {mod==="documents" && <Documents {...P}/>}
        {mod==="maids"     && <MaidMgmt {...P}/>}
        {mod==="services"  && <HomeServices {...P}/>}
      </div>
      {toast&&<Toast msg={toast} onClose={()=>setToast(null)}/>}
    </div>
  );
}

function Dashboard({user,tasks,schedule,menus,setMod}) {
  const today=new Date().toISOString().slice(0,10);
  const pending=tasks.filter(t=>!t.done).length;
  const todayEvents=schedule.filter(s=>s.date===today).length;
  const todayMenu=menus.find(m=>m.date===today);
  const pendingApproval=user!=="Minal"?menus.filter(m=>m.status==="pending").length:0;
  return (
    <div style={S.page}>
      <h2 style={S.title}>Welcome {user==="Minal"?"👩":user==="Piyush"?"👨":"👦"} {user}!</h2>
      <p style={{color:"#888",marginTop:-10,marginBottom:16,fontSize:13}}>{new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"})}</p>
      {pendingApproval>0&&<div style={{...S.card,background:"#e8f5e9",border:"1.5px solid #1a6b3c",marginBottom:10,cursor:"pointer"}} onClick={()=>setMod("menu")}>
        <div style={{fontWeight:700,color:"#1a6b3c"}}>🍽️ {pendingApproval} menu(s) waiting your approval!</div>
      </div>}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
        {[{l:"Pending Tasks",v:pending,c:"#c8962a",icon:"✅",m:"tasks"},{l:"Today Events",v:todayEvents,c:"#5b8dd9",icon:"📅",m:"schedule"}].map(x=>(
          <div key={x.m} style={{...S.card,borderTop:`3px solid ${x.c}`,cursor:"pointer",textAlign:"center"}} onClick={()=>setMod(x.m)}>
            <div style={{fontSize:22}}>{x.icon}</div>
            <div style={{fontSize:22,fontWeight:800,color:x.c}}>{x.v}</div>
            <div style={{fontSize:11,color:"#888"}}>{x.l}</div>
          </div>
        ))}
      </div>
      {todayMenu&&<div style={{...S.card,borderLeft:"4px solid #1a6b3c",marginBottom:10}}>
        <div style={{fontWeight:700,marginBottom:6}}>🍽️ Today's Menu</div>
        {todayMenu.breakfast&&<div style={{fontSize:13}}>🌅 <b>Breakfast:</b> {todayMenu.breakfast}</div>}
        {todayMenu.lunch&&<div style={{fontSize:13}}>☀️ <b>Lunch:</b> {todayMenu.lunch}</div>}
        {todayMenu.dinner&&<div style={{fontSize:13}}>🌙 <b>Dinner:</b> {todayMenu.dinner}</div>}
        <div style={{marginTop:6}}>
          {todayMenu.status==="approved"&&<span style={{...S.badge,background:"#e8f5e9",color:"#1a6b3c"}}>✅ Approved</span>}
          {todayMenu.status==="rejected"&&<span style={{...S.badge,background:"#fde8e8",color:"#c0392b"}}>❌ Rejected</span>}
          {todayMenu.status==="pending"&&<span style={{...S.badge,background:"#fff8e1",color:"#c8962a"}}>⏳ Pending</span>}
        </div>
      </div>}
      <div style={S.card}>
        <div style={{fontWeight:700,marginBottom:8}}>⚡ Quick Actions</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {[{l:"+ Task",m:"tasks"},{l:"+ Grocery",m:"grocery"},{l:"+ Expense",m:"budget"},{l:"📅 Schedule",m:"schedule"},{l:"🍽️ Menu",m:"menu"}].map(a=>(
            <button key={a.m} onClick={()=>setMod(a.m)} style={{background:"#f0faf4",color:"#1a6b3c",border:"1.5px solid #a5d6b5",borderRadius:20,padding:"5px 12px",cursor:"pointer",fontFamily:"Poppins,sans-serif",fontSize:12,fontWeight:600}}>{a.l}</button>
          ))}
        </div>
      </div>
    </div>
  );
}
const STATUS_OPTS=[{val:"",l:"—",bg:"#f0f0f0",c:"#aaa"},{val:"pending",l:"⏳",bg:"#fff8e1",c:"#c8962a"},{val:"done",l:"✅",bg:"#e8f5e9",c:"#1a6b3c"},{val:"postponed",l:"📅",bg:"#e3f2fd",c:"#5b8dd9"},{val:"cancelled",l:"❌",bg:"#fde8e8",c:"#c0392b"}];
function StatusPick({value,onChange}) {
  return <div style={{display:"flex",gap:3}}>{STATUS_OPTS.map(s=><button key={s.val} onClick={()=>onChange(s.val===value?"":s.val)} style={{background:value===s.val?s.bg:"#f8f8f8",border:`1.5px solid ${value===s.val?s.c:"#e0e0e0"}`,borderRadius:6,padding:"2px 5px",cursor:"pointer",fontSize:12,fontWeight:value===s.val?700:400}}>{s.l}</button>)}</div>;
}
const TH={padding:"7px 6px",textAlign:"left",fontWeight:700,fontSize:11,border:"1px solid #e0e0e0",background:"#1a6b3c",color:"#fff"};
const TD={padding:"3px 4px",border:"1px solid #e8e8e8",verticalAlign:"middle"};
const CI={width:"100%",border:"none",background:"transparent",fontFamily:"Poppins,sans-serif",fontSize:12,outline:"none",padding:"3px 2px"};

function HomePlanner({planner,setPlanner}) {
  const [tab,setTab]=useState("weekly");
  const todayDay=DAYS[new Date().getDay()];
  const thisMonth=MONTHS[new Date().getMonth()];
  const upd=(sec,key,val)=>setPlanner({...planner,[sec]:{...(planner?.[sec]||{}),[key]:val}});
  return (
    <div style={S.page}>
      <h2 style={S.title}>📋 Home Planner</h2>
      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {[{id:"weekly",l:"📅 Weekly"},{id:"monthly",l:"🗓️ Monthly (1st)"},{id:"quarterly",l:"📆 Quarterly (15th)"}].map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{...S.tab,flex:1,fontSize:11,...(tab===t.id?S.tabA:{})}}>{t.l}</button>
        ))}
      </div>
      {tab==="weekly"&&(
        <div>
          <div style={{...S.card,marginBottom:10,background:"#fff8e1",border:"1.5px solid #c8962a"}}>
            <b style={{color:"#c0392b",fontSize:13}}>🔴 Sunday Fixed Tasks</b>
            <div style={{display:"flex",flexDirection:"column",gap:6,marginTop:8}}>
              {["Buy Sabzi","Prepare Kaushik milk","Clear all trash","Plan weekly menu"].map((t,i)=>{
                const k="sun_"+i; const done=planner?.weekly?.[k];
                return <div key={i} style={{display:"flex",alignItems:"center",gap:8}}>
                  <input type="checkbox" checked={!!done} onChange={e=>upd("weekly",k,e.target.checked)} style={{accentColor:"#c0392b",width:16,height:16}}/>
                  <span style={{fontSize:13,textDecoration:done?"line-through":"none",color:done?"#aaa":"#2d2d2d"}}>{t}</span>
                </div>;
              })}
            </div>
          </div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
              <thead><tr>
                <th style={{...TH,width:50}}>Day</th>
                <th style={TH}>🍳 Breakfast</th>
                <th style={TH}>☀️ Lunch</th>
                <th style={TH}>🌙 Dinner</th>
                <th style={TH}>🧹 Chore</th>
                <th style={TH}>👕 Laundry</th>
                <th style={{...TH,minWidth:115}}>Status</th>
              </tr></thead>
              <tbody>{DAYS.map(day=>{
                const isT=day===todayDay;
                const st=planner?.weekly?.[day+"_status"]||"";
                const bg=st==="done"?"#e8f5e9":st==="pending"?"#fff8e1":st==="postponed"?"#e3f2fd":st==="cancelled"?"#fde8e8":isT?"#f0faf4":"#fff";
                return <tr key={day} style={{background:bg}}>
                  <td style={{...TD,fontWeight:700,color:isT?"#1a6b3c":"#555",background:isT?"#e8f5e9":"#f8f8f8",fontSize:10}}>{day.slice(0,3)}{isT?"📍":""}</td>
                  {["breakfast","lunch","dinner","chore","laundry"].map(col=>(
                    <td key={col} style={TD}><input style={{...CI,textDecoration:st==="cancelled"?"line-through":"none"}} placeholder="-" value={planner?.weekly?.[day+"_"+col]||""} onChange={e=>upd("weekly",day+"_"+col,e.target.value)}/></td>
                  ))}
                  <td style={{...TD,minWidth:115}}><StatusPick value={st} onChange={v=>upd("weekly",day+"_status",v)}/></td>
                </tr>;
              })}</tbody>
            </table>
          </div>
          <div style={{fontSize:11,color:"#aaa",marginTop:6}}>✏️ Tap any cell to edit</div>
        </div>
      )}
      {tab==="monthly"&&(
        <div>
          <div style={{...S.card,background:"#e8f5e9",border:"1.5px solid #1a6b3c",marginBottom:10}}>
            <b style={{color:"#1a6b3c"}}>🗓️ Tasks on 1st of every month</b>
          </div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
              <thead><tr><th style={TH}>Month</th><th style={TH}>📋 Tasks</th><th style={{...TH,minWidth:125}}>Status</th></tr></thead>
              <tbody>{MONTHS.map(month=>{
                const isCurr=month===thisMonth;
                const st=planner?.monthly?.[month+"_status"]||"";

function Budget({user,budget,setBudget,fund,setFund,showToast}) {
  const [tab,setTab]=useState("fund");
  const [desc,setDesc]=useState(""); const [amt,setAmt]=useState(""); const [type,setType]=useState("Expense"); const [cat,setCat]=useState("Groceries");
  const [selMonth,setSelMonth]=useState(new Date().toISOString().slice(0,7));
  const [cAmt,setCAmt]=useState(""); const [fDesc,setFDesc]=useState(""); const [fAmt,setFAmt]=useState(""); const [fCat,setFCat]=useState("Groceries");
  const [scanning,setScanning]=useState(false); const [scanned,setScanned]=useState([]);
  const thisMonth=new Date().toISOString().slice(0,7);
  const CATS=["Groceries","Vegetables","Dairy","Baby","Household","Medical","School","Utility","Travel","Entertainment","Other"];
  const bal=(fund?.minal||0)+(fund?.piyush||0);

  const addEntry=()=>{if(!desc.trim()||!amt)return;setBudget([...budget,{id:Date.now(),desc:desc.trim(),amt:parseFloat(amt),type,cat,source:"Manual",by:user,date:new Date().toISOString().slice(0,10)}]);setDesc("");setAmt("");showToast("Added! 💰");};

  const contribute=(person,amount)=>{
    if(!amount)return; const a=parseFloat(amount);
    const c={id:Date.now(),person,amount:a,date:new Date().toISOString().slice(0,10),month:thisMonth};
    setFund({...fund,[person]:(fund?.[person]||0)+a,contributions:[...(fund?.contributions||[]),c]});
    setCAmt(""); showToast("Added to fund! 💰");
  };

  const spendFund=()=>{
    if(!fDesc.trim()||!fAmt)return; const a=parseFloat(fAmt);
    if(a>bal){showToast("⚠️ Insufficient balance!");return;}
    const mDed=bal>0?Math.min(fund?.minal||0,a*((fund?.minal||0)/bal)):a/2;
    const pDed=a-mDed;
    const exp={id:Date.now(),desc:fDesc,amount:a,cat:fCat,date:new Date().toISOString().slice(0,10),month:thisMonth,by:user};
    setFund({...fund,minal:Math.max(0,(fund?.minal||0)-mDed),piyush:Math.max(0,(fund?.piyush||0)-pDed),expenses:[...(fund?.expenses||[]),exp]});
    setBudget([...budget,{id:Date.now()+1,desc:fDesc,amt:a,type:"Expense",cat:fCat,source:"Fund",by:user,date:new Date().toISOString().slice(0,10)}]);
    setFDesc("");setFAmt(""); showToast("Spent from fund! 💸");
  };

  const scanReceipt=async(file)=>{
    setScanning(true); setScanned([]);
    try{
      const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});
      const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1500,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:file.type||"image/jpeg",data:b64}},{type:"text",text:`Extract items with prices from this receipt. Return ONLY JSON array: [{"name":"item","amount":"price","category":"Groceries"}]. Categories: Groceries,Vegetables,Dairy,Baby,Household,Medical,Snacks,Other`}]}]})});
      const data=await resp.json();
      const items=JSON.parse((data.content?.[0]?.text||"[]").replace(/```json|```/g,"").trim());
      setScanned(items.map((it,i)=>({...it,id:i,selected:true})));
      showToast(`Found ${items.length} items!`);
    }catch{showToast("Could not read receipt.");}
    setScanning(false);
  };

  const addScanned=()=>{
    const entries=scanned.filter(i=>i.selected&&i.name&&i.amount).map(i=>({id:Date.now()+Math.random(),desc:i.name,amt:parseFloat(i.amount),type:"Expense",cat:i.category||"Other",source:"Receipt Scan",by:user,date:new Date().toISOString().slice(0,10)}));
    setBudget([...budget,...entries]); setScanned([]); showToast(`${entries.length} items added!`);
  };

  const mthExp=budget.filter(b=>b.date?.startsWith(selMonth)&&b.type==="Expense");
  const catBreak=CATS.reduce((a,c)=>{const v=mthExp.filter(b=>b.cat===c).reduce((s,b)=>s+b.amt,0);if(v>0)a[c]=v;return a;},{});
  const maxCat=Math.max(...Object.values(catBreak),1);

  return (
    <div style={S.page}>

function MaidMgmt({maids,setMaids,showToast}) {
  const [selMaid,setSelMaid]=useState(null);
  const [showForm,setShowForm]=useState(false);
  const [editId,setEditId]=useState(null);
  const [form,setForm]=useState({name:"",phone:"",type:"cleaner",salary:"",joiningDate:"",workDays:"Mon-Sat",notes:"",changeReason:""});
  const today=new Date().toISOString().slice(0,10);
  const thisMonth=new Date().toISOString().slice(0,7);
  const rf=()=>setForm({name:"",phone:"",type:"cleaner",salary:"",joiningDate:"",workDays:"Mon-Sat",notes:"",changeReason:""});

  const saveMaid=()=>{
    if(!form.name.trim()){showToast("Name required!");return;}
    if(editId){
      const ex=maids.find(m=>m.id===editId);
      const salChg=ex&&parseFloat(ex.salary)!==parseFloat(form.salary);
      const rc=salChg?{id:Date.now(),date:today,oldSalary:ex.salary,newSalary:form.salary,reason:form.changeReason||"Updated"}:null;
      const rh=rc?[...(ex.rateHistory||[]),rc]:(ex?.rateHistory||[]);
      setMaids(maids.map(m=>m.id===editId?{...m,...form,rateHistory:rh}:m));
      showToast(salChg?`Salary updated: ₹${ex.salary}→₹${form.salary}`:"Updated! ✅");
    } else {
      setMaids([...maids,{id:Date.now(),...form,active:true,attendance:{},leaves:[],advances:[],salaryHistory:[],rateHistory:[{id:Date.now(),date:today,oldSalary:"",newSalary:form.salary,reason:"Joining"}]}]);
      showToast(`${form.name} added! 🧽`);
    }
    setShowForm(false);rf();setEditId(null);
  };

  const delMaid=(id,name)=>{if(!confirm(`Delete ${name}? All records will be lost.`))return;setMaids(maids.filter(m=>m.id!==id));if(selMaid===id)setSelMaid(null);};
  const updMaid=(id,upd)=>setMaids(maids.map(m=>m.id===id?{...m,...upd}:m));

  const getStats=(maid)=>{
    const att=maid.attendance||{};
    const md=Object.keys(att).filter(d=>d.startsWith(thisMonth));
    return {
      present:md.filter(d=>att[d]?.status==="present").length,
      absent:md.filter(d=>att[d]?.status==="absent").length,
      half:md.filter(d=>att[d]?.status==="half").length,
      totalHours:md.reduce((s,d)=>s+(parseFloat(att[d]?.hours)||0),0),
      totalMeals:md.reduce((s,d)=>s+(parseInt(att[d]?.meals)||0),0),
    };
  };

  const calcSal=(maid)=>{
    const st=getStats(maid); const base=parseFloat(maid.salary)||0; const pd=base/26;
    const earned=Math.round(st.present*pd+st.half*pd*0.5);
    const adv=(maid.advances||[]).filter(a=>a.month===thisMonth).reduce((s,a)=>s+parseFloat(a.amount||0),0);
    return {earned,advance:adv,net:earned-adv};
  };

  const markAtt=(maidId,date,field,value)=>{
    const m=maids.find(x=>x.id===maidId);
    const ex=(m.attendance||{})[date]||{};
    updMaid(maidId,{attendance:{...(m.attendance||{}),[date]:{...ex,[field]:value}}});
  };

  if(selMaid){
    const m=maids.find(x=>x.id===selMaid);
    if(!m){setSelMaid(null);return null;}
    return <MaidDetail maid={m} onBack={()=>setSelMaid(null)}
      onEdit={()=>{setForm({name:m.name,phone:m.phone||"",type:m.type||"cleaner",salary:m.salary,joiningDate:m.joiningDate||"",workDays:m.workDays||"Mon-Sat",notes:m.notes||"",changeReason:""});setEditId(m.id);setShowForm(true);setSelMaid(null);}}
      onDelete={()=>delMaid(m.id,m.name)} updMaid={updMaid} showToast={showToast}

function MaidDetail({maid,onBack,onEdit,onDelete,updMaid,showToast,today,thisMonth,getStats,calcSal,markAtt}) {

            {Array.from({length:fd},(_,i)=><div key={"e"+i}/>)}

        <div>
          <div style={{...S.card,marginBottom:10,background:"#fff8e1",border:"1.5px solid #c8962a"}}>
            <div style={{fontWeight:700,color:"#c8962a",fontSize:13}}>📈 Current Rate</div>
            <div style={{fontSize:20,fontWeight:800,color:"#1a6b3c"}}>₹{maid.salary}/month</div>
            <div style={{fontSize:12,color:"#666"}}>{mt.label} • {maid.workDays}</div>
          </div>
          {[...(maid.rateHistory||[])].reverse().map((r,i)=>(
            <div key={r.id} style={{...S.card,marginBottom:7,borderLeft:`4px solid ${i===0?"#c8962a":"#e0e0e0"}`}}>
              <div style={{fontWeight:700,color:i===0?"#c8962a":"#2d2d2d",fontSize:13}}>{r.reason||"Updated"} {i===0?"(Latest)":""}</div>
              <div style={{fontSize:12,color:"#666"}}>📅 {r.date}</div>
              {r.oldSalary&&r.newSalary&&r.oldSalary!==r.newSalary&&<div style={{fontSize:13,marginTop:3}}>💰 <span style={{textDecoration:"line-through",color:"#c0392b"}}>₹{r.oldSalary}</span> → <b style={{color:"#1a6b3c"}}>₹{r.newSalary}</b></div>}
              {!r.oldSalary&&<div style={{fontSize:13,color:"#1a6b3c",marginTop:3}}>🎉 Starting: ₹{r.newSalary}</div>}
            </div>
          ))}
          {!(maid.rateHistory||[]).length&&<p style={{color:"#aaa",fontSize:13,textAlign:"center",padding:14}}>No rate changes.</p>}
        </div>
      )}
    </div>
  );
}

function HomeServices({gas,setGas,showToast}) {
  const [tab,setTab]=useState("gas");
  return (
    <div style={S.page}>
      <h2 style={S.title}>🔧 Home Services</h2>
      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {[{id:"gas",l:"🔥 Gas Cylinder"},{id:"cleaning",l:"🧹 Deep Cleaning"}].map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{...S.tab,flex:1,...(tab===t.id?S.tabA:{})}}>{t.l}</button>
        ))}
      </div>
      {tab==="gas"&&<GasSection gas={gas} setGas={setGas} showToast={showToast}/>}
      {tab==="cleaning"&&<CleaningSection gas={gas} setGas={setGas} showToast={showToast}/>}
    </div>
  );
}

function GasSection({gas,setGas,showToast}) {
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState({bookingDate:"",receivedDate:"",installmentDate:"",changedDate:"",amount:"",company:"HP",notes:""});
  const today=new Date().toISOString().slice(0,10);
  const curr=gas?.currentCylinder;
  const daysSince=curr?.changedDate?Math.floor((new Date()-new Date(curr.changedDate))/(1000*60*60*24)):null;
  const daysLeft=daysSince!==null?Math.max(0,45-daysSince):null;

  const addRec=()=>{
    if(!form.bookingDate){showToast("Booking date required!");return;}
    const r={id:Date.now(),...form,addedAt:today};
    setGas({...gas,records:[...(gas?.records||[]),r],currentCylinder:r});
    setForm({bookingDate:"",receivedDate:"",installmentDate:"",changedDate:"",amount:"",company:"HP",notes:""});
    setShowForm(false); showToast("Gas record saved! 🔥");
  };

  const updCurr=(field,value)=>{
    if(!curr)return;
    const upd={...curr,[field]:value};
    setGas({...gas,currentCylinder:upd,records:(gas?.records||[]).map(r=>r.id===curr.id?upd:r)});
  };

  return (
    <div>
      {curr&&(
        <div style={{...S.card,marginBottom:10,background:daysLeft!==null&&daysLeft<7?"linear-gradient(135deg,#c0392b,#962d22)":"linear-gradient(135deg,#e07b54,#c4573b)",color:"#fff",borderRadius:14}}>
          <div style={{fontSize:12,opacity:0.8}}>🔥 Current — {curr.company}</div>
          {daysLeft!==null&&<div style={{fontSize:26,fontWeight:800}}>{daysLeft} days left{daysLeft<7?" ⚠️":""}</div>}
          <div style={{display:"flex",gap:14,flexWrap:"wrap",marginTop:7}}>
            {curr.bookingDate&&<div><div style={{fontSize:9,opacity:0.7}}>📋 Booked</div><div style={{fontWeight:700,fontSize:12}}>{curr.bookingDate}</div></div>}
            {curr.receivedDate&&<div><div style={{fontSize:9,opacity:0.7}}>📦 Received</div><div style={{fontWeight:700,fontSize:12}}>{curr.receivedDate}</div></div>}
            {curr.installmentDate&&<div><div style={{fontSize:9,opacity:0.7}}>💳 Installment</div><div style={{fontWeight:700,fontSize:12}}>{curr.installmentDate}</div></div>}
            {curr.changedDate&&<div><div style={{fontSize:9,opacity:0.7}}>🔄 Changed</div><div style={{fontWeight:700,fontSize:12}}>{curr.changedDate}</div></div>}
            {curr.amount&&<div><div style={{fontSize:9,opacity:0.7}}>💰 Paid</div><div style={{fontWeight:700,fontSize:12}}>₹{curr.amount}</div></div>}
          </div>
          {daysLeft!==null&&daysLeft<7&&<div style={{background:"#fff3",borderRadius:7,padding:"4px 10px",marginTop:7,fontSize:11,fontWeight:700}}>⚠️ Book next cylinder soon!</div>}
        </div>
      )}
      {curr&&!showForm&&(
        <div style={{...S.card,marginBottom:8,border:"1.5px solid #e07b54"}}>
          <div style={{fontWeight:700,marginBottom:7,color:"#e07b54",fontSize:13}}>📝 Update Current</div>
          {[{l:"📦 Received",f:"receivedDate",t:"date"},{l:"💳 Installment",f:"installmentDate",t:"date"},{l:"🔄 Changed",f:"changedDate",t:"date"},{l:"💰 Amount ₹",f:"amount",t:"number"}].map(x=>(
            <div key={x.f} style={{display:"flex",alignItems:"center",gap:8,marginBottom:5}}>
              <label style={{fontSize:11,color:"#888",width:110,flexShrink:0}}>{x.l}</label>
              <input type={x.t} style={{...S.sel,flex:1}} value={curr[x.f]||""} onChange={e=>updCurr(x.f,e.target.value)}/>
            </div>
          ))}
        </div>
      )}
      <button style={{...S.btn,width:"100%",marginBottom:8}} onClick={()=>setShowForm(!showForm)}>{showForm?"Cancel":"🔥 + Book New Cylinder"}</button>
      {showForm&&(
        <div style={{...S.card,marginBottom:8,border:"2px solid #e07b54"}}>
          <div style={{fontWeight:700,marginBottom:8,color:"#e07b54"}}>New Booking</div>
          <select style={{...S.sel,width:"100%",marginBottom:7}} value={form.company} onChange={e=>setForm({...form,company:e.target.value})}><option>HP</option><option>Bharat Gas</option><option>Indane</option></select>
          {[{l:"📋 Booking Date *",f:"bookingDate",t:"date"},{l:"📦 Received Date",f:"receivedDate",t:"date"},{l:"💳 Installment Date",f:"installmentDate",t:"date"},{l:"🔄 Changed Date",f:"changedDate",t:"date"},{l:"💰 Amount ₹",f:"amount",t:"number"}].map(x=>(
            <div key={x.f} style={{marginBottom:7}}><label style={{fontSize:12,color:"#888"}}>{x.l}</label><input type={x.t} style={{...S.sel,width:"100%",marginTop:3,boxSizing:"border-box"}} value={form[x.f]} onChange={e=>setForm({...form,[x.f]:e.target.value})}/></div>
          ))}
          <input style={S.input} placeholder="Notes..." value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})}/>
          <button style={{...S.btn,width:"100%",marginTop:8}} onClick={addRec}>Save Record</button>
        </div>
      )}
      {(gas?.records||[]).length>0&&<>
        <div style={{fontWeight:700,fontSize:11,color:"#888",marginBottom:6}}>HISTORY</div>
        {[...(gas?.records||[])].reverse().map((r,i)=>(
          <div key={r.id} style={{...S.card,marginBottom:5,borderLeft:`4px solid ${i===0?"#e07b54":"#e0e0e0"}`,opacity:i===0?1:0.7}}>
            <div style={{fontWeight:700,fontSize:13}}>🔥 {r.company} {i===0?"(Current)":""}</div>
            <div style={{fontSize:12,color:"#666"}}>{r.bookingDate&&"📋 "+r.bookingDate}{r.receivedDate&&" • 📦 "+r.receivedDate}{r.changedDate&&" • 🔄 "+r.changedDate}</div>
            {r.amount&&<div style={{fontSize:12,color:"#1a6b3c",fontWeight:700}}>₹{r.amount}</div>}
          </div>
        ))}
      </>}
    </div>
  );
}

function CleaningSection({gas,setGas,showToast}) {
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState({date:"",type:"Full House",provider:"",amount:"",duration:"",areas:"",notes:"",nextDate:""});
  const TYPES=["Full House","Kitchen Deep Clean","Bathroom","Sofa/Upholstery","Carpet/Mattress","AC Service","Pest Control","Water Tank","Other"];
  const add=()=>{if(!form.date){showToast("Date required!");return;}setGas({...gas,cleaning:[...(gas?.cleaning||[]),{id:Date.now(),...form}]});setForm({date:"",type:"Full House",provider:"",amount:"",duration:"",areas:"",notes:"",nextDate:""});setShowForm(false);showToast("Saved! 🧹");};
  const del=id=>setGas({...gas,cleaning:(gas?.cleaning||[]).filter(c=>c.id!==id)});
  const recs=[...(gas?.cleaning||[])].reverse();
  const upcoming=(gas?.cleaning||[]).filter(c=>c.nextDate&&c.nextDate>=new Date().toISOString().slice(0,10));
  return (
    <div>
      {upcoming.length>0&&<div style={{...S.card,marginBottom:8,background:"#e8f5e9",border:"1.5px solid #1a6b3c"}}>
        <div style={{fontWeight:700,color:"#1a6b3c",marginBottom:3,fontSize:13}}>🔔 Upcoming</div>
        {upcoming.map(c=><div key={c.id} style={{fontSize:13,color:"#555"}}>🧹 {c.type} on {c.nextDate}</div>)}
      </div>}
      <button style={{...S.btn,width:"100%",marginBottom:8}} onClick={()=>setShowForm(!showForm)}>{showForm?"Cancel":"🧹 + Add Cleaning Service"}</button>
      {showForm&&(
        <div style={{...S.card,marginBottom:8,border:"2px solid #1a6b3c"}}>
          <div style={{fontWeight:700,marginBottom:8,color:"#1a6b3c"}}>New Cleaning</div>
          <select style={{...S.sel,width:"100%",marginBottom:7}} value={form.type} onChange={e=>setForm({...form,type:e.target.value})}>{TYPES.map(t=><option key={t}>{t}</option>)}</select>
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            <div style={{display:"flex",gap:7}}>
              <div style={{flex:1}}><label style={{fontSize:11,color:"#888"}}>Date *</label><input type="date" style={{...S.sel,width:"100%",marginTop:3,boxSizing:"border-box"}} value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></div>
              <div style={{flex:1}}><label style={{fontSize:11,color:"#888"}}>Amount ₹</label><input type="number" style={{...S.input,marginTop:3}} placeholder="₹" value={form.amount} onChange={e=>setForm({...form,amount:e.target.value})}/></div>
            </div>
            <input style={S.input} placeholder="Provider/Company..." value={form.provider} onChange={e=>setForm({...form,provider:e.target.value})}/>
            <input style={S.input} placeholder="Duration (e.g. 3 hours)" value={form.duration} onChange={e=>setForm({...form,duration:e.target.value})}/>
            <input style={S.input} placeholder="Areas covered..." value={form.areas} onChange={e=>setForm({...form,areas:e.target.value})}/>
            <div><label style={{fontSize:11,color:"#888"}}>Next Cleaning Date</label><input type="date" style={{...S.sel,width:"100%",marginTop:3,boxSizing:"border-box"}} value={form.nextDate} onChange={e=>setForm({...form,nextDate:e.target.value})}/></div>
            <input style={S.input} placeholder="Notes..." value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})}/>
          </div>
          <button style={{...S.btn,width:"100%",marginTop:8}} onClick={add}>Save</button>
        </div>
      )}
      {recs.length===0&&!showForm&&<p style={{color:"#aaa",fontSize:13,textAlign:"center",padding:18}}>No cleaning records yet.</p>}
      {recs.map(r=>(
        <div key={r.id} style={{...S.card,marginBottom:7,borderLeft:"4px solid #1a6b3c"}}>
          <div style={{display:"flex",justifyContent:"space-between"}}>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:13}}>🧹 {r.type}</div>
              <div style={{fontSize:12,color:"#666"}}>📅{r.date}{r.provider?" • "+r.provider:""}{r.amount?" • ₹"+r.amount:""}</div>
              {r.duration&&<div style={{fontSize:11,color:"#555"}}>⏱️ {r.duration}</div>}
              {r.areas&&<div style={{fontSize:11,color:"#555"}}>📍 {r.areas}</div>}
              {r.nextDate&&<div style={{fontSize:12,color:"#c8962a",fontWeight:600}}>🔔 Next: {r.nextDate}</div>}
            </div>
            <button onClick={()=>del(r.id)} style={S.del}>✕</button>
          </div>
        </div>
      ))}
    </div>
  );
}
    function renderApp() {
      ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(FamilyHub));
    }
    if(window._fbReady){renderApp();}
    else{window.addEventListener("firebase-ready",renderApp);}
  </script>
</body>
</html>
