};

const DAY_COLORS = {
  Sunday:"#c0392b", Monday:"#1a6b3c", Tuesday:"#5b8dd9",
  Wednesday:"#9c6dd8", Thursday:"#c8962a", Friday:"#e07b54", Saturday:"#16a085"
};

function WeeklySchedule({ user, showToast }) {
  const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const todayName = new Date().toLocaleDateString("en-US",{weekday:"long"});
  const [activeDay, setActiveDay] = useState(todayName);
  const [done, setDone] = useState({});
  const [extraTasks, setExtraTasks] = useState({});
  const [newTask, setNewTask] = useState("");
  const [newAssign, setNewAssign] = useState("Both");

  // Load/save done state
  useEffect(() => {
    const key = "weekly_done_" + new Date().toISOString().slice(0,10).slice(0,7); // monthly reset
    load("fh_" + key).then(d => { if(d) setDone(d); });
    load("fh_weekly_extra").then(d => { if(d) setExtraTasks(d); });
  }, []);

  const toggleDone = (key) => {
    const updated = {...done, [key]: !done[key]};
    setDone(updated);
    save("fh_weekly_done_" + new Date().toISOString().slice(0,7), updated);
  };

  const addExtra = () => {
    if (!newTask.trim()) return;
    const task = { id: Date.now(), task: newTask.trim(), assignTo: newAssign };
    const updated = {...extraTasks, [activeDay]: [...(extraTasks[activeDay]||[]), task]};
    setExtraTasks(updated);
    save("fh_weekly_extra", updated);
    setNewTask("");
    showToast("Task added! ✅");
  };

  const delExtra = (day, id) => {
    const updated = {...extraTasks, [day]: (extraTasks[day]||[]).filter(t=>t.id!==id)};
    setExtraTasks(updated);
    save("fh_weekly_extra", updated);
  };

  const dayData = WEEKLY_SCHEDULE[activeDay];
  const allTasks = [
    ...(dayData.laundry ? [{id:"laundry", task:"👕 Wash: " + dayData.laundry, assignTo:"Both", type:"laundry"}] : []),
    ...(dayData.bedsheet ? [{id:"bedsheet", task:dayData.bedsheet, assignTo:"Both", type:"bedsheet"}] : []),
    ...dayData.fixed,
    ...(extraTasks[activeDay]||[]),
  ];
  const doneCount = allTasks.filter(t=>done[activeDay+"_"+t.id]).length;

  return (
    <div style={S.page}>
      <h2 style={S.pageTitle}>🗓️ Weekly Schedule</h2>

      {/* Day tabs - scrollable */}
      <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:8,marginBottom:16,scrollbarWidth:"none"}}>
        {DAYS.map(d=>{
          const dc = WEEKLY_SCHEDULE[d];
          const dayTasks = [
            ...(dc.laundry?[1]:[]), ...(dc.bedsheet?[1]:[]),
            ...dc.fixed, ...(extraTasks[d]||[])
          ];
          const dayDone = dayTasks.filter((_,i)=>{
            const id = i===0&&dc.laundry?"laundry":i===0&&dc.bedsheet?"bedsheet":
              i<(dc.laundry?1:0)+(dc.bedsheet?1:0)?dc.laundry?"bedsheet":"":
              dc.fixed[i-(dc.laundry?1:0)-(dc.bedsheet?1:0)]?.id||(extraTasks[d]||[])[i-(dc.laundry?1:0)-(dc.bedsheet?1:0)-dc.fixed.length]?.id;
            return done[d+"_"+id];
          }).length;
          const isToday = d===todayName;
          return (
            <button key={d} onClick={()=>setActiveDay(d)} style={{
              flexShrink:0, padding:"6px 14px", borderRadius:20, border:"none",
              fontFamily:"Poppins,sans-serif", fontSize:12, cursor:"pointer",
              fontWeight: activeDay===d ? 800 : 500,
              background: activeDay===d ? DAY_COLORS[d] : isToday ? DAY_COLORS[d]+"22" : "#f0f0f0",
              color: activeDay===d ? "#fff" : isToday ? DAY_COLORS[d] : "#555",
              outline: isToday ? `2px solid ${DAY_COLORS[d]}` : "none",
            }}>
              {d.slice(0,3)}{isToday?" 📍":""}
            </button>
          );
        })}
      </div>

      {/* Day header */}
      <div style={{...S.card, marginBottom:12, borderLeft:`4px solid ${DAY_COLORS[activeDay]}`,
        display:"flex", justifyContent:"space-between", alignItems:"center"}}>
        <div>
          <div style={{fontWeight:800, fontSize:16, color:DAY_COLORS[activeDay]}}>{activeDay}</div>
          <div style={{fontSize:12, color:"#888"}}>{doneCount}/{allTasks.length} tasks done</div>
        </div>
        <div style={{background:"#f0f0f0", borderRadius:20, padding:"4px 14px", fontSize:13, fontWeight:700, color:DAY_COLORS[activeDay]}}>
          {allTasks.length===0?"Free day! 🎉":`${Math.round((doneCount/allTasks.length)*100)||0}%`}
        </div>
      </div>

      {/* Progress bar */}
      {allTasks.length>0 && (
        <div style={{background:"#f0f0f0",borderRadius:8,height:8,marginBottom:16}}>
          <div style={{background:DAY_COLORS[activeDay],borderRadius:8,height:8,
            width:`${(doneCount/allTasks.length)*100}%`,transition:"width 0.4s"}}/>
        </div>
      )}

      {/* Tasks */}
      {allTasks.length===0 && (
        <div style={{...S.card, textAlign:"center", padding:32, color:"#aaa"}}>
          🎉 Free day! No scheduled tasks.
        </div>
      )}

      {allTasks.map(t=>{
        const doneKey = activeDay+"_"+t.id;
        const isDone = !!done[doneKey];
        const isExtra = !!(extraTasks[activeDay]||[]).find(x=>x.id===t.id);
        const typeIcon = t.type==="laundry"?"👕":t.type==="bedsheet"?"🛏️":"";
        return (
          <div key={t.id} style={{...S.card, marginBottom:8,
            opacity: isDone?0.6:1,
            borderLeft:`4px solid ${isDone?"#5cba8a":DAY_COLORS[activeDay]}`}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <input type="checkbox" checked={isDone} onChange={()=>toggleDone(doneKey)}
                style={{accentColor:DAY_COLORS[activeDay],width:20,height:20,flexShrink:0}}/>
              <div style={{flex:1}}>
                <div style={{fontWeight:600,fontSize:14,textDecoration:isDone?"line-through":"none",color:isDone?"#aaa":"#2d2d2d"}}>
                  {t.task}
                </div>
                <div style={{fontSize:11,color:"#aaa",marginTop:2}}>👤 {t.assignTo}</div>
              </div>
              {isDone && <span style={{...S.badge,background:"#e8f5e9",color:"#5cba8a",flexShrink:0}}>✅</span>}
              {isExtra && <button onClick={()=>delExtra(activeDay,t.id)} style={S.delBtn}>✕</button>}
            </div>
          </div>
        );
      })}

      {/* Add extra task for this day */}
      <div style={{...S.card, marginTop:12, border:"1.5px dashed #c5e0cc"}}>
        <div style={{fontWeight:700,marginBottom:8,fontSize:13,color:"#1a6b3c"}}>+ Add task for {activeDay}</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <input style={{...S.input,flex:2}} placeholder="Task..." value={newTask}
            onChange={e=>setNewTask(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addExtra()}/>
          <select style={S.select} value={newAssign} onChange={e=>setNewAssign(e.target.value)}>
            <option>Both</option><option>Minal</option><option>Piyush</option><option>Sahil</option>
          </select>
          <button style={S.btnPrimary} onClick={addExtra}>Add</button>
        </div>
      </div>

      {/* Full week overview */}
      <div style={{marginTop:20}}>
        <div style={{fontWeight:700,fontSize:13,color:"#888",marginBottom:10,textTransform:"uppercase",letterSpacing:1}}>
          Week at a Glance
        </div>
        {DAYS.map(d=>{
          const dc = WEEKLY_SCHEDULE[d];
          const isToday = d===todayName;
          return (
            <div key={d} onClick={()=>setActiveDay(d)}
              style={{...S.card,marginBottom:6,cursor:"pointer",padding:"10px 14px",
                borderLeft:`4px solid ${DAY_COLORS[d]}`,opacity:isToday?1:0.8}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{fontWeight:700,color:DAY_COLORS[d],fontSize:13}}>{d}{isToday?" 📍":""}</div>
              </div>
              <div style={{fontSize:12,color:"#555",marginTop:3}}>
                {[
                  dc.laundry&&`👕 ${dc.laundry}`,
                  dc.bedsheet&&dc.bedsheet,
                  ...dc.fixed.map(f=>f.task),
                  ...(extraTasks[d]||[]).map(t=>t.task)
                ].filter(Boolean).join(" • ")||"Free day 🎉"}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── MAID MANAGEMENT ──────────────────────────────────────────────────────────
function MaidManagement({ maids, setMaids, showToast }) {
  const [tab, setTab] = useState("list");
  const [selMaid, setSelMaid] = useState(null);
  const [showAddMaid, setShowAddMaid] = useState(false);
  const [maidForm, setMaidForm] = useState({ name:"", phone:"", role:"", salary:"", joiningDate:"", workDays:"Mon-Sat", notes:"" });
  const today = new Date().toISOString().slice(0,10);
  const thisMonth = new Date().toISOString().slice(0,7);

  // Add new maid
  const addMaid = () => {
    if (!maidForm.name.trim()) return;
    const newMaid = {
      id: Date.now(),
      ...maidForm,
      active: true,
      attendance: {},
      leaves: [],
      advances: [],
      salaryHistory: [],
    };
    setMaids([...maids, newMaid]);
    setMaidForm({ name:"", phone:"", role:"", salary:"", joiningDate:"", workDays:"Mon-Sat", notes:"" });
    setShowAddMaid(false);
    showToast(`${maidForm.name} added! 🧽`);
  };

  const updateMaid = (id, updates) => {
    setMaids(maids.map(m => m.id===id ? {...m,...updates} : m));
  };

  const toggleActive = (id) => {
    const m = maids.find(x=>x.id===id);
    updateMaid(id, { active: !m.active });
    showToast(m.active ? "Maid marked inactive" : "Maid marked active");
  };

  // Attendance
  const markAttendance = (maidId, date, status) => {
    const m = maids.find(x=>x.id===maidId);
    const updated = {...(m.attendance||{}), [date]: status};
    updateMaid(maidId, { attendance: updated });
    showToast(`Attendance marked: ${status}`);
  };

  // Get attendance stats for current month
  const getMonthStats = (maid) => {
    const att = maid.attendance || {};
    const monthDays = Object.keys(att).filter(d => d.startsWith(thisMonth));
    const present = monthDays.filter(d => att[d]==="present").length;
    const absent = monthDays.filter(d => att[d]==="absent").length;
    const halfDay = monthDays.filter(d => att[d]==="half").length;
    return { present, absent, halfDay, total: monthDays.length };
  };

  // Calculate salary
  const calcSalary = (maid) => {
    const stats = getMonthStats(maid);
    const baseSalary = parseFloat(maid.salary) || 0;
    const perDay = baseSalary / 26;
    const earned = (stats.present * perDay) + (stats.halfDay * perDay * 0.5);
    const totalAdvance = (maid.advances||[]).filter(a=>a.month===thisMonth).reduce((s,a)=>s+parseFloat(a.amount||0),0);
    return { earned: Math.round(earned), advance: totalAdvance, net: Math.round(earned - totalAdvance) };
  };

  if (selMaid) {
    const m = maids.find(x=>x.id===selMaid);
    if (!m) { setSelMaid(null); return null; }
    return <MaidDetail maid={m} onBack={()=>setSelMaid(null)} updateMaid={updateMaid} showToast={showToast} today={today} thisMonth={thisMonth} getMonthStats={getMonthStats} calcSalary={calcSalary} markAttendance={markAttendance} />;
  }

  return (
    <div style={S.page}>
      <h2 style={S.pageTitle}>🧽 Maid Management</h2>
      <p style={{color:"#888",fontSize:13,marginTop:-10,marginBottom:16}}>🔒 Only visible to Minal</p>

      {/* Summary cards */}
      <div style={{display:"flex",gap:10,marginBottom:16}}>
        <div style={{...S.card,flex:1,textAlign:"center",borderTop:"3px solid #1a6b3c"}}>
          <div style={{fontSize:20,fontWeight:800,color:"#1a6b3c"}}>{maids.filter(m=>m.active).length}</div>
          <div style={{fontSize:11,color:"#888"}}>Active</div>
        </div>
        <div style={{...S.card,flex:1,textAlign:"center",borderTop:"3px solid #c8962a"}}>
          <div style={{fontSize:20,fontWeight:800,color:"#c8962a"}}>
            ₹{maids.filter(m=>m.active).reduce((s,m)=>s+calcSalary(m).net,0).toLocaleString()}
          </div>
          <div style={{fontSize:11,color:"#888"}}>Net Payable</div>
        </div>
      </div>

      {/* Add maid button */}
      {!showAddMaid && (
        <button style={{...S.btnPrimary,width:"100%",marginBottom:16}} onClick={()=>setShowAddMaid(true)}>
          + Add New Maid
        </button>
      )}

      {/* Add maid form */}
      {showAddMaid && (
        <div style={{...S.card,marginBottom:16,border:"2px solid #c8962a"}}>
          <div style={{fontWeight:700,marginBottom:12,color:"#c8962a"}}>New Maid Details</div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {[
              {label:"Full Name *", key:"name", placeholder:"e.g. Sunita"},
              {label:"Phone", key:"phone", placeholder:"Mobile number"},
              {label:"Work (e.g. Cooking, Cleaning)", key:"role", placeholder:"What she does"},
              {label:"Monthly Salary (₹)", key:"salary", placeholder:"e.g. 3000", type:"number"},
              {label:"Work Days", key:"workDays", placeholder:"e.g. Mon-Sat"},
              {label:"Notes", key:"notes", placeholder:"Any other details"},
            ].map(f=>(
              <div key={f.key}>
                <label style={{fontSize:12,color:"#888",fontWeight:600}}>{f.label}</label>
                <input style={{...S.input,marginTop:4}} type={f.type||"text"}
                  placeholder={f.placeholder} value={maidForm[f.key]}
                  onChange={e=>setMaidForm({...maidForm,[f.key]:e.target.value})}/>
              </div>
            ))}
            <div>
              <label style={{fontSize:12,color:"#888",fontWeight:600}}>Joining Date</label>
              <input type="date" style={{...S.select,width:"100%",marginTop:4,boxSizing:"border-box"}}
                value={maidForm.joiningDate} onChange={e=>setMaidForm({...maidForm,joiningDate:e.target.value})}/>
            </div>
          </div>
          <div style={{display:"flex",gap:8,marginTop:12}}>
            <button style={S.btnPrimary} onClick={addMaid}>Add Maid</button>
            <button style={S.backBtn} onClick={()=>setShowAddMaid(false)}>Cancel</button>
          </div>
        </div>
      )}

      {/* Maid cards */}
      {maids.length===0 && !showAddMaid && (
        <div style={{textAlign:"center",color:"#aaa",padding:"32px 0"}}>No maids added yet.</div>

        const stats = getMonthStats(m);

          <div key={m.id} style={{...S.card,marginBottom:12,opacity:m.active?1:0.6,
            borderLeft:`4px solid ${m.active?"#1a6b3c":"#aaa"}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div style={{flex:1,cursor:"pointer"}} onClick={()=>setSelMaid(m.id)}>
                <div style={{fontWeight:800,fontSize:16}}>🧽 {m.name}</div>
                <div style={{fontSize:12,color:"#666",marginTop:2}}>{m.role} • {m.workDays} • ₹{m.salary}/month</div>
                {m.joiningDate && <div style={{fontSize:11,color:"#aaa"}}>Joined: {m.joiningDate}</div>}

                </span>

            <div style={{display:"flex",gap:8,marginTop:10,flexWrap:"wrap"}}>

                    fontSize:11, padding:"4px 10px", borderRadius:16, border:"1.5px solid",
                    cursor:"pointer", fontFamily:"Poppins,sans-serif", fontWeight:600,
                    background: todayAtt===a.s ? a.c : "#fff",
                    borderColor: a.c,
                    color: todayAtt===a.s ? "#fff" : a.c,
                  }}>{a.l}</button>
                ))}
              </div>
            </div>

            {/* View details */}
            <div style={{display:"flex",gap:8,marginTop:10}}>
              <button style={{...S.btnPrimary,fontSize:12,padding:"5px 14px"}} onClick={()=>setSelMaid(m.id)}>
                View Details →
              </button>
              <button style={{...S.backBtn,marginTop:0,fontSize:11}} onClick={()=>toggleActive(m.id)}>
                {m.active?"Deactivate":"Reactivate"}
              </button>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function MaidDetail({ maid, onBack, updateMaid, showToast, today, thisMonth, getMonthStats, calcSalary, markAttendance }) {
  const [tab, setTab] = useState("attendance");
  const [leaveForm, setLeaveForm] = useState({ from:"", to:"", reason:"", type:"Casual" });
  const [advForm, setAdvForm] = useState({ amount:"", date:"", reason:"" });
  const [salaryNote, setSalaryNote] = useState("");
  const [payMode, setPayMode] = useState("GPay");
  const [txnId, setTxnId] = useState("");
  const [payDate, setPayDate] = useState(today);

  const stats = getMonthStats(maid);
  const salary = calcSalary(maid);

  const addLeave = () => {
    if (!leaveForm.from) return;
    const updated = [...(maid.leaves||[]), { id:Date.now(), ...leaveForm, month:thisMonth }];
    updateMaid(maid.id, { leaves: updated });
    setLeaveForm({ from:"", to:"", reason:"", type:"Casual" });
    showToast("Leave recorded! 📅");
  };

  const addAdvance = () => {
    if (!advForm.amount) return;
    const updated = [...(maid.advances||[]), { id:Date.now(), ...advForm, month:thisMonth }];
    updateMaid(maid.id, { advances: updated });
    setAdvForm({ amount:"", date:"", reason:"" });
    showToast("Advance recorded! 💰");
  };

  const markSalaryPaid = () => {
    const entry = {
      id: Date.now(), month: thisMonth,
      gross: salary.earned, advance: salary.advance,
      net: salary.net, note: salaryNote,
      payMode, txnId, paidOn: payDate||today
    };
    const updated = [...(maid.salaryHistory||[]), entry];
    updateMaid(maid.id, { salaryHistory: updated });
    setSalaryNote(""); setTxnId(""); setPayDate(today);
    showToast("Salary marked as paid! ✅");
  };

  const alreadyPaid = (maid.salaryHistory||[]).find(s=>s.month===thisMonth);

  // Generate calendar for this month
  const generateCalendar = () => {
    const year = new Date().getFullYear();
    const month = new Date().getMonth();
    const days = new Date(year, month+1, 0).getDate();
    return Array.from({length:days}, (_,i) => {
      const d = new Date(year, month, i+1);
      const dateStr = d.toISOString().slice(0,10);
      const dayName = d.toLocaleDateString("en-US",{weekday:"short"});
      const isSunday = d.getDay()===0;
      return { dateStr, day:i+1, dayName, isSunday };
    });
  };

  const tabs = [
    {id:"attendance",l:"📅 Attendance"},
    {id:"leaves",l:"🏖️ Leaves"},
    {id:"advance",l:"💰 Advance"},
    {id:"salary",l:"💵 Salary"},
  ];

  return (
    <div style={S.page}>
      <button style={S.backBtn} onClick={onBack}>← Back</button>
      <h2 style={{...S.pageTitle,marginTop:10}}>🧽 {maid.name}</h2>
      <div style={{fontSize:13,color:"#666",marginTop:-10,marginBottom:16}}>
        {maid.role} • {maid.workDays} • ₹{maid.salary}/month
        {maid.phone && ` • 📞 ${maid.phone}`}
      </div>

      {/* Stats bar */}
      <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
        {[
          {l:"Present",v:stats.present,c:"#1a6b3c"},
          {l:"Absent",v:stats.absent,c:"#c0392b"},
          {l:"Half Day",v:stats.halfDay,c:"#c8962a"},
          {l:"Gross",v:`₹${salary.earned}`,c:"#5b8dd9"},
          {l:"Advance",v:`₹${salary.advance}`,c:"#9c6dd8"},
          {l:"Net Pay",v:`₹${salary.net}`,c:"#1a6b3c"},
        ].map(s=>(
          <div key={s.l} style={{...S.card,textAlign:"center",padding:"8px 12px",flex:1,minWidth:70}}>
            <div style={{fontSize:16,fontWeight:800,color:s.c}}>{s.v}</div>
            <div style={{fontSize:10,color:"#aaa"}}>{s.l}</div>
          </div>
        ))}
      </div>

      {/* Tabs */}
      <div style={{display:"flex",gap:6,marginBottom:16,overflowX:"auto"}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)}
            style={{...S.tabBtn,flexShrink:0,...(tab===t.id?S.tabBtnActive:{})}}>{t.l}</button>
        ))}
      </div>

      {/* Attendance calendar */}
      {tab==="attendance" && (
        <div>
          <div style={{fontWeight:700,marginBottom:12,color:"#1a6b3c"}}>
            {new Date().toLocaleDateString("en-US",{month:"long",year:"numeric"})} Attendance
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:16}}>
            {["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>(
              <div key={d} style={{textAlign:"center",fontSize:10,fontWeight:700,color:"#888",padding:"4px 0"}}>{d}</div>
            ))}
            {/* Offset for first day */}
            {Array.from({length:new Date(new Date().getFullYear(),new Date().getMonth(),1).getDay()},(_,i)=>(
              <div key={"e"+i}/>
            ))}
            {generateCalendar().map(({dateStr,day,dayName,isSunday})=>{
              const att = (maid.attendance||{})[dateStr];
              const isToday2 = dateStr===today;
              const isFuture = dateStr>today;
              const bg = att==="present"?"#1a6b3c":att==="absent"?"#c0392b":att==="half"?"#c8962a":isSunday?"#f0f0f0":"#fafafa";
              const color = att?"#fff":isSunday?"#aaa":"#2d2d2d";
              return (
                <div key={dateStr} onClick={()=>!isFuture&&!isSunday&&markAttendance(maid.id,dateStr,
                  att==="present"?"absent":att==="absent"?"half":att==="half"?undefined:"present")}
                  style={{
                    background:bg, color, borderRadius:8, padding:"6px 2px",
                    textAlign:"center", fontSize:12, fontWeight:700,
                    cursor:isFuture||isSunday?"default":"pointer",
                    border:isToday2?"2px solid #c8962a":"2px solid transparent",
                    minHeight:36, display:"flex", alignItems:"center", justifyContent:"center"
                  }}>
                  {day}
                </div>
              );
            })}
          </div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",fontSize:11}}>
            {[{c:"#1a6b3c",l:"Present"},{c:"#c0392b",l:"Absent"},{c:"#c8962a",l:"Half Day"},{c:"#f0f0f0",l:"Sunday"}].map(x=>(
              <div key={x.l} style={{display:"flex",alignItems:"center",gap:4}}>
                <div style={{width:12,height:12,borderRadius:3,background:x.c}}/>
                <span style={{color:"#666"}}>{x.l}</span>
              </div>
            ))}
          </div>
          <div style={{fontSize:12,color:"#aaa",marginTop:8}}>Tap date to cycle: Present → Absent → Half Day → Clear</div>
        </div>
      )}

      {/* Leaves */}
      {tab==="leaves" && (
        <div>
          <div style={{...S.card,marginBottom:12,border:"1.5px solid #c5e0cc"}}>
            <div style={{fontWeight:700,marginBottom:10,color:"#1a6b3c"}}>Record Leave</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <div style={{flex:1}}>
                <label style={{fontSize:11,color:"#888"}}>From</label>
                <input type="date" style={{...S.select,width:"100%",marginTop:2,boxSizing:"border-box"}}
                  value={leaveForm.from} onChange={e=>setLeaveForm({...leaveForm,from:e.target.value})}/>
              </div>
              <div style={{flex:1}}>
                <label style={{fontSize:11,color:"#888"}}>To</label>
                <input type="date" style={{...S.select,width:"100%",marginTop:2,boxSizing:"border-box"}}
                  value={leaveForm.to} onChange={e=>setLeaveForm({...leaveForm,to:e.target.value})}/>
              </div>
              <select style={S.select} value={leaveForm.type} onChange={e=>setLeaveForm({...leaveForm,type:e.target.value})}>
                <option>Casual</option><option>Sick</option><option>Personal</option><option>Unpaid</option>
              </select>
              <input style={{...S.input,flex:2}} placeholder="Reason..." value={leaveForm.reason}
                onChange={e=>setLeaveForm({...leaveForm,reason:e.target.value})}/>
              <button style={S.btnPrimary} onClick={addLeave}>Add</button>
            </div>
          </div>
          {(maid.leaves||[]).length===0 && <p style={{color:"#aaa",fontSize:14,textAlign:"center",padding:20}}>No leaves recorded.</p>}
          {[...(maid.leaves||[])].reverse().map(l=>(
            <div key={l.id} style={{...S.card,marginBottom:6,borderLeft:"4px solid #5b8dd9"}}>
              <div style={{fontWeight:700}}>{l.from}{l.to&&l.to!==l.from?` → ${l.to}`:""}</div>
              <div style={{fontSize:12,color:"#666"}}>{l.type}{l.reason?` • ${l.reason}`:""}</div>
            </div>
          ))}
        </div>
      )}

      {/* Advance */}
      {tab==="advance" && (
        <div>
          <div style={{...S.card,marginBottom:12,border:"1.5px solid #c5e0cc"}}>
            <div style={{fontWeight:700,marginBottom:10,color:"#9c6dd8"}}>Give Advance / Loan</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <input type="number" style={{...S.input,flex:1}} placeholder="Amount (₹)"
                value={advForm.amount} onChange={e=>setAdvForm({...advForm,amount:e.target.value})}/>
              <input type="date" style={S.select} value={advForm.date}
                onChange={e=>setAdvForm({...advForm,date:e.target.value})}/>
              <input style={{...S.input,flex:2}} placeholder="Reason..."
                value={advForm.reason} onChange={e=>setAdvForm({...advForm,reason:e.target.value})}/>
              <button style={S.btnPrimary} onClick={addAdvance}>Add</button>
            </div>
          </div>
          <div style={{...S.card,marginBottom:12,background:"#f8f0ff",borderLeft:"4px solid #9c6dd8"}}>
            <div style={{fontSize:12,color:"#888"}}>This month total advance</div>
            <div style={{fontSize:22,fontWeight:800,color:"#9c6dd8"}}>₹{salary.advance}</div>
          </div>
          {(maid.advances||[]).length===0 && <p style={{color:"#aaa",fontSize:14,textAlign:"center",padding:20}}>No advances given.</p>}
          {[...(maid.advances||[])].reverse().map(a=>(
            <div key={a.id} style={{...S.card,marginBottom:6,borderLeft:"4px solid #9c6dd8"}}>
              <div style={{fontWeight:700,color:"#9c6dd8"}}>₹{a.amount}</div>
              <div style={{fontSize:12,color:"#666"}}>{a.date}{a.reason?` • ${a.reason}`:""} • {a.month}</div>
            </div>
          ))}
        </div>
      )}

      {/* Salary */}
      {tab==="salary" && (
        <div>
          <div style={{...S.card,marginBottom:12,border:"2px solid #1a6b3c"}}>
            <div style={{fontWeight:700,marginBottom:8,color:"#1a6b3c"}}>
              {new Date().toLocaleDateString("en-US",{month:"long",year:"numeric"})} Salary
            </div>
            {[
              {l:"Base Salary",v:`₹${maid.salary}`},
              {l:"Days Present",v:stats.present},
              {l:"Half Days",v:stats.halfDay},
              {l:"Gross Earned",v:`₹${salary.earned}`},
              {l:"Advance Deduction",v:`-₹${salary.advance}`},
              {l:"Net Payable",v:`₹${salary.net}`,bold:true,color:"#1a6b3c"},
            ].map(r=>(
              <div key={r.l} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #f0f0f0"}}>
                <span style={{fontSize:13,color:"#666"}}>{r.l}</span>
                <span style={{fontSize:14,fontWeight:r.bold?800:600,color:r.color||"#2d2d2d"}}>{r.v}</span>
              </div>
            ))}
            {!alreadyPaid ? (
              <div style={{marginTop:12,display:"flex",flexDirection:"column",gap:8}}>
                {/* Payment Mode */}
                <div>
                  <label style={{fontSize:12,color:"#888",fontWeight:600}}>Payment Mode</label>
                  <div style={{display:"flex",gap:8,marginTop:6,flexWrap:"wrap"}}>
                    {["GPay","PhonePe","Paytm","Cash","NEFT","Other"].map(m=>(
                      <button key={m} onClick={()=>setPayMode(m)} style={{
                        fontSize:12,padding:"5px 14px",borderRadius:20,border:"1.5px solid",
                        cursor:"pointer",fontFamily:"Poppins,sans-serif",fontWeight:600,
                        background:payMode===m?"#1a6b3c":"#fff",
                        borderColor:"#1a6b3c",
                        color:payMode===m?"#fff":"#1a6b3c",
                      }}>{m==="GPay"?"📱 GPay":m==="PhonePe"?"📱 PhonePe":m==="Paytm"?"📱 Paytm":m==="Cash"?"💵 Cash":m==="NEFT"?"🏦 NEFT":"Other"}</button>
                    ))}
                  </div>
                </div>
                {/* Payment Date */}
                <div>
                  <label style={{fontSize:12,color:"#888",fontWeight:600}}>Payment Date</label>
                  <input type="date" style={{...S.select,width:"100%",marginTop:4,boxSizing:"border-box"}}
                    value={payDate} onChange={e=>setPayDate(e.target.value)}/>
                </div>
                {/* Transaction ID */}
                {payMode!=="Cash" && (
                  <div>
                    <label style={{fontSize:12,color:"#888",fontWeight:600}}>Transaction ID / UPI Ref</label>

                      value={txnId} onChange={e=>setTxnId(e.target.value)}/>

                )}

                <input style={S.input} placeholder="Note (optional)..."
                  value={salaryNote} onChange={e=>setSalaryNote(e.target.value)}/>

                  ✅ Mark Salary Paid — ₹{salary.net}
                </button>
              </div>
            ) : (
              <div style={{background:"#e8f5e9",borderRadius:8,padding:"10px 12px",marginTop:12}}>
                <div style={{fontWeight:700,color:"#1a6b3c",fontSize:14}}>✅ Salary Paid!</div>
                <div style={{fontSize:12,color:"#555",marginTop:4}}>
                  📅 {alreadyPaid.paidOn} • {alreadyPaid.payMode==="Cash"?"💵":"📱"} {alreadyPaid.payMode}
                  {alreadyPaid.txnId&&<span> • 🔑 Txn: {alreadyPaid.txnId}</span>}
                </div>
              </div>
            )}
          </div>

          {/* Salary history */}
          <div style={{fontWeight:700,marginBottom:8,color:"#888",fontSize:13}}>Payment History</div>
          {(maid.salaryHistory||[]).length===0 && <p style={{color:"#aaa",fontSize:14}}>No payments recorded yet.</p>}
          {[...(maid.salaryHistory||[])].reverse().map(s=>(
            <div key={s.id} style={{...S.card,marginBottom:6,borderLeft:"4px solid #5cba8a"}}>
              <div style={{display:"flex",justifyContent:"space-between"}}>
                <div>
                  <div style={{fontWeight:700}}>{s.month}</div>
                  <div style={{fontSize:12,color:"#666"}}>Gross: ₹{s.gross} • Advance: ₹{s.advance} • Net: ₹{s.net}</div>
                  <div style={{fontSize:12,color:"#555"}}>
                    📅 {s.paidOn} • {s.payMode==="Cash"?"💵":"📱"} {s.payMode||"Cash"}
                    {s.txnId&&<span> • 🔑 {s.txnId}</span>}
                  </div>
                  {s.note&&<div style={{fontSize:11,color:"#aaa"}}>{s.note}</div>}
                </div>
                <div style={{fontSize:12,color:"#5cba8a",fontWeight:700}}>✅ Paid</div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── GAS CYLINDER ─────────────────────────────────────────────────────────────
function GasCylinder({ gas, setGas, showToast }) {
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({
    bookingDate:"", receivedDate:"", installmentDate:"",
    changedDate:"", amount:"", company:"HP", notes:""
  });
  const [tab, setTab] = useState("current");

  const companies = ["HP","Bharat Gas","Indane"];
  const today = new Date().toISOString().slice(0,10);

  const addRecord = () => {
    if (!form.bookingDate) { showToast("Booking date required!"); return; }
    const record = { id:Date.now(), ...form, addedAt:today };
    const updated = {
      records: [...(gas?.records||[]), record],
      currentCylinder: record
    };
    setGas(updated);
    setForm({ bookingDate:"", receivedDate:"", installmentDate:"", changedDate:"", amount:"", company:"HP", notes:"" });
    setShowForm(false);
    showToast("Gas cylinder record saved! 🔥");
  };

  const updateCurrent = (field, value) => {
    const curr = gas?.currentCylinder;
    if (!curr) return;
    const updated = { ...curr, [field]: value };
    setGas({
      ...gas,
      currentCylinder: updated,
      records: (gas?.records||[]).map(r => r.id===curr.id ? updated : r)
    });
    showToast("Updated! ✅");
  };

  const records = [...(gas?.records||[])].reverse();
  const curr = gas?.currentCylinder;

  // Days since last change
  const daysSinceChange = curr?.changedDate ? Math.floor((new Date()-new Date(curr.changedDate))/(1000*60*60*24)) : null;
  const daysSinceReceived = curr?.receivedDate ? Math.floor((new Date()-new Date(curr.receivedDate))/(1000*60*60*24)) : null;

  // Next booking reminder (avg cylinder lasts ~45 days)
  const avgDays = 45;
  const daysLeft = daysSinceChange ? Math.max(0, avgDays - daysSinceChange) : null;

  return (
    <div style={S.page}>
      <h2 style={S.pageTitle}>🔥 Gas Cylinder</h2>

      {/* Current cylinder status */}
      {curr && (
        <div style={{...S.card, marginBottom:12,
          background: daysLeft!==null&&daysLeft<7 ? "linear-gradient(135deg,#c0392b,#962d22)" : "linear-gradient(135deg,#e07b54,#c4573b)",
          color:"#fff", borderRadius:16}}>
          <div style={{fontSize:13,opacity:0.8,marginBottom:4}}>🔥 Current Cylinder — {curr.company}</div>
          {daysLeft!==null && (
            <div style={{fontSize:28,fontWeight:800,marginBottom:8}}>
              {daysLeft} days left
              {daysLeft<7 && " ⚠️"}
            </div>
          )}
          <div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
            {curr.bookingDate && <div><div style={{fontSize:10,opacity:0.7}}>📋 Booked</div><div style={{fontWeight:700}}>{curr.bookingDate}</div></div>}
            {curr.receivedDate && <div><div style={{fontSize:10,opacity:0.7}}>📦 Received</div><div style={{fontWeight:700}}>{curr.receivedDate}</div></div>}
            {curr.installmentDate && <div><div style={{fontSize:10,opacity:0.7}}>💳 Installment</div><div style={{fontWeight:700}}>{curr.installmentDate}</div></div>}
            {curr.changedDate && <div><div style={{fontSize:10,opacity:0.7}}>🔄 Changed</div><div style={{fontWeight:700}}>{curr.changedDate}</div></div>}
            {curr.amount && <div><div style={{fontSize:10,opacity:0.7}}>💰 Amount</div><div style={{fontWeight:700}}>₹{curr.amount}</div></div>}
          </div>
          {daysSinceChange && <div style={{marginTop:8,fontSize:12,opacity:0.8}}>In use for {daysSinceChange} days</div>}
          {daysLeft!==null&&daysLeft<7 && <div style={{background:"#fff3",borderRadius:8,padding:"6px 12px",marginTop:8,fontSize:12,fontWeight:700}}>⚠️ Book next cylinder soon!</div>}
        </div>
      )}

      {!curr && !showForm && (
        <div style={{...S.card,textAlign:"center",padding:32,marginBottom:12,color:"#aaa"}}>
          No cylinder record yet. Add your first one!
        </div>
      )}

      {/* Quick update current */}
      {curr && !showForm && (
        <div style={{...S.card,marginBottom:12,border:"1.5px solid #e07b54"}}>
          <div style={{fontWeight:700,marginBottom:10,color:"#e07b54"}}>📝 Update Current Cylinder</div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {[
              {label:"📦 Received Date",field:"receivedDate",type:"date"},
              {label:"💳 Installment Date",field:"installmentDate",type:"date"},
              {label:"🔄 Changed/Connected Date",field:"changedDate",type:"date"},
              {label:"💰 Amount Paid (₹)",field:"amount",type:"number"},
            ].map(f=>(
              <div key={f.field} style={{display:"flex",alignItems:"center",gap:10}}>
                <label style={{fontSize:12,color:"#888",width:160,flexShrink:0}}>{f.label}</label>
                <input type={f.type} style={{...S.select,flex:1}}
                  value={curr[f.field]||""}
                  onChange={e=>updateCurrent(f.field,e.target.value)}/>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Add new booking */}
      <button style={{...S.btnPrimary,width:"100%",marginBottom:12}} onClick={()=>setShowForm(!showForm)}>
        {showForm ? "Cancel" : "🔥 + Book New Cylinder"}
      </button>

      {showForm && (
        <div style={{...S.card,marginBottom:12,border:"2px solid #e07b54"}}>
          <div style={{fontWeight:700,marginBottom:12,color:"#e07b54"}}>New Gas Cylinder Booking</div>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            <div>
              <label style={{fontSize:12,color:"#888",fontWeight:600}}>Gas Company</label>
              <select style={{...S.select,width:"100%",marginTop:4,boxSizing:"border-box"}}
                value={form.company} onChange={e=>setForm({...form,company:e.target.value})}>
                {companies.map(c=><option key={c}>{c}</option>)}
              </select>
            </div>
            {[
              {label:"📋 Booking Date *",field:"bookingDate",type:"date"},
              {label:"📦 Received Date",field:"receivedDate",type:"date"},
              {label:"💳 Installment Date",field:"installmentDate",type:"date"},
              {label:"🔄 Changed/Connected Date",field:"changedDate",type:"date"},
              {label:"💰 Amount (₹)",field:"amount",type:"number"},
            ].map(f=>(
              <div key={f.field}>
                <label style={{fontSize:12,color:"#888",fontWeight:600}}>{f.label}</label>
                <input type={f.type} style={{...S.select,width:"100%",marginTop:4,boxSizing:"border-box"}}
                  value={form[f.field]} onChange={e=>setForm({...form,[f.field]:e.target.value})}/>
              </div>
            ))}
            <div>
              <label style={{fontSize:12,color:"#888",fontWeight:600}}>Notes</label>
              <input style={{...S.input,marginTop:4}} placeholder="Any notes..." value={form.notes}
                onChange={e=>setForm({...form,notes:e.target.value})}/>

function GasSection({ gas, setGas, showToast }) {
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ bookingDate:"", receivedDate:"", installmentDate:"", changedDate:"", amount:"", company:"HP", notes:"" });
  const today = new Date().toISOString().slice(0,10);
  const companies = ["HP","Bharat Gas","Indane"];

  const addRecord = () => {
    if (!form.bookingDate) { showToast("Booking date required!"); return; }
    const record = { id:Date.now(), ...form, addedAt:today };
    setGas({ ...gas, records:[...(gas?.records||[]), record], currentCylinder:record });
    setForm({ bookingDate:"", receivedDate:"", installmentDate:"", changedDate:"", amount:"", company:"HP", notes:"" });
    setShowForm(false);
    showToast("Gas cylinder record saved! 🔥");
  };

  const updateCurrent = (field, value) => {
    const curr = gas?.currentCylinder;
    if (!curr) return;
    const updated = { ...curr, [field]: value };
    setGas({ ...gas, currentCylinder:updated, records:(gas?.records||[]).map(r=>r.id===curr.id?updated:r) });
    showToast("Updated! ✅");
  };

  const curr = gas?.currentCylinder;
  const records = [...(gas?.records||[])].reverse();
  const daysSinceChange = curr?.changedDate ? Math.floor((new Date()-new Date(curr.changedDate))/(1000*60*60*24)) : null;
  const daysLeft = daysSinceChange!==null ? Math.max(0,45-daysSinceChange) : null;

  return (
    <div>
      {curr && (
        <div style={{...S.card,marginBottom:12,background:daysLeft!==null&&daysLeft<7?"linear-gradient(135deg,#c0392b,#962d22)":"linear-gradient(135deg,#e07b54,#c4573b)",color:"#fff",borderRadius:16}}>
          <div style={{fontSize:13,opacity:0.8,marginBottom:4}}>🔥 Current — {curr.company}</div>
          {daysLeft!==null&&<div style={{fontSize:28,fontWeight:800,marginBottom:8}}>{daysLeft} days left{daysLeft<7?" ⚠️":""}</div>}
          <div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
            {curr.bookingDate&&<div><div style={{fontSize:10,opacity:0.7}}>📋 Booked</div><div style={{fontWeight:700}}>{curr.bookingDate}</div></div>}
            {curr.receivedDate&&<div><div style={{fontSize:10,opacity:0.7}}>📦 Received</div><div style={{fontWeight:700}}>{curr.receivedDate}</div></div>}
            {curr.installmentDate&&<div><div style={{fontSize:10,opacity:0.7}}>💳 Installment</div><div style={{fontWeight:700}}>{curr.installmentDate}</div></div>}
            {curr.changedDate&&<div><div style={{fontSize:10,opacity:0.7}}>🔄 Changed</div><div style={{fontWeight:700}}>{curr.changedDate}</div></div>}
            {curr.amount&&<div><div style={{fontSize:10,opacity:0.7}}>💰 Paid</div><div style={{fontWeight:700}}>₹{curr.amount}</div></div>}
          </div>
          {daysLeft!==null&&daysLeft<7&&<div style={{background:"#fff3",borderRadius:8,padding:"6px 12px",marginTop:8,fontSize:12,fontWeight:700}}>⚠️ Book next cylinder soon!</div>}
        </div>
      )}
      {curr&&!showForm&&(
        <div style={{...S.card,marginBottom:12,border:"1.5px solid #e07b54"}}>
          <div style={{fontWeight:700,marginBottom:10,color:"#e07b54"}}>📝 Update Current Cylinder</div>
          {[{label:"📦 Received Date",field:"receivedDate",type:"date"},{label:"💳 Installment Date",field:"installmentDate",type:"date"},{label:"🔄 Changed Date",field:"changedDate",type:"date"},{label:"💰 Amount (₹)",field:"amount",type:"number"}].map(f=>(
            <div key={f.field} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
              <label style={{fontSize:12,color:"#888",width:160,flexShrink:0}}>{f.label}</label>
              <input type={f.type} style={{...S.select,flex:1}} value={curr[f.field]||""} onChange={e=>updateCurrent(f.field,e.target.value)}/>
            </div>
          ))}
        </div>
      )}
      <button style={{...S.btnPrimary,width:"100%",marginBottom:12}} onClick={()=>setShowForm(!showForm)}>
        {showForm?"Cancel":"🔥 + Book New Cylinder"}
      </button>
      {showForm&&(
        <div style={{...S.card,marginBottom:12,border:"2px solid #e07b54"}}>
          <div style={{fontWeight:700,marginBottom:12,color:"#e07b54"}}>New Booking</div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            <select style={{...S.select,width:"100%"}} value={form.company} onChange={e=>setForm({...form,company:e.target.value})}>
              {companies.map(c=><option key={c}>{c}</option>)}
            </select>
            {[{label:"📋 Booking Date *",field:"bookingDate",type:"date"},{label:"📦 Received Date",field:"receivedDate",type:"date"},{label:"💳 Installment Date",field:"installmentDate",type:"date"},{label:"🔄 Changed Date",field:"changedDate",type:"date"},{label:"💰 Amount (₹)",field:"amount",type:"number"}].map(f=>(
              <div key={f.field}>
                <label style={{fontSize:12,color:"#888"}}>{f.label}</label>
