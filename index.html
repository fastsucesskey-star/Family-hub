        ))}
        {data.length===0&&<p style={{color:"#aaa",fontSize:14}}>No doctor visits recorded.</p>}
      </div>
    </div>
  );
}

function HealthSleep({ person, data, setData, showToast }) {
  const [bedTime,setBedTime]=useState(""); const [wakeTime,setWakeTime]=useState("");
  const [quality,setQuality]=useState("Good"); const [date,setDate]=useState(""); const [notes,setNotes]=useState("");
  const add = () => {
    if (!bedTime||!wakeTime) return;
    // Calculate hours
    const [bh,bm]=bedTime.split(":").map(Number);
    const [wh,wm]=wakeTime.split(":").map(Number);
    let hours = (wh*60+wm - (bh*60+bm))/60;
    if (hours<0) hours+=24;
    setData([...data,{id:Date.now(),cat:"sleep",bedTime,wakeTime,hours:hours.toFixed(1),quality,date:date||new Date().toLocaleDateString("en-US"),notes}]);
    setBedTime(""); setWakeTime(""); setDate(""); setNotes("");
    showToast("Sleep logged! 😴");
  };
  const del = id => setData(data.filter(d=>d.id!==id));
  const avgSleep = data.length ? (data.reduce((s,d)=>s+parseFloat(d.hours),0)/data.length).toFixed(1) : null;
  const qColor = {Excellent:"#1a6b3c",Good:"#5b8dd9",Fair:"#c8962a",Poor:"#c0392b"};
  return (
    <div>
      {avgSleep&&(
        <div style={{...S.card,marginBottom:12,display:"flex",gap:16,alignItems:"center"}}>
          <div style={{fontSize:32}}>😴</div>
          <div>
            <div style={{fontSize:22,fontWeight:800,color:"#1a6b3c"}}>{avgSleep} hrs</div>
            <div style={{fontSize:12,color:"#888"}}>Average sleep ({data.length} nights)</div>
          </div>
          <div style={{fontSize:12,color:parseFloat(avgSleep)>=7?"#1a6b3c":"#c8962a",fontWeight:700}}>
            {parseFloat(avgSleep)>=8?"😁 Great!":parseFloat(avgSleep)>=7?"😊 Good":parseFloat(avgSleep)>=6?"😐 Fair":"😴 Need more sleep"}
          </div>
        </div>
      )}
      <div style={S.card}>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <div style={{flex:1}}>
            <label style={{fontSize:11,color:"#888"}}>Bed Time</label>
            <input type="time" style={{...S.select,marginTop:4,display:"block",width:"100%",boxSizing:"border-box"}} value={bedTime} onChange={e=>setBedTime(e.target.value)} />
          </div>
          <div style={{flex:1}}>
            <label style={{fontSize:11,color:"#888"}}>Wake Time</label>
            <input type="time" style={{...S.select,marginTop:4,display:"block",width:"100%",boxSizing:"border-box"}} value={wakeTime} onChange={e=>setWakeTime(e.target.value)} />
          </div>
          <select style={S.select} value={quality} onChange={e=>setQuality(e.target.value)}>
            <option>Excellent</option><option>Good</option><option>Fair</option><option>Poor</option>
          </select>
          <input type="date" style={S.select} value={date} onChange={e=>setDate(e.target.value)} />
          <input style={{...S.input,flex:2}} placeholder="Notes (e.g. restless, dreams...)" value={notes} onChange={e=>setNotes(e.target.value)} />
          <button style={S.btnPrimary} onClick={add}>Log</button>
        </div>
      </div>
      <div style={{marginTop:10}}>
        {[...data].sort((a,b)=>b.id-a.id).slice(0,14).map(s=>(
          <div key={s.id} style={{...S.card,marginBottom:5,padding:"8px 14px",display:"flex",gap:10,alignItems:"center"}}>
            <span style={{fontSize:20}}>😴</span>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:14}}>{s.hours} hours</div>
              <div style={{fontSize:12,color:"#888"}}>{s.date} • {s.bedTime} → {s.wakeTime}</div>
              {s.notes&&<div style={{fontSize:12,color:"#666"}}>{s.notes}</div>}
            </div>
            <span style={{...S.badge,background:qColor[s.quality]+"22",color:qColor[s.quality]}}>{s.quality}</span>
            <button onClick={()=>del(s.id)} style={S.delBtn}>✕</button>
          </div>
        ))}
        {data.length===0&&<p style={{color:"#aaa",fontSize:14}}>No sleep logged yet.</p>}
      </div>
    </div>
  );
}

// ─── DOCUMENT STORE ───────────────────────────────────────────────────────────
const DOC_TYPES = [
  "Aadhaar Card","PAN Card","Passport","Voter ID","Driving License",
  "Birth Certificate","Ration Card","Health Insurance","Vehicle RC","Other"
];
const MEMBERS = ["Minal","Piyush","Kaushik"];
const MEMBER_ICON = { Minal:"👩", Piyush:"👨", Kaushik:"👶" };

function DocumentStore({ documents, setDocuments, showToast }) {
  const [selMember, setSelMember] = useState("Minal");
  const [showForm, setShowForm] = useState(false);
  const [viewDoc, setViewDoc] = useState(null);
  const [form, setForm] = useState({ type:"Aadhaar Card", number:"", issuedBy:"", issueDate:"", expiryDate:"", notes:"" });

  const save = () => {
    if (!form.number.trim()) { showToast("Document number is required!"); return; }
    const doc = { id:Date.now(), member:selMember, ...form, addedAt:new Date().toLocaleDateString("en-US") };
    setDocuments([...documents, doc]);
    setForm({ type:"Aadhaar Card", number:"", issuedBy:"", issueDate:"", expiryDate:"", notes:"" });
    setShowForm(false);
    showToast("Document saved! 🪪");
  };

  const del = (id) => { setDocuments(documents.filter(d=>d.id!==id)); setViewDoc(null); };

  const memberDocs = documents.filter(d=>d.member===selMember);

  const downloadCard = (doc) => {
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
    <style>
      body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#f3f8f5;}
      .card{background:#fff;border-radius:16px;padding:28px 32px;max-width:480px;margin:0 auto;
        border:2px solid #1a6b3c;box-shadow:0 4px 20px #1a6b3c20;}
      .header{display:flex;align-items:center;gap:12px;margin-bottom:20px;
        border-bottom:2px solid #c8962a;padding-bottom:14px;}
      .logo{font-size:36px;}
      .title{font-size:20px;font-weight:800;color:#1a6b3c;}
      .subtitle{font-size:13px;color:#888;}
      .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0;}
      .label{font-size:12px;color:#888;font-weight:600;text-transform:uppercase;}
      .value{font-size:14px;color:#2d2d2d;font-weight:700;}
      .footer{margin-top:16px;font-size:11px;color:#aaa;text-align:center;}
      .badge{background:#1a6b3c;color:#fff;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:700;}
    </style></head><body>
    <div class="card">
      <div class="header">
        <div class="logo">${MEMBER_ICON[doc.member]}</div>
        <div><div class="title">${doc.member}</div><div class="subtitle">Family Hub — ID Document</div></div>
        <div style="margin-left:auto"><span class="badge">${doc.type}</span></div>
      </div>
      ${doc.number?`<div class="row"><span class="label">Document Number</span><span class="value">${doc.number}</span></div>`:""}
      ${doc.issuedBy?`<div class="row"><span class="label">Issued By</span><span class="value">${doc.issuedBy}</span></div>`:""}
      ${doc.issueDate?`<div class="row"><span class="label">Issue Date</span><span class="value">${doc.issueDate}</span></div>`:""}
      ${doc.expiryDate?`<div class="row"><span class="label">Expiry Date</span><span class="value">${doc.expiryDate}</span></div>`:""}
      ${doc.notes?`<div class="row"><span class="label">Notes</span><span class="value">${doc.notes}</span></div>`:""}
      <div class="footer">Saved on ${doc.addedAt} • Family Hub 🏠</div>
    </div></body></html>`;
    const blob = new Blob([html], {type:"text/html"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `${doc.member}_${doc.type.replace(/ /g,"_")}.html`;
    a.click(); URL.revokeObjectURL(url);
    showToast("Downloaded! Open in browser to print as PDF 📄");
  };

  const isExpiringSoon = (expiry) => {
    if (!expiry) return false;
    const d = new Date(expiry); const now = new Date();
    return (d - now) < 90 * 24 * 60 * 60 * 1000 && d > now;
  };
  const isExpired = (expiry) => expiry && new Date(expiry) < new Date();

  return (
    <div style={S.page}>
      <h2 style={S.pageTitle}>🪪 ID Documents</h2>
      <p style={{color:"#888",fontSize:13,marginTop:-10,marginBottom:16}}>🔒 Only visible to Minal</p>

      {/* Member tabs */}
      <div style={{display:"flex",gap:8,marginBottom:20}}>
        {MEMBERS.map(m=>(
          <button key={m} onClick={()=>setSelMember(m)}
            style={{...S.tabBtn,flex:1,...(selMember===m?S.tabBtnActive:{})}}>
            {MEMBER_ICON[m]} {m}
          </button>
        ))}
      </div>

      {/* Add button */}
      {!showForm && (
        <button style={{...S.btnPrimary,marginBottom:16,width:"100%"}} onClick={()=>setShowForm(true)}>
          + Add Document for {MEMBER_ICON[selMember]} {selMember}
        </button>
      )}

      {/* Add Form */}
      {showForm && (
        <div style={{...S.card,marginBottom:16,border:"2px solid #c8962a"}}>
          <div style={{fontWeight:700,marginBottom:12,color:"#c8962a"}}>
            📄 New Document — {MEMBER_ICON[selMember]} {selMember}
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            <div>
              <label style={{fontSize:12,color:"#888",fontWeight:600}}>Document Type</label>
              <select style={{...S.select,width:"100%",marginTop:4}} value={form.type} onChange={e=>setForm({...form,type:e.target.value})}>
                {DOC_TYPES.map(t=><option key={t}>{t}</option>)}
              </select>
            </div>
            <div>
              <label style={{fontSize:12,color:"#888",fontWeight:600}}>Document Number *</label>
              <input style={{...S.input,marginTop:4}} placeholder="e.g. XXXX XXXX XXXX" value={form.number} onChange={e=>setForm({...form,number:e.target.value})} />
            </div>
            <div>
              <label style={{fontSize:12,color:"#888",fontWeight:600}}>Issued By</label>
              <input style={{...S.input,marginTop:4}} placeholder="e.g. Government of India" value={form.issuedBy} onChange={e=>setForm({...form,issuedBy:e.target.value})} />
            </div>
            <div style={{display:"flex",gap:8}}>
              <div style={{flex:1}}>
                <label style={{fontSize:12,color:"#888",fontWeight:600}}>Issue Date</label>
                <input type="date" style={{...S.select,width:"100%",marginTop:4,boxSizing:"border-box"}} value={form.issueDate} onChange={e=>setForm({...form,issueDate:e.target.value})} />
              </div>
              <div style={{flex:1}}>
                <label style={{fontSize:12,color:"#888",fontWeight:600}}>Expiry Date</label>
                <input type="date" style={{...S.select,width:"100%",marginTop:4,boxSizing:"border-box"}} value={form.expiryDate} onChange={e=>setForm({...form,expiryDate:e.target.value})} />
              </div>
            </div>
            <div>
              <label style={{fontSize:12,color:"#888",fontWeight:600}}>Notes</label>
              <input style={{...S.input,marginTop:4}} placeholder="Any additional info..." value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} />
            </div>
            <div style={{display:"flex",gap:8,marginTop:4}}>
              <button style={S.btnPrimary} onClick={save}>Save Document</button>
              <button style={S.backBtn} onClick={()=>setShowForm(false)}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {/* Document Cards */}
      {memberDocs.length===0 && !showForm && (
        <div style={{textAlign:"center",color:"#aaa",padding:"32px 0",fontSize:14}}>
          No documents saved for {selMember} yet.
        </div>
      )}

      {memberDocs.map(doc=>(
        <div key={doc.id} style={{...S.card,marginBottom:10,
          borderLeft:`4px solid ${isExpired(doc.expiryDate)?"#c0392b":isExpiringSoon(doc.expiryDate)?"#c8962a":"#1a6b3c"}`}}>
          {viewDoc===doc.id ? (
            // Expanded view
            <div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                <div style={{fontWeight:800,fontSize:16}}>{doc.type}</div>
                <button onClick={()=>setViewDoc(null)} style={S.backBtn}>✕ Close</button>
              </div>
              {[
                {l:"Document Number", v:doc.number},
                {l:"Issued By", v:doc.issuedBy},
                {l:"Issue Date", v:doc.issueDate},
                {l:"Expiry Date", v:doc.expiryDate},
                {l:"Notes", v:doc.notes},
                {l:"Saved On", v:doc.addedAt},
              ].filter(r=>r.v).map(r=>(
                <div key={r.l} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:"1px solid #f0f0f0"}}>
                  <span style={{fontSize:12,color:"#888",fontWeight:600}}>{r.l}</span>
                  <span style={{fontSize:14,fontWeight:700,color:"#2d2d2d"}}>{r.v}</span>
                </div>
              ))}
              {isExpired(doc.expiryDate) && <div style={{background:"#fde8e8",borderRadius:8,padding:"6px 12px",marginTop:8,fontSize:12,color:"#c0392b",fontWeight:700}}>⚠️ This document has EXPIRED!</div>}
              {isExpiringSoon(doc.expiryDate) && !isExpired(doc.expiryDate) && <div style={{background:"#fff8e1",borderRadius:8,padding:"6px 12px",marginTop:8,fontSize:12,color:"#c8962a",fontWeight:700}}>⚠️ Expiring soon — renew soon!</div>}
              <div style={{display:"flex",gap:8,marginTop:12}}>
                <button style={{...S.btnPrimary,flex:1,fontSize:13}} onClick={()=>downloadCard(doc)}>⬇️ Download Card</button>
                <button style={{...S.btnPrimary,background:"#c0392b",fontSize:13}} onClick={()=>del(doc.id)}>🗑️ Delete</button>
              </div>
            </div>
          ) : (
            // Collapsed view
            <div style={{display:"flex",alignItems:"center",gap:12,cursor:"pointer"}} onClick={()=>setViewDoc(doc.id)}>
              <div style={{fontSize:28}}>{
                doc.type==="Aadhaar Card"?"🪪":doc.type==="PAN Card"?"💳":
                doc.type==="Passport"?"📕":doc.type==="Driving License"?"🚗":
                doc.type==="Birth Certificate"?"👶":doc.type==="Voter ID"?"🗳️":"📄"
              }</div>
              <div style={{flex:1}}>
                <div style={{fontWeight:700,fontSize:14}}>{doc.type}</div>
                <div style={{fontSize:12,color:"#888"}}>
                  {doc.number.length>8 ? doc.number.slice(0,4)+"••••"+doc.number.slice(-4) : "••••••••"}
                  {doc.expiryDate && ` • Exp: ${doc.expiryDate}`}
                </div>
              </div>
              <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4}}>
                {isExpired(doc.expiryDate) && <span style={{...S.badge,background:"#fde8e8",color:"#c0392b"}}>Expired</span>}
                {isExpiringSoon(doc.expiryDate) && !isExpired(doc.expiryDate) && <span style={{...S.badge,background:"#fff8e1",color:"#c8962a"}}>Expiring</span>}
                <span style={{fontSize:11,color:"#bbb"}}>Tap to view</span>
              </div>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

// ─── STYLES ───────────────────────────────────────────────────────────────────
// Barkat colours: Deep Emerald Green (#1a6b3c) + Sone jaisa Gold (#c8962a)
// Green = samriddhi, growth, nature | Gold = lakshmi, prosperity, auspiciousness
const S = {
  loginWrap:{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#e8f5e9 0%,#fff8e1 50%,#e8f5e9 100%)",fontFamily:"Poppins,sans-serif"},
  loginCard:{background:"#fff",borderRadius:24,padding:"40px 32px",boxShadow:"0 8px 40px #1a6b3c30",textAlign:"center",minWidth:280,border:"1.5px solid #c8962a33"},
  loginLogo:{fontSize:48,marginBottom:8},
  loginTitle:{margin:"0 0 4px",fontFamily:"Poppins,sans-serif",fontWeight:800,fontSize:28,color:"#1a6b3c"},
  loginSub:{color:"#888",fontSize:13,margin:0},
  personaBtn:{display:"flex",flexDirection:"column",alignItems:"center",background:"#f1f9f4",border:"2px solid #a5d6b5",borderRadius:16,padding:"16px 24px",cursor:"pointer",fontFamily:"Poppins,sans-serif",transition:"all 0.2s",flex:1},
  pinBtn:{border:"none",borderRadius:12,height:52,fontSize:20,fontWeight:700,cursor:"pointer",fontFamily:"Poppins,sans-serif"},
  backBtn:{background:"#f4f4f4",border:"none",borderRadius:8,padding:"6px 14px",cursor:"pointer",marginTop:16,fontSize:13,color:"#666",fontFamily:"Poppins,sans-serif"},
  // TOP NAV LAYOUT
  appWrap:{display:"flex",flexDirection:"column",minHeight:"100vh",fontFamily:"Poppins,sans-serif",background:"#f3f8f5"},
  topHeader:{background:"linear-gradient(90deg,#1a6b3c 0%,#145530 60%,#c8962a 100%)",display:"flex",alignItems:"center",gap:8,padding:"0 12px",height:56,flexShrink:0,boxShadow:"0 2px 12px #1a6b3c40",position:"sticky",top:0,zIndex:100},
  headerLeft:{display:"flex",alignItems:"center",gap:8,flexShrink:0,marginRight:8},
  topNav:{flex:1,display:"flex",gap:2,overflowX:"auto",alignItems:"center",scrollbarWidth:"none"},
  topNavBtn:{display:"flex",flexDirection:"column",alignItems:"center",gap:1,padding:"4px 8px",borderRadius:8,border:"none",background:"transparent",color:"#c8f0d8",cursor:"pointer",fontFamily:"Poppins,sans-serif",transition:"all 0.15s",whiteSpace:"nowrap",flexShrink:0,minWidth:52},
  topNavBtnActive:{background:"#c8962a",color:"#fff",fontWeight:700},
  logoutBtn:{background:"#ffffff22",border:"none",borderRadius:8,padding:"6px 10px",color:"#fff",cursor:"pointer",fontSize:18,flexShrink:0},
  content:{flex:1,overflowY:"auto",padding:"0 0 40px"},
  page:{maxWidth:720,margin:"0 auto",padding:"20px 16px"},
  pageTitle:{fontWeight:800,fontSize:22,color:"#1a6b3c",margin:"0 0 16px"},
  card:{background:"#fff",borderRadius:14,padding:"14px 16px",boxShadow:"0 2px 12px #1a6b3c0d",marginBottom:4,border:"1px solid #e8f3ec"},
  dashGrid:{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10,marginBottom:10},
  dashCard:{background:"#fff",borderRadius:14,padding:"14px",boxShadow:"0 2px 12px #1a6b3c0d",cursor:"pointer",border:"1px solid #e8f3ec"},
  input:{width:"100%",border:"1.5px solid #c5e0cc",borderRadius:8,padding:"8px 12px",fontFamily:"Poppins,sans-serif",fontSize:14,outline:"none",boxSizing:"border-box",background:"#fafdfa"},
  select:{border:"1.5px solid #c5e0cc",borderRadius:8,padding:"8px 10px",fontFamily:"Poppins,sans-serif",fontSize:13,background:"#fafdfa",outline:"none"},
  btnPrimary:{background:"linear-gradient(90deg,#1a6b3c,#217a46)",color:"#fff",border:"none",borderRadius:8,padding:"8px 18px",fontWeight:700,cursor:"pointer",fontFamily:"Poppins,sans-serif",fontSize:14,whiteSpace:"nowrap"},
  delBtn:{background:"#fde8e8",border:"none",borderRadius:8,width:28,height:28,cursor:"pointer",color:"#c0392b",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0},
  badge:{fontSize:11,padding:"2px 8px",borderRadius:20,fontWeight:600},
  quickBtn:{background:"#f0faf4",color:"#1a6b3c",border:"1.5px solid #a5d6b5",borderRadius:20,padding:"6px 14px",cursor:"pointer",fontFamily:"Poppins,sans-serif",fontSize:13,fontWeight:600},
  tabBtn:{background:"#f0faf4",border:"1.5px solid #c5e0cc",borderRadius:20,padding:"7px 16px",cursor:"pointer",fontFamily:"Poppins,sans-serif",fontSize:13,color:"#1a6b3c"},
  tabBtnActive:{background:"#1a6b3c",color:"#fff",fontWeight:700,border:"1.5px solid #1a6b3c"},
};

    // Wait for Firebase then render
    function renderApp() {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(React.createElement(FamilyHub));
    }

    if (window._firebaseReady) {
      renderApp();
    } else {
      window.addEventListener('firebase-ready', renderApp);
    }
  </script>
</body>
