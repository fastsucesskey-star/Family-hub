  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB92410ygcK7qTs69MDIcoweMJe0mNBjls",
      authDomain: "family-hub-minal.firebaseapp.com",
      projectId: "family-hub-minal",
      storageBucket: "family-hub-minal.firebasestorage.app",
      messagingSenderId: "558247968463",
      appId: "1:558247968463:web:20ed3b6ae1375abee441ba"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Global storage API compatible with window.storage used in app
    window.storage = {
      get: async (key, shared) => {
        try {
          const ref = doc(db, "familyhub", key);
          const snap = await getDoc(ref);
          if (snap.exists()) return { key, value: snap.data().value, shared };
          return null;
        } catch(e) { return null; }
      },
      set: async (key, value, shared) => {
        try {
          const ref = doc(db, "familyhub", key);
          await setDoc(ref, { value, updatedAt: new Date().toISOString() });
          return { key, value, shared };
        } catch(e) { return null; }
      },
      delete: async (key) => {
        try {
          const ref = doc(db, "familyhub", key);
          await setDoc(ref, { deleted: true });
          return { key, deleted: true };
        } catch(e) { return null; }
      },
      list: async (prefix) => {
        return { keys: [], prefix };
      }
    };
    window._firebaseReady = true;
    window.dispatchEvent(new Event('firebase-ready'));
  </script>
</head>

    const { useState, useEffect } = React;


// ─── STORAGE HELPERS ──────────────────────────────────────────────────────────
const load = async (key) => {
  try { const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; } catch { return null; }
};
const save = async (key, val) => {
  try { await window.storage.set(key, JSON.stringify(val), true); } catch {}
};

// ─── TOAST ────────────────────────────────────────────────────────────────────
function Toast({ msg, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, []);
  const isAlert = msg.startsWith("⚠️");
  return (
    <div style={{
      position:"fixed", bottom:24, left:"50%", transform:"translateX(-50%)",
      background: isAlert ? "#c0392b" : "#2d2d2d", color:"#fff",
      padding:"10px 22px", borderRadius:24, fontSize:14, zIndex:9999,
      boxShadow:"0 4px 20px #0003", whiteSpace:"nowrap", maxWidth:"90vw", textAlign:"center"
    }}>{msg}</div>
  );
}

// ─── LOGIN ────────────────────────────────────────────────────────────────────
function LoginScreen({ onLogin }) {
  const [user, setUser] = useState(null);
  const [pin, setPin] = useState("");
  const [err, setErr] = useState("");

  const handlePin = (d) => {
    if (d === "⌫") { setPin(p => p.slice(0,-1)); return; }
    const np = pin + d;
    setPin(np);
    if (np.length === 4) {
      if (PINS[user] === np) { onLogin(user); }
      else { setErr("Wrong PIN, try again"); setTimeout(() => { setPin(""); setErr(""); }, 800); }
    }
  };

  if (!user) return (
    <div style={S.loginWrap}>
      <div style={S.loginCard}>
        <div style={{fontSize:52,marginBottom:4}}>🏠</div>
        <h1 style={S.loginTitle}>Family Hub</h1>
        <p style={S.loginSub}>Minal & Piyush's Home Command Centre</p>
        <div style={{display:"flex",gap:16,marginTop:28}}>
          {["Minal","Piyush"].map(u => (
            <button key={u} style={S.personaBtn} onClick={() => setUser(u)}>
              <span style={{fontSize:36}}>{u==="Minal"?"👩":"👨"}</span>
              <span style={{fontWeight:700,marginTop:6}}>{u}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );

  return (
    <div style={S.loginWrap}>
      <div style={S.loginCard}>
        <div style={{fontSize:48,marginBottom:8}}>{user==="Minal"?"👩":"👨"}</div>
        <h2 style={{margin:"0 0 4px",fontFamily:"Poppins,sans-serif",color:"#2d2d2d"}}>Welcome, {user}! 👋</h2>
        <p style={{color:"#888",fontSize:14,margin:"0 0 24px"}}>Enter your 4-digit PIN</p>
        <div style={{display:"flex",gap:10,marginBottom:16,justifyContent:"center"}}>
          {[0,1,2,3].map(i => (
            <div key={i} style={{width:18,height:18,borderRadius:"50%",background:pin.length>i?"#c8962a":"#e8e8e8",transition:"background 0.2s"}}/>
          ))}
        </div>
        {err && <p style={{color:"#1a6b3c",fontSize:13,marginBottom:8}}>{err}</p>}
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,width:210}}>
          {["1","2","3","4","5","6","7","8","9","","0","⌫"].map((d,i) => (
            <button key={i} onClick={() => d && handlePin(d)} style={{
              ...S.pinBtn, visibility:d?"visible":"hidden",
              background:d==="⌫"?"#fde8e8":"#f4f4f4", color:d==="⌫"?"#1a6b3c":"#2d2d2d"
            }}>{d}</button>
          ))}
        </div>
        <button onClick={() => {setUser(null);setPin("");}} style={S.backBtn}>← Back</button>
      </div>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function FamilyHub() {
  const [user, setUser] = useState(null);
  const [activeModule, setActiveModule] = useState("dashboard");
  const [toast, setToast] = useState(null);

  const [tasks, setTasks] = useState([]);
  const [grocery, setGrocery] = useState([]);
  const [budget, setBudget] = useState([]);
  const [schedule, setSchedule] = useState([]);
  const [notices, setNotices] = useState([]);
  const [messages, setMessages] = useState([]);
  const [babyVax, setBabyVax] = useState([]);
  const [babyDiet, setBabyDiet] = useState([]);
  const [babyHealth, setBabyHealth] = useState([]);
  const [babyMeds, setBabyMeds] = useState([]);
  const [officeTasks, setOfficeTasks] = useState([]);
  const [artTasks, setArtTasks] = useState([]);
  const [catTasks, setCatTasks] = useState([]);
  const [menus, setMenus] = useState([]);
  const [pantry, setPantry] = useState([]);
  const [documents, setDocuments] = useState([]);
  const [chores, setChores] = useState([]);
  const [health, setHealth] = useState([]);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    (async () => {
      const keys = ["tasks","grocery","budget","schedule","notices","messages",
        "babyVax","babyDiet","babyHealth","babyMeds","officeTasks","artTasks","catTasks","menus","pantry","documents","chores","health"];
      const setters = [setTasks,setGrocery,setBudget,setSchedule,setNotices,setMessages,
        setBabyVax,setBabyDiet,setBabyHealth,setBabyMeds,setOfficeTasks,setArtTasks,setCatTasks,setMenus,setPantry,setDocuments,setChores,setHealth];
      const defaults = [[],[],[],[],[],[],
        BABY_VACCINES.map((v,i)=>({...v,id:i,done:false,date:"",notes:"",dueDate:""})),
        [],[],[],[],[],[],[],[],[],DEFAULT_CHORES,[]];
      for (let i=0;i<keys.length;i++) {
        const d = await load("fh_"+keys[i]);
        if (d) setters[i](d); else setters[i](defaults[i]);
      }
      setLoaded(true);
    })();
  }, []);

  const persist = async (key, val) => { await save("fh_"+key, val); };
  const showToast = (msg) => setToast(msg);
  const visibleModules = ALL_MODULES.filter(m => user==="Minal" ? true : !m.minalOnly);

  if (!user) return <LoginScreen onLogin={u => { setUser(u); setActiveModule("dashboard"); }} />;
  if (!loaded) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",fontFamily:"Poppins,sans-serif",fontSize:16}}>Loading Family Hub... 🏠</div>;

  const mod = activeModule;
  const groceryProps = { grocery, setGrocery:v=>{setGrocery(v);persist("grocery",v);}, pantry, setPantry:v=>{setPantry(v);persist("pantry",v);}, showToast };

  return (
    <div style={S.appWrap}>
      {/* TOP HEADER */}
      <div style={S.topHeader}>
        <div style={S.headerLeft}>
          <span style={{fontSize:22}}>🏠</span>
          <div>
            <div style={{fontWeight:800,fontSize:14,color:"#fff",letterSpacing:0.5}}>Family Hub</div>
            <div style={{fontSize:11,color:"#d4f5c0"}}>{user==="Minal"?"👩 Minal":"👨 Piyush"}</div>
          </div>
        </div>
        <nav style={S.topNav}>
          {visibleModules.map(m => (
            <button key={m.id} onClick={() => setActiveModule(m.id)}
              style={{...S.topNavBtn,...(mod===m.id?S.topNavBtnActive:{})}}>
              <span style={{fontSize:16}}>{m.icon}</span>
              <span style={{fontSize:11}}>{m.label}</span>
            </button>
          ))}
        </nav>
        <button onClick={() => setUser(null)} style={S.logoutBtn}>🚪</button>
      </div>

      <div style={S.content}>
        {mod==="dashboard" && <Dashboard user={user} tasks={tasks} schedule={schedule} notices={notices} babyVax={babyVax} messages={messages} menus={menus} grocery={grocery} pantry={pantry} setActiveModule={setActiveModule} showToast={showToast} />}
        {mod==="menu" && <MenuPlanner user={user} menus={menus} setMenus={v=>{setMenus(v);persist("menus",v);}} grocery={grocery} setGrocery={v=>{setGrocery(v);persist("grocery",v);}} pantry={pantry} setPantry={v=>{setPantry(v);persist("pantry",v);}} showToast={showToast} />}
        {mod==="chores" && <Chores user={user} chores={chores} setChores={v=>{setChores(v);persist("chores",v);}} showToast={showToast} />}
        {mod==="tasks" && <Tasks user={user} tasks={tasks} setTasks={v=>{setTasks(v);persist("tasks",v);}} showToast={showToast} />}
        {mod==="health" && <HealthTracker user={user} health={health} setHealth={v=>{setHealth(v);persist("health",v);}} showToast={showToast} />}
        {mod==="grocery" && <Grocery user={user} {...groceryProps} menus={menus} />}
        {mod==="budget" && <Budget user={user} budget={budget} setBudget={v=>{setBudget(v);persist("budget",v);}} showToast={showToast} />}
        {mod==="schedule" && <Schedule user={user} schedule={schedule} setSchedule={v=>{setSchedule(v);persist("schedule",v);}} showToast={showToast} />}
        {mod==="notices" && <Notices user={user} notices={notices} setNotices={v=>{setNotices(v);persist("notices",v);}} showToast={showToast} />}
        {mod==="baby" && <BabyCorner user={user} babyVax={babyVax} setBabyVax={v=>{setBabyVax(v);persist("babyVax",v);}} babyDiet={babyDiet} setBabyDiet={v=>{setBabyDiet(v);persist("babyDiet",v);}} babyHealth={babyHealth} setBabyHealth={v=>{setBabyHealth(v);persist("babyHealth",v);}} babyMeds={babyMeds} setBabyMeds={v=>{setBabyMeds(v);persist("babyMeds",v);}} showToast={showToast} />}
        {mod==="messages" && <FamilyChat user={user} messages={messages} setMessages={v=>{setMessages(v);persist("messages",v);}} />}
        {mod==="documents" && user==="Minal" && <DocumentStore documents={documents} setDocuments={v=>{setDocuments(v);persist("documents",v);}} showToast={showToast} />}
        {mod==="office" && user==="Minal" && <SimpleTaskBoard title="Office Work" icon="🏢" tasks={officeTasks} setTasks={v=>{setOfficeTasks(v);persist("officeTasks",v);}} user={user} showToast={showToast} />}
        {mod==="artwork" && user==="Minal" && <SimpleTaskBoard title="Art Work" icon="🎨" tasks={artTasks} setTasks={v=>{setArtTasks(v);persist("artTasks",v);}} user={user} showToast={showToast} />}
        {mod==="catfoster" && user==="Minal" && <SimpleTaskBoard title="Cat Foster / Boarding" icon="🐱" tasks={catTasks} setTasks={v=>{setCatTasks(v);persist("catTasks",v);}} user={user} showToast={showToast} />}
      </div>
      {toast && <Toast msg={toast} onClose={() => setToast(null)} />}
    </div>
  );
}

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
function Dashboard({ user, tasks, schedule, notices, babyVax, messages, menus, grocery, pantry, setActiveModule, showToast }) {
  const pendingTasks = tasks.filter(t=>!t.done).length;
  const today = new Date().toISOString().slice(0,10);
  const todayItems = schedule.filter(s=>s.date===today).length;
  const unreadNotices = notices.filter(n=>!n.read).length;
  const nextVax = babyVax.find(v=>!v.done);
  const recentMsg = messages[messages.length-1];
  const todayMenu = menus.find(m=>m.date===today);
  const pendingApproval = menus.filter(m=>m.status==="pending" && user==="Piyush").length;

  // Smart pantry alert: items needed tomorrow but missing from pantry/grocery
  const tomorrowDate = new Date(); tomorrowDate.setDate(tomorrowDate.getDate()+1);
  const tomorrow = tomorrowDate.toISOString().slice(0,10);
  const tomorrowMenu = menus.find(m=>m.date===tomorrow);
  const missingIngredients = tomorrowMenu ? (tomorrowMenu.allIngredients||[]).filter(ing => {
    const inPantry = pantry.find(p=>p.name.toLowerCase()===ing.toLowerCase() && p.available);
    const inGrocery = grocery.find(g=>g.item.toLowerCase()===ing.toLowerCase() && !g.done);
    return !inPantry && !inGrocery;
  }) : [];

  return (
    <div style={S.page}>
      <h2 style={S.pageTitle}>🏠 Welcome, {user}! 👋</h2>
      <p style={{color:"#888",marginTop:-8,marginBottom:20}}>
        {new Date().toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}
      </p>

      {missingIngredients.length>0 && (
        <div style={{background:"#fff8e1",border:"1.5px solid #ffcc02",borderRadius:12,padding:"12px 16px",marginBottom:16,cursor:"pointer"}} onClick={()=>setActiveModule("grocery")}>
          <div style={{fontWeight:700,color:"#e65100",marginBottom:4}}>⚠️ Buy these for tomorrow!</div>
          <div style={{fontSize:13,color:"#555"}}>{missingIngredients.slice(0,5).join(", ")}{missingIngredients.length>5?` +${missingIngredients.length-5} more`:""}</div>
          <div style={{fontSize:11,color:"#e65100",marginTop:4}}>👆 Tap to add to grocery list</div>
        </div>
      )}

      {pendingApproval>0 && user==="Piyush" && (
        <div style={{background:"#e8f5e9",border:"1.5px solid #5cba8a",borderRadius:12,padding:"12px 16px",marginBottom:16,cursor:"pointer"}} onClick={()=>setActiveModule("menu")}>
          <div style={{fontWeight:700,color:"#2e7d32"}}>🍽️ {pendingApproval} menu waiting for your approval!</div>
        </div>
      )}

      <div style={S.dashGrid}>
        {[
          {label:"Pending Tasks",val:pendingTasks,icon:"✅",mod:"tasks",color:"#1a6b3c"},
          {label:"Today's Events",val:todayItems,icon:"📅",mod:"schedule",color:"#5b8dd9"},
          {label:"New Notices",val:unreadNotices,icon:"📌",mod:"notices",color:"#e8a838"},
          {label:"Kaushik Next Vax",val:nextVax?.name||"✓ Up to date",icon:"💉",mod:"baby",color:"#5cba8a"},
        ].map(c => (
          <div key={c.mod} style={{...S.dashCard,borderTop:`4px solid ${c.color}`}} onClick={()=>setActiveModule(c.mod)}>
            <div style={{fontSize:24}}>{c.icon}</div>
            <div style={{fontSize:c.val.toString().length>8?14:20,fontWeight:800,color:c.color}}>{c.val}</div>
            <div style={{fontSize:11,color:"#888",marginTop:2}}>{c.label}</div>
          </div>
        ))}
      </div>

      {todayMenu && (
        <div style={{...S.card,marginTop:4,borderLeft:"4px solid #c8962a"}}>
          <div style={{fontWeight:700,marginBottom:8}}>🍽️ Today's Menu</div>
          <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
            {todayMenu.breakfast && <div style={{fontSize:13}}><b>🌅 Breakfast:</b> {todayMenu.breakfast}</div>}
            {todayMenu.lunch && <div style={{fontSize:13}}><b>☀️ Lunch:</b> {todayMenu.lunch}</div>}
            {todayMenu.dinner && <div style={{fontSize:13}}><b>🌙 Dinner:</b> {todayMenu.dinner}</div>}
          </div>
          <div style={{marginTop:6}}>
            {todayMenu.status==="approved" && <span style={{...S.badge,background:"#e8f5e9",color:"#5cba8a"}}>✅ Approved by Piyush</span>}
            {todayMenu.status==="rejected" && <span style={{...S.badge,background:"#fde8e8",color:"#1a6b3c"}}>❌ Rejected — {todayMenu.comment}</span>}
            {todayMenu.status==="pending" && <span style={{...S.badge,background:"#fff8e1",color:"#e8a838"}}>⏳ Approval pending</span>}
          </div>
        </div>
      )}

      {recentMsg && (
        <div style={{...S.card,marginTop:8,cursor:"pointer"}} onClick={()=>setActiveModule("messages")}>
          <div style={{fontWeight:700,marginBottom:4}}>💬 Latest Message</div>
          <div style={{fontSize:13,color:"#555"}}><b>{recentMsg.from}:</b> {recentMsg.text}</div>
          <div style={{fontSize:11,color:"#aaa",marginTop:4}}>{recentMsg.time}</div>
        </div>
      )}

      <div style={{...S.card,marginTop:8}}>
        <div style={{fontWeight:700,marginBottom:10}}>⚡ Quick Actions</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {[{label:"🍽️ Menu",mod:"menu"},{label:"+ Task",mod:"tasks"},{label:"+ Grocery",mod:"grocery"},
            {label:"+ Expense",mod:"budget"},{label:"👶 Kaushik",mod:"baby"},{label:"📅 Schedule",mod:"schedule"}
          ].map(a => (
            <button key={a.mod} style={S.quickBtn} onClick={()=>setActiveModule(a.mod)}>{a.label}</button>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── ADD INGREDIENT INLINE ────────────────────────────────────────────────────
function AddIngredientInline({ ingr, setIngr }) {
  const [val, setVal] = useState("");
  const add = () => {
    if (!val.trim()) return;
    setIngr(ingr ? ingr + ", " + val.trim() : val.trim());
    setVal("");
  };
  return (
    <div style={{display:"flex",gap:6,marginTop:8}}>
      <input
        style={{flex:1,border:"1px solid #c5e0cc",borderRadius:6,padding:"4px 10px",fontSize:12,fontFamily:"Poppins,sans-serif",outline:"none",background:"#fff"}}
        placeholder="Add ingredient..."
        value={val}
        onChange={e=>setVal(e.target.value)}
        onKeyDown={e=>e.key==="Enter"&&add()}
      />
      <button onClick={add} style={{background:"#1a6b3c",color:"#fff",border:"none",borderRadius:6,padding:"4px 12px",fontSize:12,cursor:"pointer",fontFamily:"Poppins,sans-serif"}}>+ Add</button>
    </div>
  );
}

// ─── MENU PLANNER ─────────────────────────────────────────────────────────────
function MenuPlanner({ user, menus, setMenus, grocery, setGrocery, pantry, setPantry, showToast }) {
  const [tab, setTab] = useState("plan");
  const today = new Date().toISOString().slice(0,10);
  const [selDate, setSelDate] = useState(today);
  const [breakfast, setBreakfast] = useState("");
  const [bIngr, setBIngr] = useState("");
  const [bLoading, setBLoading] = useState(false);
  const [lunch, setLunch] = useState("");
  const [lIngr, setLIngr] = useState("");
  const [lLoading, setLLoading] = useState(false);
  const [dinner, setDinner] = useState("");
  const [dIngr, setDIngr] = useState("");
  const [dLoading, setDLoading] = useState(false);
  const [comment, setComment] = useState("");

  const fetchIngredients = async (dish, setIngr, setLoading) => {
    if (!dish.trim()) { showToast("Please enter a dish name first!"); return; }
    setLoading(true);
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          model:"claude-sonnet-4-20250514",
          max_tokens:300,
          messages:[{
            role:"user",
            content:`List the main ingredients for making "${dish}" (Indian home cooking style). Return ONLY a comma-separated list of ingredient names, nothing else. Example format: onion, tomato, garlic, cumin seeds, oil, salt. Keep it concise — 6 to 12 ingredients max.`
          }]
        })
      });
      const data = await res.json();
      const text = data.content?.[0]?.text || "";
      setIngr(text.trim());
      showToast(`✅ Ingredients fetched for ${dish}!`);
    } catch(e) {
      showToast("Could not fetch ingredients. Try again.");
    }
    setLoading(false);
  };

  const existing = menus.find(m=>m.date===selDate);

  useEffect(() => {
    if (existing) {
      setBreakfast(existing.breakfast||""); setBIngr((existing.bIngr||[]).join(", "));
      setLunch(existing.lunch||""); setLIngr((existing.lIngr||[]).join(", "));
      setDinner(existing.dinner||""); setDIngr((existing.dIngr||[]).join(", "));
    } else {
      setBreakfast(""); setBIngr(""); setLunch(""); setLIngr(""); setDinner(""); setDIngr("");
    }
  }, [selDate]);

  const parseIngr = (s) => s.split(",").map(x=>x.trim()).filter(Boolean);

  const saveMenu = () => {
    if (!breakfast && !lunch && !dinner) { showToast("Please fill at least one meal!"); return; }
    const allIngredients = [...parseIngr(bIngr), ...parseIngr(lIngr), ...parseIngr(dIngr)];
    const entry = {
      id: existing?.id || Date.now(),
      date: selDate,
      breakfast, bIngr: parseIngr(bIngr),
      lunch, lIngr: parseIngr(lIngr),
      dinner, dIngr: parseIngr(dIngr),
      allIngredients,
      status: existing?.status || "pending",
      comment: existing?.comment || "",
      savedBy: user,
      savedAt: new Date().toLocaleString("en-IN")
    };
    const updated = existing ? menus.map(m=>m.id===existing.id?entry:m) : [...menus,entry];
    setMenus(updated);
    showToast("Menu saved! 🍽️ Sent to Piyush for approval.");
    checkAndAlertIngredients(allIngredients);
  };

  const checkAndAlertIngredients = (ingredients) => {
    const missing = ingredients.filter(ing => {
      const inPantry = pantry.find(p=>p.name.toLowerCase()===ing.toLowerCase() && p.available);
      return !inPantry;
    });
    if (missing.length>0) showToast(`⚠️ ${missing.length} ingredients not at home: ${missing.slice(0,3).join(", ")}${missing.length>3?"...":""}`);
  };

  const respondMenu = (id, status, cmt) => {
    setMenus(menus.map(m=>m.id===id?{...m,status,comment:cmt}:m));
    showToast(status==="approved"?"✅ Menu approved!":"❌ Menu rejected with comment.");
    setComment("");
  };

  const addMissingToGrocery = (menu) => {
    const missing = (menu.allIngredients||[]).filter(ing => {
      const inPantry = pantry.find(p=>p.name.toLowerCase()===ing.toLowerCase() && p.available);
      const alreadyInList = grocery.find(g=>g.item.toLowerCase()===ing.toLowerCase() && !g.done);
      return !inPantry && !alreadyInList;
    });
    if (missing.length===0) { showToast("All ingredients are available! ✅"); return; }
    const newItems = missing.map(ing=>({id:Date.now()+Math.random(),item:ing,qty:"",cat:"Vegetables",done:false,addedBy:"Menu",fromMenu:menu.date}));
    setGrocery([...grocery,...newItems]);
    showToast(`✅ ${missing.length} ingredients added to grocery list!`);
  };

  const days7 = Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()+i);return d.toISOString().slice(0,10);});

  return (
    <div style={S.page}>
      <h2 style={S.pageTitle}>🍽️ Daily Menu Planner</h2>
      <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap"}}>
        {[{id:"plan",l:"📝 Plan Menu"},{id:"week",l:"📅 Week View"},{id:"pantry",l:"🏠 Pantry"}].map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{...S.tabBtn,...(tab===t.id?S.tabBtnActive:{})}}>{t.l}</button>
        ))}
      </div>

      {tab==="plan" && (
        <div>
          <div style={{...S.card,marginBottom:16}}>
            <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:12,flexWrap:"wrap"}}>
              <label style={{fontWeight:700,fontSize:14}}>📅 Date:</label>
              <input type="date" style={S.select} value={selDate} onChange={e=>setSelDate(e.target.value)} />
              {existing && (
                <span style={{...S.badge,
                  background:existing.status==="approved"?"#e8f5e9":existing.status==="rejected"?"#fde8e8":"#fff8e1",
                  color:existing.status==="approved"?"#1a6b3c":existing.status==="rejected"?"#c0392b":"#b8860b"
                }}>
                  {existing.status==="approved"?"✅ Approved":existing.status==="rejected"?"❌ Rejected":"⏳ Pending"}
                </span>
              )}
            </div>

            {[
              {label:"🌅 Breakfast", meal:breakfast, setMeal:setBreakfast, ingr:bIngr, setIngr:setBIngr, loading:bLoading, setLoading:setBLoading, placeholder:"e.g. Poha, Upma, Paratha..."},
              {label:"☀️ Lunch",     meal:lunch,      setMeal:setLunch,      ingr:lIngr, setIngr:setLIngr, loading:lLoading, setLoading:setLLoading, placeholder:"e.g. Dal Chawal, Roti Sabzi..."},
              {label:"🌙 Dinner",    meal:dinner,     setMeal:setDinner,     ingr:dIngr, setIngr:setDIngr, loading:dLoading, setLoading:setDLoading, placeholder:"e.g. Khichdi, Pulao..."},
            ].map(row=>(
              <div key={row.label} style={{borderBottom:"1px solid #f0f0f0",paddingBottom:14,marginBottom:14}}>
                <div style={{fontWeight:700,fontSize:13,color:"#1a6b3c",marginBottom:6}}>{row.label}</div>
                {/* Dish name + AI button */}
                <div style={{display:"flex",gap:8,marginBottom:8}}>
                  <input
                    style={{...S.input,flex:1}}
                    placeholder={row.placeholder}
                    value={row.meal}
                    onChange={e=>row.setMeal(e.target.value)}
                  />
                  <button
                    style={{
                      ...S.btnPrimary,
                      background: row.loading ? "#aaa" : "linear-gradient(90deg,#c8962a,#b07d20)",
                      fontSize:12, padding:"6px 12px", flexShrink:0,
                      display:"flex", alignItems:"center", gap:4
                    }}
                    onClick={()=>fetchIngredients(row.meal, row.setIngr, row.setLoading)}
                    disabled={row.loading}
                  >
                    {row.loading ? "⏳ Fetching..." : "✨ AI Suggest"}
                  </button>
                </div>
                {/* Ingredients display */}
                {row.ingr ? (
                  <div style={{background:"#f0faf4",borderRadius:8,padding:"8px 12px"}}>
                    <div style={{fontSize:11,color:"#1a6b3c",fontWeight:700,marginBottom:6}}>📦 Ingredients:</div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                      {row.ingr.split(",").map((ing,i)=> ing.trim() && (
                        <span key={i} style={{
                          background:"#fff", border:"1px solid #a5d6b5",
                          borderRadius:20, padding:"3px 10px",
                          fontSize:12, color:"#1a6b3c", fontWeight:500
                        }}>
                          {ing.trim()}
                          <button onClick={()=>{
                            const arr = row.ingr.split(",").map(x=>x.trim()).filter((_,j)=>j!==i);
                            row.setIngr(arr.join(", "));
                          }} style={{background:"none",border:"none",cursor:"pointer",color:"#c0392b",marginLeft:4,fontSize:12,padding:0}}>✕</button>
                        </span>
                      ))}
                    </div>
                    {/* Add custom ingredient */}
                    <AddIngredientInline ingr={row.ingr} setIngr={row.setIngr} />
                  </div>
                ) : (
                  <div style={{fontSize:12,color:"#aaa",fontStyle:"italic"}}>
                    Enter a dish name and tap ✨ AI Suggest to auto-fill ingredients
                  </div>
                )}
              </div>
            ))}

            {user==="Minal" && (
              <button style={S.btnPrimary} onClick={saveMenu}>Save Menu & Send for Approval</button>
            )}

            {existing?.status==="rejected" && existing.comment && (
              <div style={{background:"#fde8e8",borderRadius:8,padding:"8px 12px",marginTop:8,fontSize:13}}>
                💬 Piyush's comment: <b>{existing.comment}</b>
              </div>
            )}
          </div>

          {/* Piyush approval section */}
          {user==="Piyush" && existing && existing.status==="pending" && (
            <div style={{...S.card,border:"2px solid #5cba8a"}}>
              <div style={{fontWeight:700,marginBottom:8}}>👨 Approve or Reject Menu</div>
              <div style={{fontSize:13,color:"#555",marginBottom:8}}>
                Minal has planned the menu for {selDate}. Is it okay?
              </div>
              <textarea style={{...S.input,height:60,resize:"none",marginBottom:10}}
                placeholder="Comment (required for rejection, optional for approval)..."
                value={comment} onChange={e=>setComment(e.target.value)} />
              <div style={{display:"flex",gap:10}}>
                <button style={{...S.btnPrimary,background:"#5cba8a"}} onClick={()=>respondMenu(existing.id,"approved",comment)}>✅ Approve</button>
                <button style={{...S.btnPrimary,background:"#c0392b"}} onClick={()=>{if(!comment){showToast("Comment is required to reject!");return;}respondMenu(existing.id,"rejected",comment);}}>❌ Reject</button>
              </div>
            </div>
          )}

          {existing && (
            <div style={{...S.card,marginTop:8}}>
              <div style={{fontWeight:700,marginBottom:8}}>📦 Ingredients Check for {selDate}</div>
              <IngredientChecker ingredients={existing.allIngredients||[]} pantry={pantry} grocery={grocery} />
              <button style={{...S.btnPrimary,marginTop:10,fontSize:13}} onClick={()=>addMissingToGrocery(existing)}>
                🛒 Add missing items to grocery
              </button>
            </div>
          )}
        </div>
      )}

      {tab==="week" && (
        <div>
          <div style={{fontWeight:700,marginBottom:12,color:"#888",fontSize:13}}>Next 7 days menu overview</div>
          {days7.map(d=>{
            const m = menus.find(x=>x.date===d);
            const dObj = new Date(d);
            const dayName = dObj.toLocaleDateString("en-IN",{weekday:"short",month:"short",day:"numeric"});
            const isToday = d===today;
            const missing = m ? (m.allIngredients||[]).filter(ing=>!pantry.find(p=>p.name.toLowerCase()===ing.toLowerCase()&&p.available)).length : 0;
            return (
              <div key={d} style={{...S.card,marginBottom:8,borderLeft:`4px solid ${isToday?"#c8962a":"#e0e0e0"}`,cursor:"pointer"}}
                onClick={()=>{setSelDate(d);setTab("plan");}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{fontWeight:700,fontSize:13,color:isToday?"#c8962a":"#2d2d2d"}}>
                    {isToday?"🔴 ":""}{dayName}
                  </div>
                  <div style={{display:"flex",gap:6,alignItems:"center"}}>
                    {missing>0 && <span style={{...S.badge,background:"#fff8e1",color:"#e8a838"}}>⚠️ {missing} missing</span>}
                    {m && <span style={{...S.badge,
                      background:m.status==="approved"?"#e8f5e9":m.status==="rejected"?"#fde8e8":"#fff8e1",
                      color:m.status==="approved"?"#1a6b3c":m.status==="rejected"?"#c0392b":"#b8860b"
                    }}>{m.status==="approved"?"✅":m.status==="rejected"?"❌":"⏳"}</span>}
                  </div>
                </div>
                {m ? (
                  <div style={{fontSize:12,color:"#666",marginTop:4}}>
                    {m.breakfast&&`🌅 ${m.breakfast}`}{m.lunch&&` • ☀️ ${m.lunch}`}{m.dinner&&` • 🌙 ${m.dinner}`}
                  </div>
                ) : (
                  <div style={{fontSize:12,color:"#bbb",marginTop:4}}>No menu planned yet — tap to plan</div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {tab==="pantry" && <PantryManager pantry={pantry} setPantry={v=>{setPantry(v);}} showToast={showToast} />}
    </div>
  );
}

function IngredientChecker({ ingredients, pantry, grocery }) {
  if (!ingredients.length) return <div style={{fontSize:13,color:"#aaa"}}>Koi ingredients nahi hain.</div>;
  return (
    <div style={{display:"flex",flexDirection:"column",gap:4}}>
      {ingredients.map((ing,i)=>{
        const inPantry = pantry.find(p=>p.name.toLowerCase()===ing.toLowerCase()&&p.available);
        const inGrocery = grocery.find(g=>g.item.toLowerCase()===ing.toLowerCase()&&!g.done);
        const status = inPantry?"pantry":inGrocery?"grocery":"missing";
        const colors = {pantry:"#e8f5e9",grocery:"#e3f2fd",missing:"#fde8e8"};
        const icons = {pantry:"✅",grocery:"🛒",missing:"❌"};
        const labels = {pantry:"Available at home",grocery:"In grocery list",missing:"Need to buy!"};
        return (
          <div key={i} style={{display:"flex",alignItems:"center",gap:8,background:colors[status],borderRadius:6,padding:"4px 10px"}}>
            <span>{icons[status]}</span>
            <span style={{flex:1,fontSize:13,fontWeight:600,textTransform:"capitalize"}}>{ing}</span>
            <span style={{fontSize:11,color:"#666"}}>{labels[status]}</span>
          </div>
        );
      })}
    </div>
  );
}

function PantryManager({ pantry, setPantry, showToast }) {
  const [name, setName] = useState("");
  const [qty, setQty] = useState("");
  const cats = ["Vegetables","Fruits","Dairy","Grains","Spices","Oil/Masala","Lentils","Other"];
  const [cat, setCat] = useState("Vegetables");

  const add = () => {
    if (!name.trim()) return;
    const existing = pantry.find(p=>p.name.toLowerCase()===name.toLowerCase());
    if (existing) {
      setPantry(pantry.map(p=>p.name.toLowerCase()===name.toLowerCase()?{...p,available:true,qty}:p));
    } else {
      setPantry([...pantry,{id:Date.now(),name:name.trim(),qty,cat,available:true}]);
    }
    setName(""); setQty("");
    showToast(`${name} added to pantry! ✅`);
  };

  const toggle = (id) => setPantry(pantry.map(p=>p.id===id?{...p,available:!p.available}:p));
  const del = (id) => setPantry(pantry.filter(p=>p.id!==id));
  const available = pantry.filter(p=>p.available);
  const unavailable = pantry.filter(p=>!p.available);

  return (
    <div>
      <div style={{...S.card,marginBottom:12}}>
        <div style={{fontWeight:700,marginBottom:8}}>🏠 What's at Home? (Pantry)</div>
        <div style={{fontSize:12,color:"#888",marginBottom:10}}>These items will auto-match with menu ingredients</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <input style={{...S.input,flex:2}} placeholder="Ingredient name..." value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} />
          <input style={{...S.input,flex:1}} placeholder="Qty (e.g. 500g)" value={qty} onChange={e=>setQty(e.target.value)} />
          <select style={S.select} value={cat} onChange={e=>setCat(e.target.value)}>
            {cats.map(c=><option key={c}>{c}</option>)}
          </select>
          <button style={S.btnPrimary} onClick={add}>Add</button>
        </div>
      </div>

      <div style={{fontWeight:700,color:"#5cba8a",marginBottom:6,fontSize:13}}>✅ Available ({available.length})</div>
      {available.map(p=>(
        <div key={p.id} style={{...S.card,marginBottom:5,padding:"7px 12px",display:"flex",alignItems:"center",gap:8}}>
          <input type="checkbox" checked={p.available} onChange={()=>toggle(p.id)} style={{accentColor:"#5cba8a",width:16,height:16}} />
          <span style={{flex:1,fontSize:13,fontWeight:600,textTransform:"capitalize"}}>{p.name}</span>
          {p.qty && <span style={{fontSize:12,color:"#888"}}>{p.qty}</span>}
          <span style={{...S.badge,background:"#f0f0f0",color:"#888",fontSize:10}}>{p.cat}</span>
          <button onClick={()=>del(p.id)} style={S.delBtn}>✕</button>
        </div>
      ))}

      {unavailable.length>0 && <>
        <div style={{fontWeight:700,color:"#1a6b3c",marginTop:12,marginBottom:6,fontSize:13}}>❌ Out of Stock ({unavailable.length})</div>
        {unavailable.map(p=>(
          <div key={p.id} style={{...S.card,marginBottom:5,padding:"7px 12px",display:"flex",alignItems:"center",gap:8,opacity:0.6}}>
            <input type="checkbox" checked={p.available} onChange={()=>toggle(p.id)} style={{accentColor:"#5cba8a",width:16,height:16}} />
            <span style={{flex:1,fontSize:13,textDecoration:"line-through",textTransform:"capitalize"}}>{p.name}</span>
            <button onClick={()=>del(p.id)} style={S.delBtn}>✕</button>
          </div>
        ))}
      </>}
    </div>
  );
}

// ─── GROCERY (ENHANCED) ───────────────────────────────────────────────────────
function Grocery({ user, grocery, setGrocery, pantry, setPantry, showToast, menus }) {
  const [item, setItem] = useState(""); const [qty, setQty] = useState(""); const [cat, setCat] = useState("Vegetables");
  const cats = ["Vegetables","Leafy Greens","Root Vegetables","Fruits","Dairy","Grains","Lentils","Spices","Oil/Masala","Meat/Fish","Household","Baby","Other"];

  const add = () => {
    if (!item.trim()) return;
    setGrocery([...grocery,{id:Date.now(),item:item.trim(),qty,cat,done:false,addedBy:user}]);
    setItem(""); setQty(""); showToast("Item added! 🛒");
  };

  const toggle = (id) => {
    const g = grocery.find(x=>x.id===id);
    if (!g.done && pantry) {
      // When marking done (bought), offer to add to pantry
    }
    setGrocery(grocery.map(x=>x.id===id?{...x,done:!x.done}:x));
  };

  const markBought = (id) => {
    const g = grocery.find(x=>x.id===id);
    setGrocery(grocery.map(x=>x.id===id?{...x,done:true}:x));
    // Update pantry
    const existingPantry = pantry.find(p=>p.name.toLowerCase()===g.item.toLowerCase());
    if (existingPantry) {
      setPantry(pantry.map(p=>p.name.toLowerCase()===g.item.toLowerCase()?{...p,available:true,qty:g.qty}:p));
    } else {
      setPantry([...pantry,{id:Date.now(),name:g.item,qty:g.qty,cat:g.cat,available:true}]);
    }
    showToast(`✅ ${g.item} bought & pantry updated!`);
  };

  const del = (id) => setGrocery(grocery.filter(g=>g.id!==id));
  const clearDone = () => setGrocery(grocery.filter(g=>!g.done));

  const grouped = cats.reduce((acc,c)=>{
    const items = grocery.filter(g=>g.cat===c&&!g.done);
    if (items.length) acc[c]=items;
    return acc;
  },{});
  const doneItems = grocery.filter(g=>g.done);
  const fromMenu = grocery.filter(g=>g.fromMenu&&!g.done);

  return (
    <div style={S.page}>
      <h2 style={S.pageTitle}>🛒 Grocery List</h2>

      {fromMenu.length>0 && (
        <div style={{...S.card,marginBottom:12,borderLeft:"4px solid #5b8dd9",background:"#f0f5ff"}}>
          <div style={{fontWeight:700,color:"#5b8dd9",marginBottom:4}}>🍽️ Menu items pending: {fromMenu.length}</div>
          <div style={{fontSize:12,color:"#666"}}>{fromMenu.map(x=>x.item).join(", ")}</div>
        </div>
      )}

      <div style={S.card}>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <input style={{...S.input,flex:2}} placeholder="Add item..." value={item} onChange={e=>setItem(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} />
          <input style={{...S.input,flex:1}} placeholder="Qty" value={qty} onChange={e=>setQty(e.target.value)} />
          <select style={S.select} value={cat} onChange={e=>setCat(e.target.value)}>
            {cats.map(c=><option key={c}>{c}</option>)}
          </select>
          <button style={S.btnPrimary} onClick={add}>Add</button>
        </div>
      </div>

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",margin:"12px 0 8px"}}>
        <div style={{color:"#888",fontSize:13}}>{doneItems.length}/{grocery.length} done</div>
        {doneItems.length>0 && <button style={{...S.backBtn,marginTop:0}} onClick={clearDone}>Clear Done</button>}

function Tasks({ user, tasks, setTasks, showToast }) {
  const [text, setText] = useState(""); const [assignTo, setAssignTo] = useState("Both");
  const [priority, setPriority] = useState("Normal"); const [dueDate, setDueDate] = useState("");

  const add = () => {
    if (!text.trim()) return;
    setTasks([...tasks,{id:Date.now(),text:text.trim(),assignTo,priority,dueDate,done:false,doneBy:"",createdBy:user,createdAt:new Date().toLocaleString("en-IN")}]);
    setText(""); setDueDate(""); showToast("Task added! ✅");
  };
  const toggle = (id) => setTasks(tasks.map(t=>t.id===id?{...t,done:!t.done,doneBy:!t.done?user:""}:t));
  const del = (id) => setTasks(tasks.filter(t=>t.id!==id));
  const myTasks = tasks.filter(t=>t.assignTo===user||t.assignTo==="Both");
  const pending = myTasks.filter(t=>!t.done);
  const done = myTasks.filter(t=>t.done);

  return (
    <div style={S.page}>
      <h2 style={S.pageTitle}>✅ Tasks</h2>
      <div style={S.card}>
        <input style={{...S.input,marginBottom:8}} placeholder="Enter task..." value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} />
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <select style={S.select} value={assignTo} onChange={e=>setAssignTo(e.target.value)}>
            <option>Both</option><option>Minal</option><option>Piyush</option>
          </select>
          <select style={S.select} value={priority} onChange={e=>setPriority(e.target.value)}>
            <option>Normal</option><option>Urgent</option><option>Low</option>
          </select>
          <input type="date" style={S.select} value={dueDate} onChange={e=>setDueDate(e.target.value)} />
          <button style={S.btnPrimary} onClick={add}>Add Task</button>
        </div>
      </div>
      <h3 style={{margin:"20px 0 8px",color:"#1a6b3c"}}>Pending ({pending.length})</h3>
      {pending.length===0 && <p style={{color:"#aaa",fontSize:14}}>All done! 🎉</p>}
      {pending.map(t=><TaskCard key={t.id} t={t} user={user} onToggle={toggle} onDel={del}/>)}
      <h3 style={{margin:"20px 0 8px",color:"#5cba8a"}}>Done ({done.length})</h3>
      {done.map(t=><TaskCard key={t.id} t={t} user={user} onToggle={toggle} onDel={del}/>)}
    </div>
  );
}
function TaskCard({t,user,onToggle,onDel}) {

function BabyCorner({user,babyVax,setBabyVax,babyDiet,setBabyDiet,babyHealth,setBabyHealth,babyMeds,setBabyMeds,showToast}) {

function BabyVax({babyVax,setBabyVax,showToast}) {
  const [editId, setEditId] = useState(null);
  const [customDate, setCustomDate] = useState("");
  const [customNotes, setCustomNotes] = useState("");
  const [showAdd, setShowAdd] = useState(false);
  const [newVax, setNewVax] = useState({name:"",due:"",dueDate:"",notes:""});
  const today = new Date().toISOString().slice(0,10);

  const done = babyVax.filter(v=>v.done).length;

  // Check upcoming due dates (within 30 days)
  const upcoming = babyVax.filter(v => !v.done && v.dueDate && (() => {
    const d = new Date(v.dueDate); const diff = (d - new Date()) / (1000*60*60*24);
    return diff >= 0 && diff <= 30;
  })());
  const overdue = babyVax.filter(v => !v.done && v.dueDate && new Date(v.dueDate) < new Date());

  const markDone = (id) => {
    const date = customDate || today;
    setBabyVax(babyVax.map(v => v.id===id ? {...v, done:true, date, notes:customNotes} : v));
    setEditId(null); setCustomDate(""); setCustomNotes("");
    showToast("Vaccination marked done! 💉");
  };

  const unmark = (id) => {
    setBabyVax(babyVax.map(v => v.id===id ? {...v, done:false, date:"", notes:""} : v));
    showToast("Unmarked!");
  };

  const addCustom = () => {
    if (!newVax.name.trim()) return;
    setBabyVax([...babyVax, { id:Date.now(), ...newVax, done:false, date:"" }]);
    setNewVax({name:"",due:"",dueDate:"",notes:""});
    setShowAdd(false);
    showToast("Vaccine added! 💉");
  };

  const del = (id) => setBabyVax(babyVax.filter(v=>v.id!==id));

  // Group: standard (0-18m), annual (2-5yr), custom
  const standard = babyVax.filter(v=>!v.isAnnual && !v.isCustom);
  const annual = babyVax.filter(v=>v.isAnnual);
  const custom = babyVax.filter(v=>v.isCustom);

  const VaxCard = ({v}) => (
    <div key={v.id} style={{...S.card, marginBottom:6, padding:"10px 14px",
      borderLeft:`4px solid ${v.done?"#5cba8a":overdue.find(x=>x.id===v.id)?"#c0392b":upcoming.find(x=>x.id===v.id)?"#c8962a":"#e0e0e0"}`}}>
      {editId===v.id ? (
        <div>
          <div style={{fontWeight:700,marginBottom:8,color:"#1a6b3c"}}>📅 Enter vaccination date for {v.name}</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}>
            <input type="date" style={S.select} value={customDate} onChange={e=>setCustomDate(e.target.value)} max={today}/>
            <input style={{...S.input,flex:2}} placeholder="Notes (doctor, clinic...)" value={customNotes} onChange={e=>setCustomNotes(e.target.value)}/>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button style={S.btnPrimary} onClick={()=>markDone(v.id)}>✅ Confirm Done</button>
            <button style={S.backBtn} onClick={()=>setEditId(null)}>Cancel</button>
          </div>
        </div>
      ) : (
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <input type="checkbox" checked={v.done} onChange={()=>v.done?unmark(v.id):setEditId(v.id)}
            style={{accentColor:"#5cba8a",width:18,height:18,flexShrink:0}}/>
          <div style={{flex:1}}>
            <div style={{fontWeight:600,textDecoration:v.done?"line-through":"none",fontSize:14,color:v.done?"#aaa":"#2d2d2d"}}>{v.name}</div>
            <div style={{fontSize:11,color:"#888",marginTop:2}}>
              {v.due && `Due: ${v.due}`}
              {v.dueDate && ` (${v.dueDate})`}
              {v.done && v.date && ` • ✅ Done: ${v.date}`}
              {v.notes && ` • ${v.notes}`}
            </div>
            {overdue.find(x=>x.id===v.id) && <span style={{...S.badge,background:"#fde8e8",color:"#c0392b",marginTop:4,display:"inline-block"}}>⚠️ Overdue!</span>}
            {upcoming.find(x=>x.id===v.id) && !v.done && <span style={{...S.badge,background:"#fff8e1",color:"#c8962a",marginTop:4,display:"inline-block"}}>🔔 Due soon!</span>}
          </div>
          {v.isCustom && <button onClick={()=>del(v.id)} style={S.delBtn}>✕</button>}
        </div>
      )}
    </div>
  );

  return (
    <div>
      {/* Progress */}
      <div style={{...S.card,marginBottom:12,display:"flex",gap:16,alignItems:"center"}}>
        <div><div style={{fontSize:22,fontWeight:800,color:"#5cba8a"}}>{done}/{babyVax.length}</div><div style={{fontSize:12,color:"#888"}}>Done</div></div>
        <div style={{flex:1,background:"#f0f0f0",borderRadius:8,height:10}}>
          <div style={{background:"#5cba8a",borderRadius:8,height:10,width:`${(done/babyVax.length)*100}%`,transition:"width 0.5s"}}/>
        </div>
        <button style={{...S.btnPrimary,fontSize:12,padding:"5px 12px"}} onClick={()=>setShowAdd(!showAdd)}>+ Add</button>
      </div>

      {/* Alerts */}
      {overdue.length>0 && (
        <div style={{background:"#fde8e8",border:"1.5px solid #c0392b",borderRadius:10,padding:"8px 14px",marginBottom:10}}>
          <div style={{fontWeight:700,color:"#c0392b",fontSize:13}}>⚠️ {overdue.length} vaccine(s) overdue!</div>
          <div style={{fontSize:12,color:"#555"}}>{overdue.map(v=>v.name).join(", ")}</div>
        </div>
      )}
      {upcoming.length>0 && (
        <div style={{background:"#fff8e1",border:"1.5px solid #c8962a",borderRadius:10,padding:"8px 14px",marginBottom:10}}>
          <div style={{fontWeight:700,color:"#c8962a",fontSize:13}}>🔔 Due within 30 days!</div>
          <div style={{fontSize:12,color:"#555"}}>{upcoming.map(v=>v.name).join(", ")}</div>
        </div>
      )}

      {/* Add custom vaccine form */}
      {showAdd && (
        <div style={{...S.card,marginBottom:12,border:"2px solid #c8962a"}}>
          <div style={{fontWeight:700,marginBottom:10,color:"#c8962a"}}>➕ Add Vaccine / Booster</div>

// ─── CHORES ───────────────────────────────────────────────────────────────────
function Chores({ user, chores, setChores, showToast }) {
  const [activeFreq, setActiveFreq] = useState("Daily");
  const [showAdd, setShowAdd] = useState(false);
  const [newChore, setNewChore] = useState({name:"",freq:"Daily",assignTo:"Both",icon:"🧹"});
  const FREQS = ["Daily","Weekly","Monthly","Quarterly"];
  const ICONS = ["🧹","🍽️","🧽","🧺","👕","🛏️","🚿","🪣","🧊","💡","❄️","🔥","🌿","🗑️","🛒","🔧","🐛","👶","🪟","🫧"];
  const FREQ_COLOR = {Daily:"#1a6b3c",Weekly:"#5b8dd9",Monthly:"#c8962a",Quarterly:"#9c6dd8"};

  const markDone = (id) => {
    const now = new Date().toLocaleDateString("en-US");
    setChores(chores.map(c=>c.id===id ? {...c, doneBy:user, doneAt:now, lastDone:now} : c));
    showToast("✅ Chore marked done!");
  };

  const resetChore = (id) => {
    setChores(chores.map(c=>c.id===id ? {...c, doneBy:"", doneAt:""} : c));
  };

  const addChore = () => {
    if (!newChore.name.trim()) return;
    setChores([...chores, {...newChore, id:Date.now(), doneBy:"", doneAt:"", lastDone:""}]);
    setNewChore({name:"",freq:"Daily",assignTo:"Both",icon:"🧹"});
    setShowAdd(false);
    showToast("Chore added! 🧹");
  };

  const delChore = (id) => setChores(chores.filter(c=>c.id!==id));

  const filtered = chores.filter(c=>c.freq===activeFreq &&
    (c.assignTo==="Both" || c.assignTo===user));
  const doneCount = filtered.filter(c=>c.doneBy).length;

  return (
    <div style={S.page}>
      <h2 style={S.pageTitle}>🧹 Household Chores</h2>

      {/* Frequency tabs */}
      <div style={{display:"flex",gap:6,marginBottom:16,flexWrap:"wrap"}}>
        {FREQS.map(f=>(
          <button key={f} onClick={()=>setActiveFreq(f)}
            style={{...S.tabBtn,flex:1,
              ...(activeFreq===f?{background:FREQ_COLOR[f],color:"#fff",fontWeight:700,border:`1.5px solid ${FREQ_COLOR[f]}`}:{})}}>
            {f==="Daily"?"🔁":f==="Weekly"?"📅":f==="Monthly"?"🗓️":"📆"} {f}
          </button>
        ))}
      </div>

      {/* Progress bar */}
      <div style={{...S.card,marginBottom:12,padding:"10px 16px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
          <span style={{fontSize:13,fontWeight:700,color:FREQ_COLOR[activeFreq]}}>{activeFreq} Progress</span>
          <span style={{fontSize:13,fontWeight:800,color:FREQ_COLOR[activeFreq]}}>{doneCount}/{filtered.length}</span>
        </div>
        <div style={{background:"#f0f0f0",borderRadius:8,height:10}}>
          <div style={{background:FREQ_COLOR[activeFreq],borderRadius:8,height:10,
            width:filtered.length?`${(doneCount/filtered.length)*100}%`:"0%",transition:"width 0.4s"}}/>
        </div>
        {doneCount===filtered.length && filtered.length>0 &&
          <div style={{fontSize:12,color:FREQ_COLOR[activeFreq],marginTop:6,fontWeight:700,textAlign:"center"}}>
            🎉 All {activeFreq} chores done!
          </div>
        }
      </div>

      {/* Chore list */}
      {filtered.map(c=>(
        <div key={c.id} style={{...S.card,marginBottom:8,
          opacity:c.doneBy?0.65:1,
          borderLeft:`4px solid ${c.doneBy?FREQ_COLOR[activeFreq]:"#e0e0e0"}`}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:24}}>{c.icon}</span>
            <div style={{flex:1}}>
              <div style={{fontWeight:600,fontSize:14,textDecoration:c.doneBy?"line-through":"none"}}>{c.name}</div>
              <div style={{fontSize:11,color:"#aaa",marginTop:2}}>
                👤 {c.assignTo}
                {c.doneBy && ` • ✅ Done by ${c.doneBy} on ${c.doneAt}`}
                {c.lastDone && !c.doneBy && ` • Last done: ${c.lastDone}`}
              </div>
            </div>
            <div style={{display:"flex",gap:6,flexShrink:0}}>
              {!c.doneBy
                ? <button style={{...S.btnPrimary,fontSize:12,padding:"5px 12px"}} onClick={()=>markDone(c.id)}>✓ Done</button>
                : <button style={{...S.backBtn,marginTop:0,fontSize:11}} onClick={()=>resetChore(c.id)}>↩ Undo</button>
              }
              <button onClick={()=>delChore(c.id)} style={S.delBtn}>✕</button>
            </div>
          </div>
        </div>
      ))}

      {filtered.length===0 && <p style={{color:"#aaa",fontSize:14,textAlign:"center",padding:24}}>No {activeFreq} chores assigned to you.</p>}

      {/* Add chore */}
      {!showAdd
        ? <button style={{...S.btnPrimary,width:"100%",marginTop:8}} onClick={()=>setShowAdd(true)}>+ Add Custom Chore</button>
        : (
          <div style={{...S.card,marginTop:8,border:"2px solid #c8962a"}}>
            <div style={{fontWeight:700,marginBottom:10,color:"#c8962a"}}>+ New Chore</div>
            <input style={{...S.input,marginBottom:8}} placeholder="Chore name..." value={newChore.name} onChange={e=>setNewChore({...newChore,name:e.target.value})} />
            <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}>
              <select style={S.select} value={newChore.freq} onChange={e=>setNewChore({...newChore,freq:e.target.value})}>
                {FREQS.map(f=><option key={f}>{f}</option>)}
              </select>
              <select style={S.select} value={newChore.assignTo} onChange={e=>setNewChore({...newChore,assignTo:e.target.value})}>
                <option>Both</option><option>Minal</option><option>Piyush</option>
              </select>
              <select style={S.select} value={newChore.icon} onChange={e=>setNewChore({...newChore,icon:e.target.value})}>
                {ICONS.map(i=><option key={i} value={i}>{i}</option>)}
              </select>
            </div>
            <div style={{display:"flex",gap:8}}>
              <button style={S.btnPrimary} onClick={addChore}>Add</button>
              <button style={S.backBtn} onClick={()=>setShowAdd(false)}>Cancel</button>
            </div>
          </div>
        )
      }
    </div>
  );
}

function HealthTracker({ user, health, setHealth, showToast }) {
  const [selPerson, setSelPerson] = useState(user);
  const [tab, setTab] = useState("vitals");

  const personHealth = health.filter(h=>h.person===selPerson);
  const setPersonHealth = (person, newData) => {
    setHealth([...health.filter(h=>h.person!==person), ...newData.map(d=>({...d,person}))]);
  };

  const TABS = [
    {id:"vitals",   l:"📊 Vitals"},
    {id:"periods",  l:"🌸 Periods", minalOnly:true},
    {id:"meds",     l:"💊 Medicines"},
    {id:"doctor",   l:"👨‍⚕️ Doctor"},
    {id:"sleep",    l:"😴 Sleep"},
  ];

  const visibleTabs = TABS.filter(t=>!t.minalOnly || selPerson==="Minal");

  return (
    <div style={S.page}>
      <h2 style={S.pageTitle}>💪 Health Tracker</h2>

      {/* Person selector */}
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        {["Minal","Piyush"].map(p=>(
          <button key={p} onClick={()=>{setSelPerson(p);setTab("vitals");}}
            style={{...S.tabBtn,flex:1,...(selPerson===p?S.tabBtnActive:{})}}>
            {p==="Minal"?"👩":"👨"} {p}
          </button>
        ))}
      </div>

      {/* Sub tabs */}
      <div style={{display:"flex",gap:6,marginBottom:16,overflowX:"auto",paddingBottom:4}}>
        {visibleTabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)}
            style={{...S.tabBtn,whiteSpace:"nowrap",flexShrink:0,...(tab===t.id?S.tabBtnActive:{})}}>
            {t.l}
          </button>
        ))}
      </div>

      {tab==="vitals" && <HealthVitals person={selPerson} data={personHealth.filter(h=>h.cat==="vitals")}
        setData={d=>setPersonHealth(selPerson,[...personHealth.filter(h=>h.cat!=="vitals"),...d])} showToast={showToast} />}
      {tab==="periods" && selPerson==="Minal" && <HealthPeriods data={personHealth.filter(h=>h.cat==="periods")}
        setData={d=>setPersonHealth(selPerson,[...personHealth.filter(h=>h.cat!=="periods"),...d])} showToast={showToast} />}
      {tab==="meds" && <HealthMeds person={selPerson} data={personHealth.filter(h=>h.cat==="meds")}
        setData={d=>setPersonHealth(selPerson,[...personHealth.filter(h=>h.cat!=="meds"),...d])} showToast={showToast} />}
      {tab==="doctor" && <HealthDoctor person={selPerson} data={personHealth.filter(h=>h.cat==="doctor")}
        setData={d=>setPersonHealth(selPerson,[...personHealth.filter(h=>h.cat!=="doctor"),...d])} showToast={showToast} />}
      {tab==="sleep" && <HealthSleep person={selPerson} data={personHealth.filter(h=>h.cat==="sleep")}
        setData={d=>setPersonHealth(selPerson,[...personHealth.filter(h=>h.cat!=="sleep"),...d])} showToast={showToast} />}
    </div>
  );
}

function HealthVitals({ person, data, setData, showToast }) {
  const [type, setType] = useState("Weight");
  const [val, setVal] = useState(""); const [val2, setVal2] = useState("");
  const [height, setHeight] = useState(""); const [date, setDate] = useState("");
  const TYPES = ["Weight","Blood Pressure","Blood Sugar (Fasting)","Blood Sugar (PP)","BMI"];
  const UNIT = {Weight:"kg","Blood Pressure":"mmHg","Blood Sugar (Fasting)":"mg/dL","Blood Sugar (PP)":"mg/dL",BMI:""};

  const add = () => {
    if (!val.trim()) return;
    let display = val + (UNIT[type]?" "+UNIT[type]:"");
    if (type==="Blood Pressure" && val2) display = val+"/"+val2+" mmHg";
    // Auto BMI
    let extra = {};
    if (type==="Weight" && height) {
      const bmi = (parseFloat(val) / Math.pow(parseFloat(height)/100, 2)).toFixed(1);
      extra = {bmi, height};
    }
    const entry = {id:Date.now(), cat:"vitals", type, value:display, rawVal:val, val2, date:date||new Date().toLocaleDateString("en-US"), ...extra};
    setData([...data, entry]);
    setVal(""); setVal2(""); setDate(""); showToast(`${type} recorded! 📊`);
  };

  const del = id => setData(data.filter(d=>d.id!==id));
  const recent = [...data].sort((a,b)=>b.id-a.id).slice(0,10);

  // Normal ranges
  const getStatus = (item) => {
    if (item.type==="Weight") return null;
    if (item.type==="Blood Pressure") {
      const sys = parseInt(item.rawVal); const dia = parseInt(item.val2);
      if (sys<120&&dia<80) return {l:"Normal",c:"#1a6b3c"};
      if (sys<130&&dia<80) return {l:"Elevated",c:"#c8962a"};
      return {l:"High",c:"#c0392b"};
    }
    if (item.type==="Blood Sugar (Fasting)") {
      const v=parseFloat(item.rawVal);
      if (v<100) return {l:"Normal",c:"#1a6b3c"};
      if (v<126) return {l:"Pre-diabetic",c:"#c8962a"};
      return {l:"High",c:"#c0392b"};
    }
    if (item.type==="Blood Sugar (PP)") {
      const v=parseFloat(item.rawVal);
      if (v<140) return {l:"Normal",c:"#1a6b3c"};
      if (v<200) return {l:"Pre-diabetic",c:"#c8962a"};
      return {l:"High",c:"#c0392b"};
    }
    if (item.bmi) {
      const b=parseFloat(item.bmi);
      if (b<18.5) return {l:"Underweight",c:"#5b8dd9"};
      if (b<25) return {l:"Normal",c:"#1a6b3c"};
      if (b<30) return {l:"Overweight",c:"#c8962a"};
      return {l:"Obese",c:"#c0392b"};
    }
    return null;
  };

  return (
    <div>
      <div style={S.card}>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end"}}>
          <select style={S.select} value={type} onChange={e=>setType(e.target.value)}>
            {TYPES.map(t=><option key={t}>{t}</option>)}
          </select>
          <div style={{display:"flex",gap:6,flex:1}}>
            <input style={{...S.input,flex:1}} placeholder={type==="Blood Pressure"?"Systolic":UNIT[type]||"Value"} value={val} onChange={e=>setVal(e.target.value)} />
            {type==="Blood Pressure" && <input style={{...S.input,flex:1}} placeholder="Diastolic" value={val2} onChange={e=>setVal2(e.target.value)} />}
          </div>
          {type==="Weight" && <input style={{...S.input,width:100}} placeholder="Height cm" value={height} onChange={e=>setHeight(e.target.value)} />}
          <input type="date" style={S.select} value={date} onChange={e=>setDate(e.target.value)} />
          <button style={S.btnPrimary} onClick={add}>Add</button>
        </div>
      </div>
      <div style={{marginTop:10}}>
        {recent.map(item=>{
          const status = getStatus(item);
          return (
            <div key={item.id} style={{...S.card,marginBottom:6,padding:"9px 14px",display:"flex",gap:10,alignItems:"center"}}>
              <span style={{fontSize:20}}>{item.type==="Weight"?"⚖️":item.type==="Blood Pressure"?"❤️":item.type.includes("Sugar")?"🩸":"📊"}</span>
              <div style={{flex:1}}>
                <div style={{fontWeight:700,fontSize:14}}>{item.type}</div>
                <div style={{fontSize:15,color:"#1a6b3c",fontWeight:800}}>{item.value}
                  {item.bmi && <span style={{fontSize:12,color:"#888",fontWeight:400}}> • BMI: {item.bmi}</span>}
                </div>
                <div style={{fontSize:11,color:"#aaa"}}>{item.date}</div>
              </div>
              {status && <span style={{...S.badge,background:status.c+"22",color:status.c}}>{status.l}</span>}
              <button onClick={()=>del(item.id)} style={S.delBtn}>✕</button>
            </div>
          );
        })}
        {data.length===0 && <p style={{color:"#aaa",fontSize:14}}>No vitals recorded yet.</p>}
      </div>
    </div>
  );
}

function HealthPeriods({ data, setData, showToast }) {
  const [startDate, setStartDate] = useState(""); const [endDate, setEndDate] = useState("");
  const [flow, setFlow] = useState("Medium"); const [notes, setNotes] = useState("");

  const add = () => {
    if (!startDate) return;
    setData([...data, {id:Date.now(), cat:"periods", startDate, endDate, flow, notes, addedAt:new Date().toLocaleDateString("en-US")}]);
    setStartDate(""); setEndDate(""); setNotes("");
    showToast("Period logged! 🌸");
  };
  const del = id => setData(data.filter(d=>d.id!==id));

  // Predict next cycle (avg 28 days)
  const sorted = [...data].sort((a,b)=>new Date(b.startDate)-new Date(a.startDate));
  let nextPrediction = null;
  if (sorted.length>=2) {
    const gaps = [];
    for (let i=0;i<sorted.length-1;i++) {
      gaps.push((new Date(sorted[i].startDate)-new Date(sorted[i+1].startDate))/(1000*60*60*24));
    }
    const avgCycle = Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length);
    const next = new Date(sorted[0].startDate);
    next.setDate(next.getDate()+avgCycle);
    nextPrediction = {date:next.toLocaleDateString("en-US"), cycle:avgCycle};
  }

  return (
    <div>
      {nextPrediction && (
        <div style={{...S.card,marginBottom:12,borderLeft:"4px solid #e91e8c",background:"#fff0f7"}}>
          <div style={{fontWeight:700,color:"#e91e8c"}}>🌸 Next Period Prediction</div>
          <div style={{fontSize:15,fontWeight:800,color:"#2d2d2d",marginTop:4}}>{nextPrediction.date}</div>
          <div style={{fontSize:12,color:"#888"}}>Average cycle: {nextPrediction.cycle} days</div>
        </div>
      )}
      <div style={S.card}>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <div style={{flex:1}}>
            <label style={{fontSize:12,color:"#888"}}>Start Date</label>
            <input type="date" style={{...S.select,width:"100%",marginTop:4,boxSizing:"border-box"}} value={startDate} onChange={e=>setStartDate(e.target.value)} />
          </div>
          <div style={{flex:1}}>
            <label style={{fontSize:12,color:"#888"}}>End Date</label>
            <input type="date" style={{...S.select,width:"100%",marginTop:4,boxSizing:"border-box"}} value={endDate} onChange={e=>setEndDate(e.target.value)} />
          </div>
          <select style={S.select} value={flow} onChange={e=>setFlow(e.target.value)}>
            <option>Light</option><option>Medium</option><option>Heavy</option>
          </select>
          <input style={{...S.input,flex:2}} placeholder="Notes (cramps, mood...)" value={notes} onChange={e=>setNotes(e.target.value)} />
          <button style={S.btnPrimary} onClick={add}>Log</button>
        </div>
      </div>
      <div style={{marginTop:10}}>
        {sorted.map(p=>(
          <div key={p.id} style={{...S.card,marginBottom:6,padding:"9px 14px",display:"flex",gap:10,alignItems:"center",borderLeft:"4px solid #e91e8c"}}>
            <span style={{fontSize:20}}>🌸</span>
            <div style={{flex:1}}>
              <div style={{fontWeight:700}}>{p.startDate} {p.endDate&&`→ ${p.endDate}`}</div>
              <div style={{fontSize:12,color:"#888"}}>Flow: {p.flow} {p.notes&&`• ${p.notes}`}</div>
            </div>
            <button onClick={()=>del(p.id)} style={S.delBtn}>✕</button>
          </div>
        ))}
        {data.length===0 && <p style={{color:"#aaa",fontSize:14}}>No periods logged yet.</p>}
      </div>
    </div>
  );
}

function HealthMeds({ person, data, setData, showToast }) {
  const [name,setName]=useState(""); const [dose,setDose]=useState(""); const [freq,setFreq]=useState("Daily");
  const [time,setTime]=useState(""); const [notes,setNotes]=useState("");
  const add = () => {
    if (!name.trim()) return;
    setData([...data,{id:Date.now(),cat:"meds",name,dose,freq,time,notes,active:true,log:[]}]);
    setName(""); setDose(""); setNotes(""); showToast("Medicine added! 💊");
  };
  const toggle = id => setData(data.map(m=>m.id===id?{...m,active:!m.active}:m));
  const logDose = id => {
    setData(data.map(m=>m.id===id?{...m,log:[...m.log,new Date().toLocaleString("en-US")]}:m));
    showToast("Dose logged! ✅");
  };
  const del = id => setData(data.filter(d=>d.id!==id));
  return (
    <div>
      <div style={S.card}>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <input style={{...S.input,flex:2}} placeholder="Medicine / Supplement name..." value={name} onChange={e=>setName(e.target.value)} />
          <input style={{...S.input,flex:1}} placeholder="Dose (e.g. 500mg)" value={dose} onChange={e=>setDose(e.target.value)} />
          <select style={S.select} value={freq} onChange={e=>setFreq(e.target.value)}>
            <option>Daily</option><option>Twice Daily</option><option>Weekly</option><option>As needed</option>
          </select>
          <input type="time" style={S.select} value={time} onChange={e=>setTime(e.target.value)} />
          <input style={{...S.input,flex:2}} placeholder="Notes..." value={notes} onChange={e=>setNotes(e.target.value)} />
          <button style={S.btnPrimary} onClick={add}>Add</button>
        </div>
      </div>
      <div style={{marginTop:10}}>
        {data.map(m=>(
          <div key={m.id} style={{...S.card,marginBottom:8,opacity:m.active?1:0.5}}>
            <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
              <span style={{fontSize:22}}>💊</span>
              <div style={{flex:1}}>
                <div style={{fontWeight:700}}>{m.name} {m.dose&&<span style={{fontSize:12,color:"#888",fontWeight:400}}>({m.dose})</span>}</div>
                <div style={{fontSize:12,color:"#888"}}>{m.freq}{m.time&&` • ${m.time}`}</div>
                {m.notes&&<div style={{fontSize:12,color:"#666"}}>{m.notes}</div>}
                {m.log.length>0&&<div style={{fontSize:11,color:"#aaa"}}>Last taken: {m.log[m.log.length-1]}</div>}
              </div>
              <div style={{display:"flex",gap:6,flexShrink:0}}>
                {m.active&&<button style={{...S.btnPrimary,fontSize:11,padding:"4px 10px"}} onClick={()=>logDose(m.id)}>✓ Taken</button>}
                <button style={{...S.backBtn,marginTop:0,fontSize:11}} onClick={()=>toggle(m.id)}>{m.active?"Stop":"Resume"}</button>
                <button onClick={()=>del(m.id)} style={S.delBtn}>✕</button>
              </div>
            </div>
          </div>
        ))}
        {data.length===0&&<p style={{color:"#aaa",fontSize:14}}>No medicines added.</p>}
      </div>
    </div>
  );
}

    if (!doctor.trim()||!date) return;

    setDoctor(""); setReason(""); setDate(""); setNotes(""); setNextDate("");
