// ─── TOAST ────────────────────────────────────────────────────────────────────
function Toast({ msg, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, []);
  const isAlert = msg.startsWith("⚠️");
  return (
    <div style={{
      position:"fixed", bottom:24, left:"50%", transform:"translateX(-50%)",
      background: isAlert ? "#c0392b" : "#2d2d2d", color:"#fff",
      padding:"10px 22px", borderRadius:24, fontSize:14, zIndex:9999,
      boxShadow:"0 4px 20px #0003", whiteSpace:"nowrap", maxWidth:"90vw", textAlign:"center"
    }}>{msg}</div>
  );
}

// ─── LOGIN ────────────────────────────────────────────────────────────────────
function LoginScreen({ onLogin }) {
  const [user, setUser] = useState(null);
  const [pin, setPin] = useState("");
  const [err, setErr] = useState("");

  const handlePin = (d) => {
    if (d === "⌫") { setPin(p => p.slice(0,-1)); return; }
    const np = pin + d;
    setPin(np);
    if (np.length === 4) {
      if (PINS[user] === np) { onLogin(user); }
      else { setErr("Wrong PIN, try again"); setTimeout(() => { setPin(""); setErr(""); }, 800); }
    }
  };

  if (!user) return (
    <div style={S.loginWrap}>
      <div style={S.loginCard}>
        <div style={{fontSize:52,marginBottom:4}}>🏠</div>
        <h1 style={S.loginTitle}>Family Hub</h1>
        <p style={S.loginSub}>Minal & Piyush's Home Command Centre</p>
        <div style={{display:"flex",gap:16,marginTop:28}}>
          {["Minal","Piyush","Sahil"].map(u => (
            <button key={u} style={S.personaBtn} onClick={() => setUser(u)}>
              <span style={{fontSize:36}}>{u==="Minal"?"👩":u==="Piyush"?"👨":"👦"}</span>
              <span style={{fontWeight:700,marginTop:6}}>{u}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );

  return (
    <div style={S.loginWrap}>
      <div style={S.loginCard}>
        <div style={{fontSize:48,marginBottom:8}}>{user==="Minal"?"👩":"👨"}</div>
        <h2 style={{margin:"0 0 4px",fontFamily:"Poppins,sans-serif",color:"#2d2d2d"}}>Welcome, {user}! 👋</h2>
        <p style={{color:"#888",fontSize:14,margin:"0 0 24px"}}>Enter your 4-digit PIN</p>

// ─── ADD INGREDIENT INLINE ────────────────────────────────────────────────────
function AddIngredientInline({ ingr, setIngr }) {
  const [val, setVal] = useState("");
  const add = () => {
    if (!val.trim()) return;
    setIngr(ingr ? ingr + ", " + val.trim() : val.trim());
    setVal("");
  };
  return (
    <div style={{display:"flex",gap:6,marginTop:8}}>
      <input
        style={{flex:1,border:"1px solid #c5e0cc",borderRadius:6,padding:"4px 10px",fontSize:12,fontFamily:"Poppins,sans-serif",outline:"none",background:"#fff"}}
        placeholder="Add ingredient..."
        value={val}
        onChange={e=>setVal(e.target.value)}
        onKeyDown={e=>e.key==="Enter"&&add()}
      />
      <button onClick={add} style={{background:"#1a6b3c",color:"#fff",border:"none",borderRadius:6,padding:"4px 12px",fontSize:12,cursor:"pointer",fontFamily:"Poppins,sans-serif"}}>+ Add</button>
    </div>
  );
}

  const fetchIngredients = async (dish, setIngr, setLoading) => {
    if (!dish.trim()) { showToast("Please enter a dish name first!"); return; }
    setLoading(true);
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          model:"claude-sonnet-4-20250514",
          max_tokens:300,
          messages:[{
            role:"user",
            content:`List the main ingredients for making "${dish}" (Indian home cooking style). Return ONLY a comma-separated list of ingredient names, nothing else. Example format: onion, tomato, garlic, cumin seeds, oil, salt. Keep it concise — 6 to 12 ingredients max.`
          }]
        })
      });
      const data = await res.json();
      const text = data.content?.[0]?.text || "";
      setIngr(text.trim());
      showToast(`✅ Ingredients fetched for ${dish}!`);
    } catch(e) {
      showToast("Could not fetch ingredients. Try again.");

      status: existing?.status || "pending",

      savedAt: new Date().toLocaleString("en-IN")
    };
    const updated = existing ? menus.map(m=>m.id===existing.id?entry:m) : [...menus,entry];
    setMenus(updated);
    showToast("Menu saved! 🍽️ Sent to Piyush for approval.");
    checkAndAlertIngredients(allIngredients);

  const checkAndAlertIngredients = (ingredients) => {

      return !inPantry;
    });
    if (missing.length>0) showToast(`⚠️ ${missing.length} ingredients not at home: ${missing.slice(0,3).join(", ")}${missing.length>3?"...":""}`);

  const respondMenu = (id, status, cmt) => {
    setMenus(menus.map(m=>m.id===id?{...m,status,comment:cmt}:m));
    showToast(status==="approved"?"✅ Menu approved!":"❌ Menu rejected with comment.");
    setComment("");
  };

    const missing = (menu.allIngredients||[]).filter(ing => {

function Budget({user,budget,setBudget,fund,setFund,showToast}) {
  const [tab, setTab] = useState("fund");
  const [desc,setDesc]=useState(""); const [amt,setAmt]=useState(""); 
  const [type,setType]=useState("Expense"); const [cat,setCat]=useState("Groceries");
  const [source,setSource]=useState("Manual");
  const [scanning,setScanning]=useState(false);
  const [scannedItems,setScannedItems]=useState([]);
  const [selMonth,setSelMonth]=useState(new Date().toISOString().slice(0,7));

  // Fund helpers
  const fundBalance = (fund?.minal||0) + (fund?.piyush||0);
  const thisMonth = new Date().toISOString().slice(0,7);

  const contribute = (person, amount) => {
    if (!amount || isNaN(amount)) return;
    const amt2 = parseFloat(amount);
    const contrib = { id:Date.now(), person, amount:amt2, date:new Date().toISOString().slice(0,10), month:thisMonth, type:"contribution" };
    const updated = {
      ...fund,
      [person]: (fund?.[person]||0) + amt2,
      contributions: [...(fund?.contributions||[]), contrib]
    };
    setFund(updated);
    showToast(`✅ ₹${amt2} added by ${person}!`);
  };

  const spendFromFund = (desc2, amount2, cat2) => {
    if (!desc2.trim() || !amount2) return;
    const amt2 = parseFloat(amount2);
    if (amt2 > fundBalance) { showToast("⚠️ Insufficient fund balance!"); return; }
    const exp = { id:Date.now(), desc:desc2, amount:amt2, cat:cat2, date:new Date().toISOString().slice(0,10), month:thisMonth, by:user };
    // Deduct proportionally from both
    const ratio = fundBalance > 0 ? amt2/fundBalance : 0.5;
    const minalDeduct = Math.min(fund?.minal||0, amt2 * ((fund?.minal||0)/fundBalance));
    const piyushDeduct = amt2 - minalDeduct;
    const updated = {
      ...fund,
      minal: Math.max(0, (fund?.minal||0) - minalDeduct),
      piyush: Math.max(0, (fund?.piyush||0) - piyushDeduct),
      expenses: [...(fund?.expenses||[]), exp]
    };
    setFund(updated);
    // Also add to main budget
    setBudget([...budget, { id:Date.now()+1, desc:desc2, amt:amt2, type:"Expense", cat:cat2, source:"Household Fund", by:user, date:new Date().toISOString().slice(0,10) }]);
    showToast(`💸 ₹${amt2} spent from fund!`);
  };

  const [contribAmt, setContribAmt] = useState("");
  const [fundDesc, setFundDesc] = useState("");
  const [fundAmt, setFundAmt] = useState("");
  const [fundCat, setFundCat] = useState("Groceries");

  const cats=["Groceries","Vegetables & Fruits","Baby Products","Household","Medical","School","Dairy","Snacks & Drinks","Personal Care","Kitchen","Electronics","Clothing","Travel","Entertainment","Other"];
  const sources=["Manual","Blinkit","Amazon","Big Basket","Zepto","Other Online"];
  const sourceIcon={"Blinkit":"🟡","Amazon":"📦","Big Basket":"🛒","Zepto":"⚡","Manual":"✍️","Other Online":"🌐"};

  const add=()=>{
    if(!desc.trim()||!amt)return;
    setBudget([...budget,{id:Date.now(),desc:desc.trim(),amt:parseFloat(amt),type,cat,source,by:user,date:new Date().toISOString().slice(0,10)}]);
    setDesc(""); setAmt(""); showToast("Entry added! 💰");
  };

  const del=id=>setBudget(budget.filter(b=>b.id!==id));

  const addScannedItems = () => {
    const newEntries = scannedItems.filter(i=>i.selected&&i.name&&i.amount).map(i=>({
      id:Date.now()+Math.random(),
      desc:i.name, amt:parseFloat(i.amount),
      type:"Expense", cat:i.category, source:i.source||"Manual",
      by:user, date:new Date().toISOString().slice(0,10)
    }));
    setBudget([...budget,...newEntries]);
    setScannedItems([]);
    showToast(`✅ ${newEntries.length} items added to budget!`);
    setTab("add");
  };

  const scanReceipt = async (file) => {
    setScanning(true);
    setScannedItems([]);
    try {
      const base64 = await new Promise((res,rej)=>{
        const r = new FileReader();
        r.onload = () => res(r.result.split(",")[1]);
        r.onerror = rej;
        r.readAsDataURL(file);
      });

      const detectedSource = file.name.toLowerCase().includes("blinkit")?"Blinkit":
        file.name.toLowerCase().includes("amazon")?"Amazon":
        file.name.toLowerCase().includes("zepto")?"Zepto":
        file.name.toLowerCase().includes("bigbasket")?"Big Basket":"Manual";

      const res = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-20250514",
          max_tokens:1500,
          messages:[{
            role:"user",
            content:[
              {type:"image",source:{type:"base64",media_type:file.type||"image/jpeg",data:base64}},
              {type:"text",text:`This is a shopping receipt or bill (possibly from Blinkit, Amazon, or other app). Extract all items with their prices.

Return ONLY a JSON array like this:
[
  {"name":"Amul Milk 1L","amount":"68","category":"Dairy","source":"Blinkit"},
  {"name":"Pampers Diapers","amount":"450","category":"Baby Products","source":"Blinkit"}
]

Categories to use: Groceries, Vegetables & Fruits, Baby Products, Household, Medical, Dairy, Snacks & Drinks, Personal Care, Kitchen, Electronics, Clothing, Other
If you see a total/delivery charge/discount, include as separate items.
Return ONLY the JSON array, no other text.`}
            ]
          }]
        })
      });

      const data = await res.json();
      const text = data.content?.[0]?.text||"[]";
      const clean = text.replace(/```json|```/g,"").trim();
      const items = JSON.parse(clean);
      setScannedItems(items.map((it,i)=>({...it,id:i,selected:true,source:it.source||detectedSource})));
      showToast(`✅ Found ${items.length} items! Review and add.`);
    } catch(e) {
      showToast("Could not read receipt. Try a clearer photo.");
    }
    setScanning(false);
  };

  // Monthly analytics
  const thisMonthBudget = budget.filter(b=>b.date&&b.date.startsWith(selMonth));
  const income = budget.filter(b=>b.type==="Income").reduce((s,b)=>s+b.amt,0);
  const expense = budget.filter(b=>b.type==="Expense").reduce((s,b)=>s+b.amt,0);

// ─── SCHEDULE ─────────────────────────────────────────────────────────────────
function Schedule({user,schedule,setSchedule,showToast}) {
  const [title,setTitle]=useState(""); const [date,setDate]=useState(""); const [time,setTime]=useState("");
  const [type,setType]=useState("General"); const [assignTo,setAssignTo]=useState("Both");
  const typeColor={General:"#5b8dd9",Baby:"#e8a838",Medical:"#5cba8a",School:"#9c6dd8",Reminder:"#c8962a"};
  const add=()=>{
    if(!title.trim()||!date)return;
    setSchedule([...schedule,{id:Date.now(),title:title.trim(),date,time,type,assignTo,by:user}]);
    setTitle(""); setDate(""); setTime(""); showToast("Schedule added! 📅");
  };
  const del=id=>setSchedule(schedule.filter(s=>s.id!==id));
  const today=new Date().toISOString().slice(0,10);
  const sorted=[...schedule].sort((a,b)=>a.date>b.date?1:-1);
  const upcoming=sorted.filter(s=>s.date>=today);
  const past=sorted.filter(s=>s.date<today);
  return (
    <div style={S.page}>
      <h2 style={S.pageTitle}>📅 Schedule & Reminders</h2>
      <div style={S.card}>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <input style={{...S.input,flex:2}} placeholder="Event/Reminder..." value={title} onChange={e=>setTitle(e.target.value)}/>
          <input type="date" style={S.select} value={date} onChange={e=>setDate(e.target.value)}/>
          <input type="time" style={S.select} value={time} onChange={e=>setTime(e.target.value)}/>
          <select style={S.select} value={type} onChange={e=>setType(e.target.value)}>{Object.keys(typeColor).map(t=><option key={t}>{t}</option>)}</select>
          <select style={S.select} value={assignTo} onChange={e=>setAssignTo(e.target.value)}><option>Both</option><option>Minal</option><option>Piyush</option></select>
          <button style={S.btnPrimary} onClick={add}>Add</button>
        </div>
      </div>
      <h3 style={{margin:"20px 0 8px",color:"#5b8dd9"}}>Upcoming ({upcoming.length})</h3>
      {upcoming.length===0&&<p style={{color:"#aaa",fontSize:14}}>No upcoming events.</p>}
      {upcoming.map(s=>(
        <div key={s.id} style={{...S.card,marginBottom:6,borderLeft:`4px solid ${typeColor[s.type]||"#ccc"}`}}>
          <div style={{display:"flex",justifyContent:"space-between"}}>
            <div>
              <div style={{fontWeight:700}}>{s.title}</div>
              <div style={{fontSize:12,color:"#888",marginTop:2}}>📅 {s.date}{s.time&&` • ⏰ ${s.time}`} • 👤 {s.assignTo}</div>
            </div>
            <button onClick={()=>del(s.id)} style={S.delBtn}>✕</button>
          </div>
        </div>
      ))}
    </div>
  );
}

const MAID_TYPES = [
  { val:'babysitter', label:'👶 Baby Sitting', trackHours:true, trackMeals:false },
  { val:'cook',       label:'🍳 Cook',         trackHours:false, trackMeals:true },
  { val:'cleaner',    label:'🧹 Cleaning',     trackHours:false, trackMeals:false },
  { val:'other',      label:'🏠 Other',        trackHours:false, trackMeals:false },
];

function MaidManagement({ maids, setMaids, showToast }) {
  const [selMaid, setSelMaid] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState({ name:"", phone:"", type:"cleaner", salary:"", joiningDate:"", workDays:"Mon-Sat", notes:"", changeReason:"" });
  const today = new Date().toISOString().slice(0,10);
  const thisMonth = new Date().toISOString().slice(0,7);

  const resetForm = () => setForm({ name:"", phone:"", type:"cleaner", salary:"", joiningDate:"", workDays:"Mon-Sat", notes:"", changeReason:"" });

  const openAdd = () => { resetForm(); setEditingId(null); setShowForm(true); };
  const openEdit = (m) => { setForm({ name:m.name, phone:m.phone||"", type:m.type||"cleaner", salary:m.salary, joiningDate:m.joiningDate||"", workDays:m.workDays||"Mon-Sat", notes:m.notes||"", changeReason:"" }); setEditingId(m.id); setShowForm(true); };

  const saveMaid = () => {
    if (!form.name.trim()) { showToast("Name required!"); return; }
    if (editingId) {
      const existing = maids.find(m=>m.id===editingId);
      const salaryChanged = existing && parseFloat(existing.salary) !== parseFloat(form.salary);
      const typeChanged = existing && existing.type !== form.type;
      // Track rate change in history
      const rateChange = (salaryChanged||typeChanged) ? {
        id: Date.now(),
        date: today,
        oldSalary: existing.salary,
        newSalary: form.salary,
        oldType: existing.type,
        newType: form.type,
        reason: form.changeReason || "Updated",
        changedOn: today
      } : null;
      const rateHistory = rateChange ? [...(existing.rateHistory||[]), rateChange] : (existing.rateHistory||[]);
      setMaids(maids.map(m => m.id===editingId ? { ...m, ...form, rateHistory } : m));
      showToast(salaryChanged ? `✅ Salary updated: ₹${existing.salary} → ₹${form.salary}` : "Maid updated! ✅");
    } else {
      setMaids([...maids, {
        id:Date.now(), ...form, active:true,
        attendance:{}, leaves:[], advances:[], salaryHistory:[], rateHistory:[
          { id:Date.now(), date:today, oldSalary:"", newSalary:form.salary, oldType:"", newType:form.type, reason:"Joining", changedOn:today }
        ]
      }]);
      showToast(`${form.name} added! 🧽`);
    }
    setShowForm(false); resetForm(); setEditingId(null);
  };

  const deleteMaid = (id, name) => {
    if (!window.confirm(`Delete ${name}? All records will be lost.`)) return;
    setMaids(maids.filter(m => m.id!==id));
    if (selMaid===id) setSelMaid(null);
    showToast("Maid removed.");
  };

  const toggleActive = (id) => setMaids(maids.map(m => m.id===id ? {...m, active:!m.active} : m));
  const updateMaid = (id, updates) => setMaids(maids.map(m => m.id===id ? {...m,...updates} : m));

  const getMonthStats = (maid) => {
    const att = maid.attendance || {};
    const monthDays = Object.keys(att).filter(d => d.startsWith(thisMonth));
    const present = monthDays.filter(d => att[d]?.status==="present").length;
    const absent  = monthDays.filter(d => att[d]?.status==="absent").length;
    const half    = monthDays.filter(d => att[d]?.status==="half").length;
    const totalHours = monthDays.reduce((s,d) => s + (parseFloat(att[d]?.hours)||0), 0);
    const totalMeals = monthDays.reduce((s,d) => s + (parseInt(att[d]?.meals)||0), 0);
    return { present, absent, half, totalHours, totalMeals };
  };

  const calcSalary = (maid) => {
    const stats = getMonthStats(maid);
    const base = parseFloat(maid.salary)||0;
    const perDay = base/26;
    const earned = Math.round((stats.present * perDay) + (stats.half * perDay * 0.5));
    const advance = (maid.advances||[]).filter(a=>a.month===thisMonth).reduce((s,a)=>s+parseFloat(a.amount||0),0);
    return { earned, advance, net: earned - advance };
  };

  const markAttendance = (maidId, date, field, value) => {
    const m = maids.find(x=>x.id===maidId);
    const existing = (m.attendance||{})[date] || {};
    const updated = { ...(m.attendance||{}), [date]: { ...existing, [field]: value } };
    updateMaid(maidId, { attendance: updated });
  };

  if (selMaid) {
    const m = maids.find(x=>x.id===selMaid);
    if (!m) { setSelMaid(null); return null; }
    return <MaidDetail maid={m} onBack={()=>setSelMaid(null)} onEdit={()=>openEdit(m)} onDelete={()=>deleteMaid(m.id,m.name)} updateMaid={updateMaid} showToast={showToast} today={today} thisMonth={thisMonth} getMonthStats={getMonthStats} calcSalary={calcSalary} markAttendance={markAttendance} />;
  }

  return (
    <div style={S.page}>
      <h2 style={S.pageTitle}>🧽 Maid Management</h2>

      {/* Summary */}
      <div style={{display:"flex",gap:10,marginBottom:16}}>
        <div style={{...S.card,flex:1,textAlign:"center",borderTop:"3px solid #1a6b3c"}}>
          <div style={{fontSize:20,fontWeight:800,color:"#1a6b3c"}}>{maids.filter(m=>m.active).length}</div>
          <div style={{fontSize:11,color:"#888"}}>Active</div>
        </div>
        <div style={{...S.card,flex:1,textAlign:"center",borderTop:"3px solid #c8962a"}}>
          <div style={{fontSize:18,fontWeight:800,color:"#c8962a"}}>
            ₹{maids.filter(m=>m.active).reduce((s,m)=>s+calcSalary(m).net,0).toLocaleString()}
          </div>
          <div style={{fontSize:11,color:"#888"}}>Net Payable</div>
        </div>
      </div>

      <button style={{...S.btnPrimary,width:"100%",marginBottom:16}} onClick={openAdd}>+ Add New Maid</button>

      {/* Add/Edit Form */}
      {showForm && (
        <div style={{...S.card,marginBottom:16,border:"2px solid #c8962a"}}>
          <div style={{fontWeight:700,marginBottom:12,color:"#c8962a"}}>{editingId?"Edit Maid":"New Maid"}</div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            <div>
              <label style={{fontSize:12,color:"#888",fontWeight:600}}>Type</label>
              <div style={{display:"flex",gap:6,marginTop:4,flexWrap:"wrap"}}>
                {MAID_TYPES.map(t=>(
                  <button key={t.val} onClick={()=>setForm({...form,type:t.val})} style={{
                    fontSize:12,padding:"5px 12px",borderRadius:20,border:"1.5px solid",cursor:"pointer",fontFamily:"Poppins,sans-serif",fontWeight:600,
                    background:form.type===t.val?"#1a6b3c":"#fff", borderColor:"#1a6b3c", color:form.type===t.val?"#fff":"#1a6b3c"
                  }}>{t.label}</button>
                ))}
              </div>
            </div>
            {[{label:"Full Name *",key:"name",ph:"e.g. Pranita"},{label:"Phone",key:"phone",ph:"Mobile number"},{label:"Monthly Salary (₹)",key:"salary",ph:"e.g. 5000",type:"number"},{label:"Work Days",key:"workDays",ph:"e.g. Mon-Sat"},{label:"Notes",key:"notes",ph:"Any details"}].map(f=>(
              <div key={f.key}>
                <label style={{fontSize:12,color:"#888",fontWeight:600}}>{f.label}</label>
                <input style={{...S.input,marginTop:4}} type={f.type||"text"} placeholder={f.ph} value={form[f.key]} onChange={e=>setForm({...form,[f.key]:e.target.value})}/>
              </div>
            ))}
            <div>
              <label style={{fontSize:12,color:"#888",fontWeight:600}}>Joining Date</label>
              <input type="date" style={{...S.select,width:"100%",marginTop:4,boxSizing:"border-box"}} value={form.joiningDate} onChange={e=>setForm({...form,joiningDate:e.target.value})}/>
            </div>
            {editingId && (
              <div style={{background:"#fff8e1",borderRadius:8,padding:"10px 12px",border:"1.5px solid #c8962a"}}>
                <label style={{fontSize:12,color:"#c8962a",fontWeight:700}}>📝 Reason for Change (optional)</label>
                <input style={{...S.input,marginTop:6}} placeholder="e.g. Salary revised, Role changed, Experience increment..."
                  value={form.changeReason} onChange={e=>setForm({...form,changeReason:e.target.value})}/>
                <div style={{fontSize:11,color:"#888",marginTop:4}}>This will be saved in rate change history</div>
              </div>
            )}
          </div>
          <div style={{display:"flex",gap:8,marginTop:12}}>
            <button style={S.btnPrimary} onClick={saveMaid}>{editingId?"Save Changes":"Add Maid"}</button>
            <button style={S.backBtn} onClick={()=>{setShowForm(false);resetForm();setEditingId(null);}}>Cancel</button>
          </div>
        </div>
      )}

      {maids.length===0 && !showForm && <div style={{textAlign:"center",color:"#aaa",padding:"32px 0"}}>No maids added yet.</div>}

      {maids.map(m => {
        const stats = getMonthStats(m);
        const sal = calcSalary(m);
        const todayAtt = (m.attendance||{})[today];
        const maidType = MAID_TYPES.find(t=>t.val===m.type)||MAID_TYPES[3];
        return (
          <div key={m.id} style={{...S.card,marginBottom:12,opacity:m.active?1:0.6,borderLeft:"4px solid #1a6b3c"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
              <div style={{cursor:"pointer",flex:1}} onClick={()=>setSelMaid(m.id)}>
                <div style={{fontWeight:800,fontSize:16}}>{maidType.label} {m.name}</div>
                <div style={{fontSize:12,color:"#666",marginTop:2}}>₹{m.salary}/month • {m.workDays}</div>
                {m.joiningDate&&<div style={{fontSize:11,color:"#aaa"}}>Joined: {m.joiningDate}</div>}
                {m.phone&&<div style={{fontSize:11,color:"#aaa"}}>📞 {m.phone}</div>}
              </div>
              {/* Edit / Delete buttons */}
              <div style={{display:"flex",gap:6,flexShrink:0}}>
                <button onClick={()=>openEdit(m)} style={{...S.backBtn,marginTop:0,fontSize:11,padding:"4px 10px"}}>✏️ Edit</button>
                <button onClick={()=>deleteMaid(m.id,m.name)} style={{...S.delBtn,width:"auto",padding:"0 10px",fontSize:11}}>🗑️</button>
              </div>
            </div>

            {/* This month stats */}
            <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>
              {[
                {l:"Present",v:stats.present,c:"#1a6b3c"},
                {l:"Absent",v:stats.absent,c:"#c0392b"},
                {l:"Half",v:stats.half,c:"#c8962a"},
                ...(maidType.trackHours?[{l:"Hours",v:stats.totalHours.toFixed(1),c:"#5b8dd9"}]:[]),
                ...(maidType.trackMeals?[{l:"Meals",v:stats.totalMeals,c:"#9c6dd8"}]:[]),
                {l:"Net Pay",v:,c:"#1a6b3c"},
              ].map(s=>(
                <div key={s.l} style={{background:"#f8f8f8",borderRadius:8,padding:"4px 10px",textAlign:"center"}}>
                  <div style={{fontSize:14,fontWeight:800,color:s.c}}>{s.v}</div>
                  <div style={{fontSize:10,color:"#aaa"}}>{s.l}</div>
                </div>
              ))}
            </div>

            {/* Quick attendance */}
            <div style={{borderTop:"1px solid #f0f0f0",paddingTop:10}}>
              <div style={{fontSize:12,color:"#888",marginBottom:6}}>Today ({today}):</div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
                {[{s:"present",l:"✅ Present",c:"#1a6b3c"},{s:"absent",l:"❌ Absent",c:"#c0392b"},{s:"half",l:"½ Half",c:"#c8962a"}].map(a=>(
                  <button key={a.s} onClick={()=>markAttendance(m.id,today,"status",todayAtt?.status===a.s?"":a.s)} style={{
                    fontSize:11,padding:"4px 10px",borderRadius:16,border:"1.5px solid",cursor:"pointer",fontFamily:"Poppins,sans-serif",fontWeight:600,
                    background:todayAtt?.status===a.s?a.c:"#fff", borderColor:a.c, color:todayAtt?.status===a.s?"#fff":a.c
                  }}>{a.l}</button>
                ))}
                {maidType.trackHours && todayAtt?.status==="present" && (
                  <div style={{display:"flex",alignItems:"center",gap:4}}>
                    <span style={{fontSize:11,color:"#888"}}>Hrs:</span>
                    <input type="number" step="0.5" style={{...S.input,width:60,padding:"3px 8px",fontSize:12}}
                      placeholder="0" value={todayAtt?.hours||""} onChange={e=>markAttendance(m.id,today,"hours",e.target.value)}/>
                  </div>
                )}
                {maidType.trackMeals && todayAtt?.status==="present" && (
                  <div style={{display:"flex",alignItems:"center",gap:4}}>
                    <span style={{fontSize:11,color:"#888"}}>Meals:</span>
                    <input type="number" style={{...S.input,width:55,padding:"3px 8px",fontSize:12}}
                      placeholder="0" value={todayAtt?.meals||""} onChange={e=>markAttendance(m.id,today,"meals",e.target.value)}/>
                  </div>
                )}
              </div>
            </div>

            <button style={{...S.btnPrimary,fontSize:12,padding:"5px 14px",marginTop:10}} onClick={()=>setSelMaid(m.id)}>
              View Full Details →
            </button>
          </div>
        );
      })}
    </div>
  );
}

function MaidDetail({ maid, onBack, onEdit, onDelete, updateMaid, showToast, today, thisMonth, getMonthStats, calcSalary, markAttendance }) {
  const [tab, setTab] = useState("attendance");
  const [leaveForm, setLeaveForm] = useState({ from:"", to:"", reason:"", type:"Casual" });
  const [advForm, setAdvForm] = useState({ amount:"", date:"", reason:"" });
  const [salaryNote, setSalaryNote] = useState("");
  const [payMode, setPayMode] = useState("GPay");
  const [txnId, setTxnId] = useState("");
  const [payDate, setPayDate] = useState(today);

  const stats = getMonthStats(maid);
  const salary = calcSalary(maid);
  const maidType = MAID_TYPES.find(t=>t.val===maid.type)||MAID_TYPES[3];

  const addLeave = () => {
    if (!leaveForm.from) return;
    updateMaid(maid.id, { leaves:[...(maid.leaves||[]),{id:Date.now(),...leaveForm,month:thisMonth}] });
    setLeaveForm({ from:"", to:"", reason:"", type:"Casual" });
    showToast("Leave recorded! 📅");
  };

  const addAdvance = () => {
    if (!advForm.amount) return;
    updateMaid(maid.id, { advances:[...(maid.advances||[]),{id:Date.now(),...advForm,month:thisMonth}] });
    setAdvForm({ amount:"", date:"", reason:"" });
    showToast("Advance recorded! 💰");
  };

  const markSalaryPaid = () => {
    const entry = { id:Date.now(), month:thisMonth, gross:salary.earned, advance:salary.advance, net:salary.net, note:salaryNote, payMode, txnId, paidOn:payDate||today };
    updateMaid(maid.id, { salaryHistory:[...(maid.salaryHistory||[]),entry] });
    setSalaryNote(""); setTxnId(""); setPayDate(today);
    showToast("Salary marked as paid! ✅");
  };

  const alreadyPaid = (maid.salaryHistory||[]).find(s=>s.month===thisMonth);

  // Calendar
  const year = new Date().getFullYear();
  const month = new Date().getMonth();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const firstDay = new Date(year,month,1).getDay();

  return (
    <div style={S.page}>
      <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:12}}>
        <button style={S.backBtn} onClick={onBack}>← Back</button>
        <button style={{...S.backBtn,marginTop:0}} onClick={onEdit}>✏️ Edit</button>
        <button style={{...S.delBtn,width:"auto",padding:"0 12px",height:32,fontSize:12}} onClick={onDelete}>🗑️ Delete</button>
      </div>

      <h2 style={{...S.pageTitle,marginTop:0}}>{maidType.label} {maid.name}</h2>
      <div style={{fontSize:13,color:"#666",marginTop:-10,marginBottom:16}}>
        {maid.workDays} • ₹{maid.salary}/month{maid.phone?:""}
        {maid.joiningDate&&}
      </div>

      {/* Stats */}
      <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
        {[
          {l:"Present",v:stats.present,c:"#1a6b3c"},{l:"Absent",v:stats.absent,c:"#c0392b"},{l:"Half Day",v:stats.half,c:"#c8962a"},
          ...(maidType.trackHours?[{l:"Total Hours",v:stats.totalHours.toFixed(1),c:"#5b8dd9"}]:[]),
          ...(maidType.trackMeals?[{l:"Total Meals",v:stats.totalMeals,c:"#9c6dd8"}]:[]),
          {l:"Gross",v:,c:"#5b8dd9"},{l:"Advance",v:,c:"#9c6dd8"},{l:"Net Pay",v:,c:"#1a6b3c"},
        ].map(s=>(
          <div key={s.l} style={{...S.card,textAlign:"center",padding:"8px 12px",flex:1,minWidth:70,borderTop:}}>
            <div style={{fontSize:16,fontWeight:800,color:s.c}}>{s.v}</div>
            <div style={{fontSize:10,color:"#aaa"}}>{s.l}</div>
          </div>
        ))}
      </div>

      {/* Tabs */}
      <div style={{display:"flex",gap:6,marginBottom:16,overflowX:"auto"}}>
        {[{id:"attendance",l:"📅 Attendance"},{id:"leaves",l:"🏖️ Leaves"},{id:"advance",l:"💰 Advance"},{id:"salary",l:"💵 Salary"},{id:"ratehistory",l:"📈 Rate History"}].map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{...S.tabBtn,flexShrink:0,...(tab===t.id?S.tabBtnActive:{})}}>{t.l}</button>
        ))}
      </div>

      {/* ATTENDANCE CALENDAR */}
      {tab==="attendance" && (
        <div>
          <div style={{fontWeight:700,marginBottom:12,color:"#1a6b3c"}}>
            {new Date().toLocaleDateString("en-US",{month:"long",year:"numeric"})}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:12}}>
            {["Su","Mo","Tu","We","Th","Fr","Sa"].map(d=>(
              <div key={d} style={{textAlign:"center",fontSize:10,fontWeight:700,color:"#888",padding:"3px 0"}}>{d}</div>
            ))}
            {Array.from({length:firstDay},(_,i)=><div key={"e"+i}/>)}
            {Array.from({length:daysInMonth},(_,i)=>{
              const dateStr = ;
              const att = (maid.attendance||{})[dateStr]||{};
              const status = att.status;
              const isSun = new Date(year,month,i+1).getDay()===0;
              const isToday2 = dateStr===today;
              const isFuture = dateStr>today;
              const bg = status==="present"?"#1a6b3c":status==="absent"?"#c0392b":status==="half"?"#c8962a":isSun?"#f0f0f0":"#fafafa";
              const cycle = status==="present"?"absent":status==="absent"?"half":status==="half"?"":"present";
              return (
                <div key={dateStr} onClick={()=>!isFuture&&!isSun&&markAttendance(maid.id,dateStr,"status",cycle)}
                  style={{background:bg,color:status?"#fff":isSun?"#aaa":"#2d2d2d",borderRadius:6,padding:"4px 2px",textAlign:"center",fontSize:11,fontWeight:700,cursor:isFuture||isSun?"default":"pointer",border:isToday2?"2px solid #c8962a":"2px solid transparent",minHeight:28,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
                  {i+1}
                  {maidType.trackHours&&status==="present"&&att.hours&&<div style={{fontSize:8,opacity:0.9}}>{att.hours}h</div>}
                  {maidType.trackMeals&&status==="present"&&att.meals&&<div style={{fontSize:8,opacity:0.9}}>{att.meals}m</div>}
                </div>
              );
            })}
          </div>
          {/* Hours/Meals entry for today */}
          {((maid.attendance||{})[today]?.status==="present") && (maidType.trackHours||maidType.trackMeals) && (
            <div style={{...S.card,marginTop:8}}>
              <div style={{fontWeight:700,marginBottom:8,fontSize:13,color:"#1a6b3c"}}>Today's Details</div>
              <div style={{display:"flex",gap:10,alignItems:"center"}}>
                {maidType.trackHours&&(
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <span style={{fontSize:13}}>⏰ Hours:</span>
                    <input type="number" step="0.5" style={{...S.input,width:70}} placeholder="0"
                      value={(maid.attendance||{})[today]?.hours||""} onChange={e=>markAttendance(maid.id,today,"hours",e.target.value)}/>
                  </div>
                )}
                {maidType.trackMeals&&(
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <span style={{fontSize:13}}>🍽️ Meals:</span>
                    <input type="number" style={{...S.input,width:65}} placeholder="0"
                      value={(maid.attendance||{})[today]?.meals||""} onChange={e=>markAttendance(maid.id,today,"meals",e.target.value)}/>
                  </div>
                )}
              </div>
            </div>
          )}
          <div style={{fontSize:11,color:"#aaa",marginTop:8}}>Tap date: Present → Absent → Half → Clear</div>
        </div>
      )}

      {/* LEAVES */}
      {tab==="leaves" && (
        <div>
          <div style={{...S.card,marginBottom:12,border:"1.5px solid #c5e0cc"}}>
            <div style={{fontWeight:700,marginBottom:10,color:"#1a6b3c"}}>Record Leave</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <div style={{flex:1}}><label style={{fontSize:11,color:"#888"}}>From</label><input type="date" style={{...S.select,width:"100%",marginTop:2,boxSizing:"border-box"}} value={leaveForm.from} onChange={e=>setLeaveForm({...leaveForm,from:e.target.value})}/></div>
              <div style={{flex:1}}><label style={{fontSize:11,color:"#888"}}>To</label><input type="date" style={{...S.select,width:"100%",marginTop:2,boxSizing:"border-box"}} value={leaveForm.to} onChange={e=>setLeaveForm({...leaveForm,to:e.target.value})}/></div>
              <select style={S.select} value={leaveForm.type} onChange={e=>setLeaveForm({...leaveForm,type:e.target.value})}><option>Casual</option><option>Sick</option><option>Personal</option><option>Unpaid</option></select>
              <input style={{...S.input,flex:2}} placeholder="Reason..." value={leaveForm.reason} onChange={e=>setLeaveForm({...leaveForm,reason:e.target.value})}/>
              <button style={S.btnPrimary} onClick={addLeave}>Add</button>
            </div>
          </div>
          {(maid.leaves||[]).length===0&&<p style={{color:"#aaa",fontSize:14,textAlign:"center",padding:20}}>No leaves recorded.</p>}
          {[...(maid.leaves||[])].reverse().map(l=>(
            <div key={l.id} style={{...S.card,marginBottom:6,borderLeft:"4px solid #5b8dd9"}}>
              <div style={{fontWeight:700}}>{l.from}{l.to&&l.to!==l.from?:""}</div>
              <div style={{fontSize:12,color:"#666"}}>{l.type}{l.reason?:""}</div>
            </div>
          ))}
        </div>
      )}

      {/* ADVANCE */}
      {tab==="advance" && (
        <div>
          <div style={{...S.card,marginBottom:12,border:"1.5px solid #c5e0cc"}}>
            <div style={{fontWeight:700,marginBottom:10,color:"#9c6dd8"}}>Give Advance</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <input type="number" style={{...S.input,flex:1}} placeholder="Amount (₹)" value={advForm.amount} onChange={e=>setAdvForm({...advForm,amount:e.target.value})}/>
              <input type="date" style={S.select} value={advForm.date} onChange={e=>setAdvForm({...advForm,date:e.target.value})}/>
              <input style={{...S.input,flex:2}} placeholder="Reason..." value={advForm.reason} onChange={e=>setAdvForm({...advForm,reason:e.target.value})}/>
              <button style={S.btnPrimary} onClick={addAdvance}>Add</button>
            </div>
          </div>
          <div style={{...S.card,marginBottom:12,background:"#f8f0ff",borderLeft:"4px solid #9c6dd8"}}>
            <div style={{fontSize:12,color:"#888"}}>This month advance</div>
            <div style={{fontSize:22,fontWeight:800,color:"#9c6dd8"}}>₹{salary.advance}</div>
            <div style={{fontSize:12,color:"#666"}}>Balance due: ₹{salary.net}</div>
          </div>
          {[...(maid.advances||[])].reverse().map(a=>(
            <div key={a.id} style={{...S.card,marginBottom:6,borderLeft:"4px solid #9c6dd8"}}>
              <div style={{fontWeight:700,color:"#9c6dd8"}}>₹{a.amount}</div>
              <div style={{fontSize:12,color:"#666"}}>{a.date}{a.reason?:""} • {a.month}</div>
            </div>
          ))}
        </div>
      )}

      {/* SALARY */}
      {tab==="salary" && (
        <div>
          <div style={{...S.card,marginBottom:12,border:"2px solid #1a6b3c"}}>
            <div style={{fontWeight:700,marginBottom:8,color:"#1a6b3c"}}>{new Date().toLocaleDateString("en-US",{month:"long",year:"numeric"})} Salary</div>
            {[
              {l:"Base Salary",v:},

    const updated = { ...gas, cleaning:[...(gas?.cleaning||[]), { id:Date.now(), ...form }] };
    setGas(updated);
    setForm({ date:"", type:"Full House", provider:"", amount:"", duration:"", areas:"", notes:"", nextDate:"" });
    setShowForm(false);
    showToast("Cleaning record saved! 🧹");
  };

  const del = (id) => setGas({ ...gas, cleaning:(gas?.cleaning||[]).filter(c=>c.id!==id) });
  const records = [...(gas?.cleaning||[])].reverse();
  const upcoming = (gas?.cleaning||[]).filter(c=>c.nextDate&&c.nextDate>=new Date().toISOString().slice(0,10));

  return (
    <div>
      {upcoming.length>0&&(
        <div style={{background:"#e8f5e9",border:"1.5px solid #1a6b3c",borderRadius:12,padding:"10px 14px",marginBottom:12}}>
          <div style={{fontWeight:700,color:"#1a6b3c",marginBottom:4}}>🔔 Upcoming Cleaning</div>
          {upcoming.map(c=>(
            <div key={c.id} style={{fontSize:13,color:"#555"}}>🧹 {c.type} on {c.nextDate}</div>
          ))}
        </div>
      )}
      <button style={{...S.btnPrimary,width:"100%",marginBottom:12}} onClick={()=>setShowForm(!showForm)}>
        {showForm?"Cancel":"🧹 + Add Cleaning Service"}
      </button>
      {showForm&&(
        <div style={{...S.card,marginBottom:12,border:"2px solid #1a6b3c"}}>
          <div style={{fontWeight:700,marginBottom:12,color:"#1a6b3c"}}>New Cleaning Service</div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            <div>
              <label style={{fontSize:12,color:"#888"}}>Service Type</label>
              <select style={{...S.select,width:"100%",marginTop:4,boxSizing:"border-box"}} value={form.type} onChange={e=>setForm({...form,type:e.target.value})}>
                {types.map(t=><option key={t}>{t}</option>)}
              </select>
            </div>
            <div style={{display:"flex",gap:8}}>
              <div style={{flex:1}}>
                <label style={{fontSize:12,color:"#888"}}>Date *</label>
                <input type="date" style={{...S.select,width:"100%",marginTop:4,boxSizing:"border-box"}} value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/>
              </div>
              <div style={{flex:1}}>
                <label style={{fontSize:12,color:"#888"}}>Amount (₹)</label>
                <input type="number" style={{...S.input,marginTop:4}} placeholder="₹" value={form.amount} onChange={e=>setForm({...form,amount:e.target.value})}/>
              </div>
            </div>
            <input style={S.input} placeholder="Provider/Company name..." value={form.provider} onChange={e=>setForm({...form,provider:e.target.value})}/>
            <input style={S.input} placeholder="Duration (e.g. 3 hours)" value={form.duration} onChange={e=>setForm({...form,duration:e.target.value})}/>
            <input style={S.input} placeholder="Areas covered (e.g. kitchen, bathrooms)" value={form.areas} onChange={e=>setForm({...form,areas:e.target.value})}/>
            <div>
              <label style={{fontSize:12,color:"#888"}}>Next Cleaning Date</label>
              <input type="date" style={{...S.select,width:"100%",marginTop:4,boxSizing:"border-box"}} value={form.nextDate} onChange={e=>setForm({...form,nextDate:e.target.value})}/>
            </div>
            <input style={S.input} placeholder="Notes..." value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})}/>
          </div>
          <button style={{...S.btnPrimary,marginTop:12,width:"100%"}} onClick={add}>Save Record</button>
        </div>
      )}
      {records.length===0&&!showForm&&<p style={{color:"#aaa",fontSize:14,textAlign:"center",padding:20}}>No cleaning records yet.</p>}
      {records.map(r=>(
        <div key={r.id} style={{...S.card,marginBottom:8,borderLeft:"4px solid #1a6b3c"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div style={{flex:1}}>
              <div style={{fontWeight:700}}>🧹 {r.type}</div>
              <div style={{fontSize:12,color:"#666"}}>📅 {r.date}{r.provider?` • ${r.provider}`:""}{r.amount?` • ₹${r.amount}`:""}</div>
              {r.duration&&<div style={{fontSize:12,color:"#555"}}>⏱️ {r.duration}</div>}
              {r.areas&&<div style={{fontSize:12,color:"#555"}}>📍 {r.areas}</div>}
              {r.nextDate&&<div style={{fontSize:12,color:"#c8962a",fontWeight:600}}>🔔 Next: {r.nextDate}</div>}
              {r.notes&&<div style={{fontSize:11,color:"#aaa"}}>{r.notes}</div>}
            </div>
            <button onClick={()=>del(r.id)} style={S.delBtn}>✕</button>
          </div>
        </div>
      ))}
    </div>
  );
}

// ─── HOME PLANNER ─────────────────────────────────────────────────────────────
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function HomePlanner({ user, planner, setPlanner, showToast }) {
  const [tab, setTab] = useState("weekly");
  const today = new Date();
  const todayDay = DAYS[today.getDay()];
  const thisMonth = MONTHS[today.getMonth()];

  const update = (section, key, value) => {
    const updated = { ...planner, [section]: { ...(planner?.[section]||{}), [key]: value } };
    setPlanner(updated);
  };

  return (
    <div style={S.page}>
      <h2 style={S.pageTitle}>📋 Home Planner</h2>
      <div style={{display:"flex",gap:6,marginBottom:16}}>
        {[{id:"weekly",l:"📅 Weekly"},{id:"monthly",l:"🗓️ Monthly (1st)"},{id:"quarterly",l:"📆 Quarterly (15th)"}].map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)}
            style={{...S.tabBtn,flex:1,fontSize:11,...(tab===t.id?S.tabBtnActive:{})}}>{t.l}</button>
        ))}
      </div>

      {/* WEEKLY — Sunday ka menu + chores plan */}
      {tab==="weekly" && (
        <div>
          <div style={{...S.card,marginBottom:10,background:"#fff8e1",border:"1.5px solid #c8962a"}}>
            <div style={{fontSize:12,color:"#c8962a",fontWeight:700,marginBottom:4}}>📍 Today: {todayDay}</div>
            <div style={{fontSize:12,color:"#888"}}>Every Sunday — fill next week's plan below</div>
          </div>

          {/* Sunday fixed tasks reminder */}
          <div style={{...S.card,marginBottom:12,borderLeft:"4px solid #c0392b"}}>
            <div style={{fontWeight:700,marginBottom:8,color:"#c0392b"}}>🔴 Sunday Fixed Tasks</div>
            {["Buy Sabzi","Kaushik milk prepare","Trash clear","Plan weekly menu"].map((task,i)=>{
              const key = "sun_fixed_"+i;
              const done = planner?.weekly?.[key];
              return (
                <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"6px 0",borderBottom:"1px solid #f5f5f5"}}>
                  <input type="checkbox" checked={!!done} style={{accentColor:"#c0392b",width:18,height:18}}
                    onChange={e=>update("weekly",key,e.target.checked)}/>
                  <span style={{fontSize:14,textDecoration:done?"line-through":"none",color:done?"#aaa":"#2d2d2d"}}>{task}</span>
                </div>
              );
            })}
          </div>

          {/* Weekly table */}
          <div style={{fontWeight:700,marginBottom:10,color:"#1a6b3c"}}>📋 Weekly Plan Table</div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
              <thead>
                <tr>
                  <th style={{...thStyle,background:"#1a6b3c",color:"#fff",width:80}}>Day</th>
                  <th style={{...thStyle,background:"#1a6b3c",color:"#fff"}}>🍳 Breakfast</th>
                  <th style={{...thStyle,background:"#1a6b3c",color:"#fff"}}>☀️ Lunch</th>
                  <th style={{...thStyle,background:"#1a6b3c",color:"#fff"}}>🌙 Dinner</th>
                  <th style={{...thStyle,background:"#1a6b3c",color:"#fff"}}>🧹 Chore</th>
                  <th style={{...thStyle,background:"#1a6b3c",color:"#fff"}}>👕 Laundry</th>
                  <th style={{...thStyle,background:"#1a6b3c",color:"#fff",width:130}}>Status</th>
                </tr>
              </thead>
              <tbody>
                {DAYS.map((day,i)=>{
                  const isToday = day===todayDay;
                  const status = planner?.weekly?.[day+"_status"]||"";
                  const statusColor = status==="done"?"#e8f5e9":status==="pending"?"#fff8e1":status==="postponed"?"#e3f2fd":status==="cancelled"?"#fde8e8":"#fff";
                  return (
                    <tr key={day} style={{background:isToday?"#f0faf4":statusColor}}>
                      <td style={{...tdStyle,fontWeight:700,color:isToday?"#1a6b3c":"#2d2d2d",background:isToday?"#e8f5e9":"#f8f8f8"}}>
                        {day.slice(0,3)}{isToday?" 📍":""}
                      </td>
                      {["breakfast","lunch","dinner","chore","laundry"].map(col=>(
                        <td key={col} style={tdStyle}>
                          <input style={{...cellInput,textDecoration:status==="cancelled"?"line-through":"none",opacity:status==="cancelled"?0.5:1}}
                            placeholder="-"
                            value={planner?.weekly?.[day+"_"+col]||""}
                            onChange={e=>update("weekly",day+"_"+col,e.target.value)}/>
                        </td>
                      ))}
                      <td style={{...tdStyle,minWidth:130}}>
                        <StatusPicker value={status} onChange={v=>update("weekly",day+"_status",v)}/>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <div style={{fontSize:11,color:"#aaa",marginTop:8}}>✏️ Tap any cell to edit • Data auto-saves</div>
        </div>
      )}

      {/* MONTHLY — 1st of every month */}
      {tab==="monthly" && (
        <div>
          <div style={{...S.card,marginBottom:12,background:"#e8f5e9",border:"1.5px solid #1a6b3c"}}>
            <div style={{fontWeight:700,color:"#1a6b3c",marginBottom:2}}>🗓️ Monthly Tasks — 1st of every month</div>
            <div style={{fontSize:12,color:"#555"}}>Current: {thisMonth}</div>
          </div>

          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
              <thead>
                <tr>
                  <th style={{...thStyle,background:"#1a6b3c",color:"#fff"}}>Month</th>
                  <th style={{...thStyle,background:"#1a6b3c",color:"#fff"}}>📋 Tasks / Plan</th>
                  <th style={{...thStyle,background:"#1a6b3c",color:"#fff",width:130}}>Status</th>
                </tr>
              </thead>
              <tbody>
                {MONTHS.map((month,i)=>{
                  const status = planner?.monthly?.[month+"_status"]||"";
                  const statusBg = status==="done"?"#e8f5e9":status==="pending"?"#fff8e1":status==="postponed"?"#e3f2fd":status==="cancelled"?"#fde8e8":"#fff";
                  return (
                  <tr key={month} style={{background:month===thisMonth?"#f0faf4":statusBg}}>
                    <td style={{...tdStyle,fontWeight:700,color:month===thisMonth?"#1a6b3c":"#2d2d2d",background:month===thisMonth?"#e8f5e9":"#f8f8f8"}}>
                      {month.slice(0,3)}{month===thisMonth?" 📍":""}
                    </td>
                    <td style={tdStyle}>
                      <input style={{...cellInput,textDecoration:status==="cancelled"?"line-through":"none"}} placeholder="Tasks for 1st..."
                        value={planner?.monthly?.[month+"_task"]||""}
                        onChange={e=>update("monthly",month+"_task",e.target.value)}/>
                    </td>
                    <td style={{...tdStyle,minWidth:130}}>
                      <StatusPicker value={status} onChange={v=>update("monthly",month+"_status",v)}/>
                    </td>
                  </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* QUARTERLY — every 15th */}
      {tab==="quarterly" && (
        <div>
          <div style={{...S.card,marginBottom:12,background:"#e3f2fd",border:"1.5px solid #5b8dd9"}}>
            <div style={{fontWeight:700,color:"#5b8dd9",marginBottom:2}}>📆 Quarterly Tasks — every 15th</div>
            <div style={{fontSize:12,color:"#555"}}>Q1: Jan-Mar • Q2: Apr-Jun • Q3: Jul-Sep • Q4: Oct-Dec</div>
          </div>

          {[
            {q:"Q1 (Jan-Mar)",key:"q1",months:"Jan 15 • Feb 15 • Mar 15"},
            {q:"Q2 (Apr-Jun)",key:"q2",months:"Apr 15 • May 15 • Jun 15"},
            {q:"Q3 (Jul-Sep)",key:"q3",months:"Jul 15 • Aug 15 • Sep 15"},
            {q:"Q4 (Oct-Dec)",key:"q4",months:"Oct 15 • Nov 15 • Dec 15"},
          ].map(({q,key,months})=>(
            <div key={key} style={{...S.card,marginBottom:10,borderLeft:"4px solid #5b8dd9"}}>
              <div style={{fontWeight:700,color:"#5b8dd9",marginBottom:4}}>{q}</div>
              <div style={{fontSize:11,color:"#aaa",marginBottom:8}}>{months}</div>
              <textarea style={{...S.input,height:70,resize:"none",fontSize:13}}
                placeholder="Deep cleaning tasks, AC service, pest control, water tank, etc..."
                value={planner?.quarterly?.[key+"_task"]||""}
                onChange={e=>update("quarterly",key+"_task",e.target.value)}/>
              <div style={{display:"flex",alignItems:"center",gap:8,marginTop:8}}>
                <span style={{fontSize:13,color:"#666"}}>Status:</span>
                <StatusPicker value={planner?.quarterly?.[key+"_status"]||""} onChange={v=>update("quarterly",key+"_status",v)}/>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

const thStyle = { padding:"8px 10px", textAlign:"left", fontWeight:700, fontSize:12, border:"1px solid #e0e0e0" };
const tdStyle = { padding:"4px 6px", border:"1px solid #e8e8e8", verticalAlign:"middle" };
const cellInput = { width:"100%", border:"none", background:"transparent", fontFamily:"Poppins,sans-serif", fontSize:12, outline:"none", padding:"4px 2px", minWidth:70 };

const STATUS_OPTIONS = [
  { val:"", label:"—", bg:"#f0f0f0", color:"#aaa" },
  { val:"pending", label:"⏳", bg:"#fff8e1", color:"#c8962a" },
  { val:"done", label:"✅", bg:"#e8f5e9", color:"#1a6b3c" },
  { val:"postponed", label:"📅", bg:"#e3f2fd", color:"#5b8dd9" },
  { val:"cancelled", label:"❌", bg:"#fde8e8", color:"#c0392b" },
];

function StatusPicker({ value, onChange }) {
  return (
    <div style={{display:"flex",gap:3,justifyContent:"center"}}>
      {STATUS_OPTIONS.map(s=>(
        <button key={s.val} onClick={()=>onChange(s.val===value?"":s.val)} style={{
          background:value===s.val?s.bg:"#f8f8f8",
          border:`1.5px solid ${value===s.val?s.color:"#e0e0e0"}`,
          borderRadius:6, padding:"2px 5px", cursor:"pointer",
          fontSize:13, fontWeight:value===s.val?700:400,
          transform:value===s.val?"scale(1.1)":"scale(1)",
          transition:"all 0.15s"
        }}>{s.label}</button>
      ))}
    </div>
  );
}
